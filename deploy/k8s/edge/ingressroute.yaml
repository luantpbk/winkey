# Traefik IngressRoute for Winkey on k3s (ADR-009, ADR-014)
# Reuses routing rules exactly from deploy/compose/traefik/dynamic.yml
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: winkey-ingress
  namespace: default
  labels:
    app.kubernetes.io/name: winkey-ingress
    app.kubernetes.io/part-of: winkey
spec:
  entryPoints:
    - web
  routes:
    # 1. Auth public endpoints (no forwardAuth): registration, login, refresh, well-known
    # NOTE: /v1/auth/verify is internal for gateway forwardAuth only and NOT publicly routed (contract)
    - match: '(Host(`winkey.vn`) || Host(`www.winkey.vn`)) && (PathPrefix(`/v1/auth/register`) || PathPrefix(`/v1/auth/login`) || PathPrefix(`/v1/auth/refresh`) || PathPrefix(`/.well-known`))'
      kind: Rule
      priority: 100
      middlewares:
        - name: strip-user-headers
          namespace: default
        - name: rate-limit
          namespace: default
      services:
        - name: auth-svc
          port: 3001
          namespace: default

    # 2. Auth protected endpoints (users, profile management, admin)
    # Excludes /v1/auth/verify so it matches no public route and returns Traefik 404
    - match: '(Host(`winkey.vn`) || Host(`www.winkey.vn`)) && ((PathPrefix(`/v1/auth`) && !Path(`/v1/auth/verify`)) || PathPrefix(`/v1/users`) || PathPrefix(`/v1/admin`))'
      kind: Rule
      priority: 90
      middlewares:
        - name: strip-user-headers
          namespace: default
        - name: auth-verify
          namespace: default
        - name: rate-limit
          namespace: default
      services:
        - name: auth-svc
          port: 3001
          namespace: default

    # 3. Upload service routes
    - match: '(Host(`winkey.vn`) || Host(`www.winkey.vn`)) && PathPrefix(`/v1/uploads`)'
      kind: Rule
      priority: 80
      middlewares:
        - name: strip-user-headers
          namespace: default
        - name: auth-verify
          namespace: default
        - name: rate-limit
          namespace: default
      services:
        - name: upload-svc
          port: 3002
          namespace: default

    # 4. Social service routes (comments, likes, channels, subscriptions, reports, moderation)
    # Higher priority (85) than video router (80) so /v1/videos/{id}/comments and /like route to social-svc
    - match: '(Host(`winkey.vn`) || Host(`www.winkey.vn`)) && (PathRegexp(`^/v1/videos/[^/]+/(comments|like)$`) || PathPrefix(`/v1/comments`) || PathPrefix(`/v1/channels`) || PathPrefix(`/v1/reports`) || PathPrefix(`/v1/moderation`) || Path(`/v1/me/subscriptions`))'
      kind: Rule
      priority: 85
      middlewares:
        - name: strip-user-headers
          namespace: default
        - name: auth-verify
          namespace: default
        - name: rate-limit
          namespace: default
      services:
        - name: social-svc
          port: 3004
          namespace: default

    # 5. Video & Search routes
    - match: '(Host(`winkey.vn`) || Host(`www.winkey.vn`)) && (PathPrefix(`/v1/videos`) || PathPrefix(`/v1/studio`) || PathPrefix(`/v1/search`))'
      kind: Rule
      priority: 80
      middlewares:
        - name: strip-user-headers
          namespace: default
        - name: auth-verify
          namespace: default
        - name: rate-limit
          namespace: default
      services:
        - name: video-svc
          port: 3003
          namespace: default

    # 6. Realtime service routes (WebSocket & ticket issuance)
    - match: '(Host(`winkey.vn`) || Host(`www.winkey.vn`)) && PathPrefix(`/v1/realtime`)'
      kind: Rule
      priority: 80
      middlewares:
        - name: strip-user-headers
          namespace: default
        - name: auth-verify
          namespace: default
        - name: rate-limit
          namespace: default
      services:
        - name: realtime-svc
          port: 3005
          namespace: default

    # 7. Smoke test route for header stripping verification
    - match: '(Host(`winkey.vn`) || Host(`www.winkey.vn`)) && PathPrefix(`/smoke/whoami`)'
      kind: Rule
      priority: 80
      middlewares:
        - name: strip-user-headers
          namespace: default
        - name: rate-limit
          namespace: default
      services:
        - name: whoami
          port: 80
          namespace: default

    # 8. Web Next.js fallback (explicitly excludes /v1 and /smoke to prevent API bleed)
    - match: '(Host(`winkey.vn`) || Host(`www.winkey.vn`)) && PathPrefix(`/`) && !PathPrefix(`/v1`) && !PathPrefix(`/smoke`)'
      kind: Rule
      priority: 10
      middlewares:
        - name: strip-user-headers
          namespace: default
        - name: rate-limit
          namespace: default
      services:
        - name: web-svc
          port: 3000
          namespace: default

    # 9. S3 Garage storage endpoint (presigned uploads and downloads)
    - match: 'Host(`s3.winkey.vn`)'
      kind: Rule
      priority: 50
      middlewares:
        - name: strip-user-headers
          namespace: default
      services:
        - name: garage-s3
          port: 3900
          namespace: default

    # 10. Media Garage web endpoint (HLS video segments)
    - match: 'Host(`media.winkey.vn`) || Host(`winkey-media.winkey.vn`)'
      kind: Rule
      priority: 50
      middlewares:
        - name: strip-user-headers
          namespace: default
      services:
        - name: garage-web
          port: 3902
          namespace: default

    # 11. Internal media access authorization for nginx auth_request (ADR-017 / SEC1-b)
    - match: 'Host(`media-auth.internal`) && PathPrefix(`/internal/media-access/`)'
      kind: Rule
      priority: 95
      middlewares:
        - name: strip-user-headers
          namespace: default
      services:
        - name: video-svc
          port: 3003
          namespace: default
