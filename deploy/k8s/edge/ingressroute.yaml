# Traefik IngressRoute for Winkey on k3s (ADR-009, ADR-014, ADR-017)
# Reuses routing rules from deploy/compose/traefik/dynamic.yml
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: winkey-ingress
  namespace: default
  labels:
    app.kubernetes.io/name: winkey-ingress
    app.kubernetes.io/part-of: winkey
spec:
  entryPoints:
    - web
  routes:
    # 1a. Auth public endpoints (external, with rate-limiting)
    # NOTE: /v1/auth/verify is internal for gateway forwardAuth only and NOT publicly routed (contract)
    - match: '(Host(`winkey.vn`) || Host(`www.winkey.vn`)) && (PathPrefix(`/v1/auth/register`) || PathPrefix(`/v1/auth/login`) || PathPrefix(`/v1/auth/refresh`) || PathPrefix(`/.well-known`))'
      kind: Rule
      priority: 100
      middlewares:
        - name: strip-user-headers
          namespace: default
        - name: rate-limit
          namespace: default
      services:
        - name: auth-svc
          port: 3001
          namespace: default

    # 1b. Auth public endpoints (in-cluster SSR, separate router without rate-limiting)
    - match: '(Host(`traefik.kube-system.svc`) || Host(`traefik.kube-system.svc.cluster.local`)) && (PathPrefix(`/v1/auth/register`) || PathPrefix(`/v1/auth/login`) || PathPrefix(`/v1/auth/refresh`) || PathPrefix(`/.well-known`))'
      kind: Rule
      priority: 100
      middlewares:
        - name: strip-user-headers
          namespace: default
      services:
        - name: auth-svc
          port: 3001
          namespace: default

    # 2a. Auth protected endpoints (external, with rate-limiting)
    # Excludes /v1/auth/verify so it matches no public route and returns Traefik 404
    - match: '(Host(`winkey.vn`) || Host(`www.winkey.vn`)) && ((PathPrefix(`/v1/auth`) && !Path(`/v1/auth/verify`)) || PathPrefix(`/v1/users`) || PathPrefix(`/v1/admin`))'
      kind: Rule
      priority: 90
      middlewares:
        - name: strip-user-headers
          namespace: default
        - name: auth-verify
          namespace: default
        - name: rate-limit
          namespace: default
      services:
        - name: auth-svc
          port: 3001
          namespace: default

    # 2b. Auth protected endpoints (in-cluster SSR, separate router without rate-limiting)
    - match: '(Host(`traefik.kube-system.svc`) || Host(`traefik.kube-system.svc.cluster.local`)) && ((PathPrefix(`/v1/auth`) && !Path(`/v1/auth/verify`)) || PathPrefix(`/v1/users`) || PathPrefix(`/v1/admin`))'
      kind: Rule
      priority: 90
      middlewares:
        - name: strip-user-headers
          namespace: default
        - name: auth-verify
          namespace: default
      services:
        - name: auth-svc
          port: 3001
          namespace: default

    # 3a. Upload service routes (external, with rate-limiting)
    - match: '(Host(`winkey.vn`) || Host(`www.winkey.vn`)) && PathPrefix(`/v1/uploads`)'
      kind: Rule
      priority: 80
      middlewares:
        - name: strip-user-headers
          namespace: default
        - name: auth-verify
          namespace: default
        - name: rate-limit
          namespace: default
      services:
        - name: upload-svc
          port: 3002
          namespace: default

    # 3b. Upload service routes (in-cluster SSR, separate router without rate-limiting)
    - match: '(Host(`traefik.kube-system.svc`) || Host(`traefik.kube-system.svc.cluster.local`)) && PathPrefix(`/v1/uploads`)'
      kind: Rule
      priority: 80
      middlewares:
        - name: strip-user-headers
          namespace: default
        - name: auth-verify
          namespace: default
      services:
        - name: upload-svc
          port: 3002
          namespace: default

    # 4a. Social service routes (external, with rate-limiting)
    # Higher priority (85) than video router (80) so /v1/videos/{id}/comments, /like, /playlist-membership route to social-svc
    - match: '(Host(`winkey.vn`) || Host(`www.winkey.vn`)) && (PathRegexp(`^/v1/videos/[^/]+/(comments|like|playlist-membership)$`) || PathPrefix(`/v1/comments`) || PathPrefix(`/v1/channels`) || PathPrefix(`/v1/reports`) || PathPrefix(`/v1/moderation`) || PathPrefix(`/v1/notifications`) || PathPrefix(`/v1/playlists`) || Path(`/v1/me/subscriptions`) || Path(`/v1/me/watch-later`))'
      kind: Rule
      priority: 85
      middlewares:
        - name: strip-user-headers
          namespace: default
        - name: auth-verify
          namespace: default
        - name: rate-limit
          namespace: default
      services:
        - name: social-svc
          port: 3004
          namespace: default

    # 4b. Social service routes (in-cluster SSR, separate router without rate-limiting)
    - match: '(Host(`traefik.kube-system.svc`) || Host(`traefik.kube-system.svc.cluster.local`)) && (PathRegexp(`^/v1/videos/[^/]+/(comments|like|playlist-membership)$`) || PathPrefix(`/v1/comments`) || PathPrefix(`/v1/channels`) || PathPrefix(`/v1/reports`) || PathPrefix(`/v1/moderation`) || PathPrefix(`/v1/notifications`) || PathPrefix(`/v1/playlists`) || Path(`/v1/me/subscriptions`) || Path(`/v1/me/watch-later`))'
      kind: Rule
      priority: 85
      middlewares:
        - name: strip-user-headers
          namespace: default
        - name: auth-verify
          namespace: default
      services:
        - name: social-svc
          port: 3004
          namespace: default

    # 5a. Video, Studio, Feed, Search & Playback routes (external, with rate-limiting)
    - match: '(Host(`winkey.vn`) || Host(`www.winkey.vn`)) && (PathPrefix(`/v1/videos`) || PathPrefix(`/v1/studio`) || PathPrefix(`/v1/feed`) || PathPrefix(`/v1/search`) || PathPrefix(`/v1/playback`))'
      kind: Rule
      priority: 80
      middlewares:
        - name: strip-user-headers
          namespace: default
        - name: auth-verify
          namespace: default
        - name: rate-limit
          namespace: default
      services:
        - name: video-svc
          port: 3003
          namespace: default

    # 5b. Video, Studio, Feed, Search & Playback routes (in-cluster SSR, separate router without rate-limiting)
    - match: '(Host(`traefik.kube-system.svc`) || Host(`traefik.kube-system.svc.cluster.local`)) && (PathPrefix(`/v1/videos`) || PathPrefix(`/v1/studio`) || PathPrefix(`/v1/feed`) || PathPrefix(`/v1/search`) || PathPrefix(`/v1/playback`))'
      kind: Rule
      priority: 80
      middlewares:
        - name: strip-user-headers
          namespace: default
        - name: auth-verify
          namespace: default
      services:
        - name: video-svc
          port: 3003
          namespace: default

    # 6a. Realtime service routes (external, with rate-limiting)
    - match: '(Host(`winkey.vn`) || Host(`www.winkey.vn`)) && PathPrefix(`/v1/realtime`)'
      kind: Rule
      priority: 80
      middlewares:
        - name: strip-user-headers
          namespace: default
        - name: auth-verify
          namespace: default
        - name: rate-limit
          namespace: default
      services:
        - name: realtime-svc
          port: 3005
          namespace: default

    # 6b. Realtime service routes (in-cluster SSR, separate router without rate-limiting)
    - match: '(Host(`traefik.kube-system.svc`) || Host(`traefik.kube-system.svc.cluster.local`)) && PathPrefix(`/v1/realtime`)'
      kind: Rule
      priority: 80
      middlewares:
        - name: strip-user-headers
          namespace: default
        - name: auth-verify
          namespace: default
      services:
        - name: realtime-svc
          port: 3005
          namespace: default

    # 7. Smoke test route for header stripping verification
    - match: '(Host(`winkey.vn`) || Host(`www.winkey.vn`) || Host(`traefik.kube-system.svc`) || Host(`traefik.kube-system.svc.cluster.local`)) && PathPrefix(`/smoke/whoami`)'
      kind: Rule
      priority: 80
      middlewares:
        - name: strip-user-headers
          namespace: default
        - name: rate-limit
          namespace: default
      services:
        - name: whoami
          port: 80
          namespace: default

    # 8. Web Next.js fallback (explicitly excludes /v1 and /smoke to prevent API bleed)
    - match: '(Host(`winkey.vn`) || Host(`www.winkey.vn`)) && PathPrefix(`/`) && !PathPrefix(`/v1`) && !PathPrefix(`/smoke`)'
      kind: Rule
      priority: 10
      middlewares:
        - name: strip-user-headers
          namespace: default
        - name: rate-limit
          namespace: default
      services:
        - name: web-svc
          port: 3000
          namespace: default

    # 9. Media origin endpoint (HLS video segments)
    - match: 'Host(`media.winkey.vn`) || Host(`winkey-media.winkey.vn`)'
      kind: Rule
      priority: 50
      middlewares:
        - name: strip-user-headers
          namespace: default
      services:
        - name: media-origin
          port: 8080
          namespace: default

    # 10. Internal media access authorization for nginx auth_request (ADR-017 / SEC1-b)
    - match: 'Host(`media-auth.internal`) && PathPrefix(`/internal/media-access/`)'
      kind: Rule
      priority: 95
      middlewares:
        - name: internal-media-allowlist
          namespace: default
        - name: strip-user-headers
          namespace: default
      services:
        - name: video-svc
          port: 3003
          namespace: default
