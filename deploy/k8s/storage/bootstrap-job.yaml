# Idempotent bootstrap Job for Garage on k3s edge-1
apiVersion: batch/v1
kind: Job
metadata:
  name: garage-bootstrap
  namespace: default
  labels:
    app.kubernetes.io/name: garage-bootstrap
    app.kubernetes.io/part-of: winkey
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: garage-bootstrap
        app.kubernetes.io/part-of: winkey
    spec:
      serviceAccountName: garage-bootstrap-sa
      restartPolicy: OnFailure
      containers:
        - name: bootstrap
          image: alpine/k8s:1.32.0
          command:
            - /bin/bash
            - /scripts/bootstrap.sh
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: scripts
          configMap:
            name: garage-bootstrap-script
            defaultMode: 0755
