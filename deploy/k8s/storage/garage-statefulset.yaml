# Headless Service for Garage StatefulSet DNS identity
apiVersion: v1
kind: Service
metadata:
  name: garage-headless
  namespace: default
  labels:
    app.kubernetes.io/name: garage
    app.kubernetes.io/part-of: winkey
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: garage
  ports:
    - name: s3-api
      port: 3900
      targetPort: 3900
    - name: rpc
      port: 3901
      targetPort: 3901
    - name: web
      port: 3902
      targetPort: 3902
    - name: admin
      port: 3903
      targetPort: 3903
---
# Garage StatefulSet on k3s edge-1 (ADR-004, ADR-013, ADR-015)
# Selected by garage-s3 (:3900), garage-web (:3902) and garage-s3-nodeport (:30900)
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: garage
  namespace: default
  labels:
    app.kubernetes.io/name: garage
    app.kubernetes.io/part-of: winkey
spec:
  serviceName: garage-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: garage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: garage
        app.kubernetes.io/part-of: winkey
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: garage
                topologyKey: kubernetes.io/hostname
      containers:
        - name: garage
          image: dxflrs/garage:v1.3.1
          command:
            - /garage
            - -c
            - /etc/garage/garage.toml
            - server
          ports:
            - name: s3-api
              containerPort: 3900
              protocol: TCP
            - name: rpc
              containerPort: 3901
              protocol: TCP
            - name: web
              containerPort: 3902
              protocol: TCP
            - name: admin
              containerPort: 3903
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /etc/garage/garage.toml
              subPath: garage.toml
              readOnly: true
            - name: rpc-secret
              mountPath: /etc/garage/secrets/rpc_secret
              subPath: rpc_secret
              readOnly: true
            - name: admin-token
              mountPath: /etc/garage/secrets/admin_token
              subPath: admin_token
              readOnly: true
            - name: meta
              mountPath: /var/lib/garage/meta
            - name: data
              mountPath: /var/lib/garage/data
          livenessProbe:
            exec:
              command:
                - /garage
                - -c
                - /etc/garage/garage.toml
                - status
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - /garage
                - -c
                - /etc/garage/garage.toml
                - status
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: garage-config
        - name: rpc-secret
          secret:
            secretName: garage-rpc-secret
            defaultMode: 0400
        - name: admin-token
          secret:
            secretName: garage-admin-token
            defaultMode: 0400
  volumeClaimTemplates:
    - metadata:
        name: meta
      spec:
        accessModes: ['ReadWriteOnce']
        storageClassName: local-path
        resources:
          requests:
            storage: 1Gi
    - metadata:
        name: data
      spec:
        accessModes: ['ReadWriteOnce']
        storageClassName: local-path
        resources:
          requests:
            storage: 70Gi
