# Garage configuration for Winkey on k3s edge-1 (ADR-004, ADR-013, ADR-014)
# Namespace: default
apiVersion: v1
kind: ConfigMap
metadata:
  name: garage-config
  namespace: default
  labels:
    app.kubernetes.io/name: garage
    app.kubernetes.io/part-of: winkey
data:
  garage.toml: |
    metadata_dir = "/var/lib/garage/meta"
    data_dir = "/var/lib/garage/data"

    # db_engine: sqlite is chosen over lmdb because sqlite operates reliably on a single file
    # without large virtual memory mapping overhead, and is fully supported in Garage v1.0.1.
    db_engine = "sqlite"

    # replication_factor = 1 for single-node development on edge-1 (ADR-013).
    # Note: Garage does not support in-place RF upgrades. Moving to RF 2 requires a fresh cluster
    # and rclone data migration (INFRASTRUCTURE §0).
    replication_factor = 1

    rpc_bind_addr = "0.0.0.0:3901"
    rpc_secret_file = "/etc/garage/secrets/rpc_secret"

    [s3_api]
    s3_region = "garage"
    api_bind_addr = "0.0.0.0:3900"
    root_domain = ".s3.winkey.vn"

    [s3_web]
    bind_addr = "0.0.0.0:3902"
    root_domain = ".winkey.vn"
    index = "index.html"

    [admin]
    api_bind_addr = "0.0.0.0:3903"
    admin_token_file = "/etc/garage/secrets/admin_token"
