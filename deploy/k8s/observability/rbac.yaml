apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-state-metrics
  namespace: observability
  labels:
    app.kubernetes.io/name: kube-state-metrics
    app.kubernetes.io/part-of: winkey
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-state-metrics
  labels:
    app.kubernetes.io/name: kube-state-metrics
    app.kubernetes.io/part-of: winkey
rules:
  - apiGroups: ['']
    resources:
      - configmaps
      - secrets
      - nodes
      - pods
      - services
      - serviceaccounts
      - resourcequotas
      - replicationcontrollers
      - limitranges
      - persistentvolumeclaims
      - persistentvolumes
      - namespaces
      - endpoints
    verbs: ['list', 'watch']
  - apiGroups: ['apps']
    resources:
      - statefulsets
      - daemonsets
      - deployments
      - replicasets
    verbs: ['list', 'watch']
  - apiGroups: ['batch']
    resources:
      - cronjobs
      - jobs
    verbs: ['list', 'watch']
  - apiGroups: ['autoscaling']
    resources:
      - horizontalpodautoscalers
    verbs: ['list', 'watch']
  - apiGroups: ['policy']
    resources:
      - poddisruptionbudgets
    verbs: ['list', 'watch']
  - apiGroups: ['networking.k8s.io']
    resources:
      - networkpolicies
      - ingressclasses
      - ingresses
    verbs: ['list', 'watch']
  - apiGroups: ['storage.k8s.io']
    resources:
      - storageclasses
      - volumeattachments
    verbs: ['list', 'watch']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-state-metrics
  labels:
    app.kubernetes.io/name: kube-state-metrics
    app.kubernetes.io/part-of: winkey
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-state-metrics
subjects:
  - kind: ServiceAccount
    name: kube-state-metrics
    namespace: observability
