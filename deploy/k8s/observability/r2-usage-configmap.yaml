apiVersion: v1
kind: ConfigMap
metadata:
  name: r2-usage-script
  namespace: observability
  labels:
    app.kubernetes.io/name: r2-usage
    app.kubernetes.io/part-of: winkey
data:
  r2_usage_exporter.py: |
    #!/usr/bin/env python3
    """
    Cloudflare R2 Usage & Cost Prometheus Exporter (ADR-032 / INF-R2b)
    Periodically queries Cloudflare GraphQL Analytics API every 15 minutes
    to report storage, operations, free-tier quota ratios, and projected month-end costs.
    """

    import calendar
    import datetime
    import http.server
    import json
    import logging
    import os
    import sys
    import threading
    import time
    import urllib.error
    import urllib.request

    logging.basicConfig(
        level=logging.INFO,
        format='{"time":"%(asctime)s","level":"%(levelname)s","msg":"%(message)s"}',
        datefmt="%Y-%m-%dT%H:%M:%SZ",
    )
    logger = logging.getLogger("r2-usage")

    # Configuration from Environment
    ACCOUNT_ID = os.environ.get("CLOUDFLARE_ACCOUNT_ID") or os.environ.get(
        "CF_ACCOUNT_ID", "2588dff2e56bf889918bc5c7af53ad86"
    )
    API_TOKEN = os.environ.get("CLOUDFLARE_API_TOKEN") or os.environ.get("CF_API_TOKEN", "")
    EXPORTER_PORT = int(os.environ.get("EXPORTER_PORT", "9095"))
    EXPORTER_HOST = os.environ.get("EXPORTER_HOST", "0.0.0.0")
    SCRAPE_INTERVAL = int(os.environ.get("SCRAPE_INTERVAL_SECONDS", "900"))  # 15 minutes
    DEFAULT_BUCKETS = os.environ.get(
        "R2_BUCKETS", "winkey-raw,winkey-media,winkey-pg-backup,winkey-backup"
    ).split(",")

    GRAPHQL_URL = "https://api.cloudflare.com/client/v4/graphql"

    # Free tier limits (monthly)
    FREE_STORAGE_GB = 10.0
    FREE_CLASS_A_OPS = 1_000_000.0
    FREE_CLASS_B_OPS = 10_000_000.0

    # Pricing beyond free tier (USD)
    PRICE_STORAGE_PER_GB = 0.015
    PRICE_CLASS_A_PER_MILLION = 4.50
    PRICE_CLASS_B_PER_MILLION = 0.36

    CLASS_A_ACTIONS = {
        "PutObject",
        "CopyObject",
        "CreateMultipartUpload",
        "UploadPart",
        "UploadPartCopy",
        "CompleteMultipartUpload",
        "ListObjects",
        "ListObjectsV2",
        "ListMultipartUploads",
        "ListParts",
    }

    CLASS_B_ACTIONS = {
        "GetObject",
        "HeadObject",
    }

    # Thread-safe metrics cache
    metrics_lock = threading.Lock()
    cached_metrics = {
        "scrape_success": 0,
        "last_scrape_ts": 0,
        "storage_bytes": {b.strip(): 0 for b in DEFAULT_BUCKETS},
        "storage_objects": {b.strip(): 0 for b in DEFAULT_BUCKETS},
        "ops_class_a": {b.strip(): 0 for b in DEFAULT_BUCKETS},
        "ops_class_b": {b.strip(): 0 for b in DEFAULT_BUCKETS},
        "cost_projected_storage": 0.0,
        "cost_projected_class_a": 0.0,
        "cost_projected_class_b": 0.0,
        "cost_projected_total": 0.0,
        "quota_ratio_storage": 0.0,
        "quota_ratio_class_a": 0.0,
        "quota_ratio_class_b": 0.0,
    }


    def query_cloudflare_graphql(account_id: str, token: str, start_iso: str, end_iso: str):
        query = """
        query GetR2Usage($accountTag: String!, $start: Time!, $end: Time!) {
          viewer {
            accounts(filter: { accountTag: $accountTag }) {
              r2StorageAdaptiveGroups(
                filter: { datetime_geq: $start, datetime_leq: $end }
                limit: 100
              ) {
                max {
                  payloadSize
                  objectCount
                }
                dimensions {
                  bucketName
                }
              }
              r2OperationsAdaptiveGroups(
                filter: { datetime_geq: $start, datetime_leq: $end }
                limit: 1000
              ) {
                sum {
                  requests
                }
                dimensions {
                  bucketName
                  actionType
                }
              }
            }
          }
        }
        """
        payload = {
            "query": query,
            "variables": {
                "accountTag": account_id,
                "start": start_iso,
                "end": end_iso,
            },
        }

        req = urllib.request.Request(
            GRAPHQL_URL,
            data=json.dumps(payload).encode("utf-8"),
            headers={
                "Authorization": f"Bearer {token}",
                "Content-Type": "application/json",
                "User-Agent": "winkey-r2-usage-exporter/1.0",
            },
            method="POST",
        )

        with urllib.request.urlopen(req, timeout=30) as resp:
            return json.loads(resp.read().decode("utf-8"))


    def query_bucket_usage_rest(account_id: str, token: str, bucket_name: str):
        url = f"https://api.cloudflare.com/client/v4/accounts/{account_id}/r2/buckets/{bucket_name}/usage"
        req = urllib.request.Request(
            url,
            headers={
                "Authorization": f"Bearer {token}",
                "Content-Type": "application/json",
                "User-Agent": "winkey-r2-usage-exporter/1.0",
            },
            method="GET",
        )
        try:
            with urllib.request.urlopen(req, timeout=15) as resp:
                data = json.loads(resp.read().decode("utf-8"))
                if data.get("success") and "result" in data:
                    return data["result"]
        except Exception as e:
            logger.debug(f"REST bucket usage query failed for {bucket_name}: {e}")
        return None


    def collect_metrics():
        now = datetime.datetime.now(datetime.timezone.utc)
        start_of_month = datetime.datetime(now.year, now.month, 1, 0, 0, 0, tzinfo=datetime.timezone.utc)
        days_in_month = calendar.monthrange(now.year, now.month)[1]
        elapsed_days = max(1.0, (now - start_of_month).total_seconds() / 86400.0)
        projection_factor = float(days_in_month) / elapsed_days

        storage_bytes = {b.strip(): 0 for b in DEFAULT_BUCKETS}
        storage_objects = {b.strip(): 0 for b in DEFAULT_BUCKETS}
        ops_class_a = {b.strip(): 0 for b in DEFAULT_BUCKETS}
        ops_class_b = {b.strip(): 0 for b in DEFAULT_BUCKETS}
        scrape_success = 0

        if not API_TOKEN:
            logger.warning("CLOUDFLARE_API_TOKEN is not configured; serving baseline metrics")
        else:
            try:
                start_iso = start_of_month.strftime("%Y-%m-%dT%H:%M:%SZ")
                end_iso = now.strftime("%Y-%m-%dT%H:%M:%SZ")
                data = query_cloudflare_graphql(ACCOUNT_ID, API_TOKEN, start_iso, end_iso)

                if "errors" in data and data["errors"]:
                    logger.error(f"GraphQL API errors: {data['errors']}")
                else:
                    accounts = data.get("data", {}).get("viewer", {}).get("accounts", [])
                    if accounts:
                        acct = accounts[0]
                        # Parse Storage
                        storage_groups = acct.get("r2StorageAdaptiveGroups", [])
                        for group in storage_groups:
                            bname = group.get("dimensions", {}).get("bucketName", "")
                            if not bname:
                                continue
                            if bname not in storage_bytes:
                                storage_bytes[bname] = 0
                                storage_objects[bname] = 0
                                ops_class_a[bname] = 0
                                ops_class_b[bname] = 0
                            max_metrics = group.get("max", {}) or {}
                            psize = max_metrics.get("payloadSize") or 0
                            objs = max_metrics.get("objectCount") or 0
                            storage_bytes[bname] = max(storage_bytes[bname], int(psize))
                            storage_objects[bname] = max(storage_objects[bname], int(objs))

                        # Parse Operations
                        op_groups = acct.get("r2OperationsAdaptiveGroups", [])
                        for group in op_groups:
                            bname = group.get("dimensions", {}).get("bucketName", "")
                            if not bname:
                                continue
                            if bname not in ops_class_a:
                                ops_class_a[bname] = 0
                                ops_class_b[bname] = 0
                                storage_bytes[bname] = 0
                                storage_objects[bname] = 0
                            action = group.get("dimensions", {}).get("actionType", "")
                            reqs = (group.get("sum", {}) or {}).get("requests") or 0
                            req_count = int(reqs)

                            if action in CLASS_A_ACTIONS:
                                ops_class_a[bname] += req_count
                            elif action in CLASS_B_ACTIONS:
                                ops_class_b[bname] += req_count

                        # If storage was empty via GraphQL (e.g. reporting delay), try REST usage
                        for bname in DEFAULT_BUCKETS:
                            b = bname.strip()
                            if storage_bytes[b] == 0:
                                rest_res = query_bucket_usage_rest(ACCOUNT_ID, API_TOKEN, b)
                                if rest_res:
                                    storage_bytes[b] = int(rest_res.get("payloadSize") or 0)
                                    storage_objects[b] = int(rest_res.get("objectCount") or 0)

                        scrape_success = 1
                        logger.info("Cloudflare R2 usage scrape completed successfully")
            except Exception as e:
                logger.error(f"Failed to query Cloudflare GraphQL API: {e}")
                scrape_success = 0

        # Calculate Costs & Quotas
        total_bytes = sum(storage_bytes.values())
        total_storage_gb = total_bytes / (1024.0**3)

        billable_storage_gb = max(0.0, total_storage_gb - FREE_STORAGE_GB)
        cost_storage = billable_storage_gb * PRICE_STORAGE_PER_GB

        total_ops_a = sum(ops_class_a.values())
        projected_ops_a = total_ops_a * projection_factor
        billable_ops_a = max(0.0, projected_ops_a - FREE_CLASS_A_OPS)
        cost_class_a = (billable_ops_a / 1_000_000.0) * PRICE_CLASS_A_PER_MILLION

        total_ops_b = sum(ops_class_b.values())
        projected_ops_b = total_ops_b * projection_factor
        billable_ops_b = max(0.0, projected_ops_b - FREE_CLASS_B_OPS)
        cost_class_b = (billable_ops_b / 1_000_000.0) * PRICE_CLASS_B_PER_MILLION

        cost_total = cost_storage + cost_class_a + cost_class_b

        quota_storage = total_storage_gb / FREE_STORAGE_GB
        quota_class_a = projected_ops_a / FREE_CLASS_A_OPS
        quota_class_b = projected_ops_b / FREE_CLASS_B_OPS

        with metrics_lock:
            cached_metrics["scrape_success"] = scrape_success
            cached_metrics["last_scrape_ts"] = int(time.time())
            cached_metrics["storage_bytes"] = storage_bytes
            cached_metrics["storage_objects"] = storage_objects
            cached_metrics["ops_class_a"] = ops_class_a
            cached_metrics["ops_class_b"] = ops_class_b
            cached_metrics["cost_projected_storage"] = round(cost_storage, 4)
            cached_metrics["cost_projected_class_a"] = round(cost_class_a, 4)
            cached_metrics["cost_projected_class_b"] = round(cost_class_b, 4)
            cached_metrics["cost_projected_total"] = round(cost_total, 4)
            cached_metrics["quota_ratio_storage"] = round(quota_storage, 4)
            cached_metrics["quota_ratio_class_a"] = round(quota_class_a, 4)
            cached_metrics["quota_ratio_class_b"] = round(quota_class_b, 4)


    def render_prometheus_metrics():
        with metrics_lock:
            m = dict(cached_metrics)

        lines = [
            "# HELP r2_usage_scrape_success Whether the last Cloudflare R2 usage scrape was successful",
            "# TYPE r2_usage_scrape_success gauge",
            f"r2_usage_scrape_success {m['scrape_success']}",
            "",
            "# HELP r2_usage_last_scrape_timestamp_seconds Unix timestamp of last scrape",
            "# TYPE r2_usage_last_scrape_timestamp_seconds gauge",
            f"r2_usage_last_scrape_timestamp_seconds {m['last_scrape_ts']}",
            "",
            "# HELP r2_storage_bytes Current stored payload bytes per bucket",
            "# TYPE r2_storage_bytes gauge",
        ]
        for bucket, b_bytes in m["storage_bytes"].items():
            lines.append(f'r2_storage_bytes{{bucket="{bucket}"}} {b_bytes}')

        lines.extend([
            "",
            "# HELP r2_storage_objects Current object count per bucket",
            "# TYPE r2_storage_objects gauge",
        ])
        for bucket, count in m["storage_objects"].items():
            lines.append(f'r2_storage_objects{{bucket="{bucket}"}} {count}')

        lines.extend([
            "",
            "# HELP r2_operations_mtd_total Month-to-date operation counts by bucket and class",
            "# TYPE r2_operations_mtd_total counter",
        ])
        for bucket, ops in m["ops_class_a"].items():
            lines.append(f'r2_operations_mtd_total{{bucket="{bucket}",class="A"}} {ops}')
        for bucket, ops in m["ops_class_b"].items():
            lines.append(f'r2_operations_mtd_total{{bucket="{bucket}",class="B"}} {ops}')

        lines.extend([
            "",
            "# HELP r2_cost_projected_usd Projected month-end total cost in USD",
            "# TYPE r2_cost_projected_usd gauge",
            f"r2_cost_projected_usd {m['cost_projected_total']}",
            "",
            "# HELP r2_cost_projected_storage_usd Projected month-end storage cost in USD",
            "# TYPE r2_cost_projected_storage_usd gauge",
            f"r2_cost_projected_storage_usd {m['cost_projected_storage']}",
            "",
            "# HELP r2_cost_projected_class_a_usd Projected month-end Class A operations cost in USD",
            "# TYPE r2_cost_projected_class_a_usd gauge",
            f"r2_cost_projected_class_a_usd {m['cost_projected_class_a']}",
            "",
            "# HELP r2_cost_projected_class_b_usd Projected month-end Class B operations cost in USD",
            "# TYPE r2_cost_projected_class_b_usd gauge",
            f"r2_cost_projected_class_b_usd {m['cost_projected_class_b']}",
            "",
            "# HELP r2_free_tier_quota_used_ratio Ratio of free-tier quota consumed (projected for monthly counters)",
            "# TYPE r2_free_tier_quota_used_ratio gauge",
            f'r2_free_tier_quota_used_ratio{{resource="storage"}} {m["quota_ratio_storage"]}',
            f'r2_free_tier_quota_used_ratio{{resource="class_a"}} {m["quota_ratio_class_a"]}',
            f'r2_free_tier_quota_used_ratio{{resource="class_b"}} {m["quota_ratio_class_b"]}',
            "",
        ])
        return "\n".join(lines) + "\n"


    class ExporterHandler(http.server.BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path == "/metrics":
                output = render_prometheus_metrics().encode("utf-8")
                self.send_response(200)
                self.send_header("Content-Type", "text/plain; version=0.0.4; charset=utf-8")
                self.send_header("Content-Length", str(len(output)))
                self.end_headers()
                self.wfile.write(output)
            elif self.path in ("/healthz", "/readyz"):
                self.send_response(200)
                self.send_header("Content-Type", "application/json")
                resp = json.dumps({"status": "ok"}).encode("utf-8")
                self.send_header("Content-Length", str(len(resp)))
                self.end_headers()
                self.wfile.write(resp)
            else:
                self.send_response(404)
                self.end_headers()

        def log_message(self, format, *args):
            # Silence routine access logs in server console
            pass


    def scrape_loop():
        while True:
            try:
                collect_metrics()
            except Exception as e:
                logger.error(f"Error in collection loop: {e}")
            time.sleep(SCRAPE_INTERVAL)


    def main():
        if "--once" in sys.argv:
            collect_metrics()
            sys.stdout.write(render_prometheus_metrics())
            sys.exit(0)

        # Initial scrape on startup
        collect_metrics()

        # Background thread for periodic scrape every 15 min
        t = threading.Thread(target=scrape_loop, daemon=True)
        t.start()

        server = http.server.ThreadingHTTPServer((EXPORTER_HOST, EXPORTER_PORT), ExporterHandler)
        logger.info(f"Starting r2-usage exporter on {EXPORTER_HOST}:{EXPORTER_PORT}")
        try:
            server.serve_forever()
        except KeyboardInterrupt:
            logger.info("Shutting down exporter")
            server.server_close()


    if __name__ == "__main__":
        main()
