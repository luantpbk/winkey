apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - rbac.yaml
  - vmagent-pvc.yaml
  - vmagent-configmap.yaml
  - vmagent-deployment.yaml
  - alloy-configmap.yaml
  - alloy-daemonset.yaml
  - node-exporter-daemonset.yaml
  - kube-state-metrics-deployment.yaml
  - nats-exporter-deployment.yaml
  - r2-usage-deployment.yaml
  - r2-usage-service.yaml

configMapGenerator:
  - name: r2-usage-script
    namespace: observability
    files:
      - r2_usage_exporter.py=scripts/r2_usage_exporter.py
