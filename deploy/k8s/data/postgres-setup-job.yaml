apiVersion: batch/v1
kind: Job
metadata:
  name: winkey-pg-setup
  namespace: default
  labels:
    app.kubernetes.io/name: postgres-setup
    app.kubernetes.io/part-of: winkey
spec:
  backoffLimit: 5
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-setup
        app.kubernetes.io/part-of: winkey
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-pg
          image: ghcr.io/cloudnative-pg/postgresql:17.4
          command:
            - /bin/sh
            - -c
            - |
              until pg_isready -h winkey-pg-rw -p 5432 -U winkey_owner -d winkey; do
                echo "Waiting for winkey-pg-rw..."
                sleep 2
              done
              echo "PostgreSQL is ready!"
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: winkey-pg-owner
                  key: password
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi

        - name: migrate
          image: migrate/migrate:v4.18.3
          command:
            - /bin/sh
            - -c
            - |
              echo "Running migrations..."
              migrate -path /migrations -database "postgres://$(PGUSER):$(PGPASSWORD)@winkey-pg-rw:5432/winkey?sslmode=require" up
              echo "Migrations applied successfully."
          env:
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: winkey-pg-owner
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: winkey-pg-owner
                  key: password
          volumeMounts:
            - name: migrations
              mountPath: /migrations
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi

      containers:
        - name: grants
          image: ghcr.io/cloudnative-pg/postgresql:17.4
          command:
            - /bin/sh
            - -c
            - |
              echo "Applying role grants..."
              psql -h winkey-pg-rw -p 5432 -U winkey_owner -d winkey -f /scripts/grants.sql
              echo "Grants applied successfully."
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: winkey-pg-owner
                  key: password
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi

      volumes:
        - name: migrations
          configMap:
            name: winkey-pg-migrations
        - name: scripts
          configMap:
            name: winkey-pg-scripts
