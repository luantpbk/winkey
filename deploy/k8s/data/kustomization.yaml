      - migrations/000004_transcode_heartbeat.down.sql
      - migrations/000005_social.up.sql
      - migrations/000005_social.down.sql
      - migrations/000006_moderation.up.sql
      - migrations/000006_moderation.down.sql
      - migrations/000007_search.up.sql
      - migrations/000007_search.down.sql
      - migrations/000008_storyboard.up.sql
      - migrations/000008_storyboard.down.sql
      - migrations/000009_social_visibility.up.sql
      - migrations/000009_social_visibility.down.sql
      - migrations/000010_subtitles.up.sql
      - migrations/000010_subtitles.down.sql
      - migrations/000011_trending.up.sql
      - migrations/000011_trending.down.sql
      - migrations/000012_subscription_feed.up.sql
      - migrations/000012_subscription_feed.down.sql
      - migrations/000013_notifications.up.sql
      - migrations/000013_notifications.down.sql
      - migrations/000014_playlists.up.sql
      - migrations/000014_playlists.down.sql
      - migrations/000015_video_stats.up.sql
      - migrations/000015_video_stats.down.sql
      - migrations/000016_email_tokens.up.sql
      - migrations/000016_email_tokens.down.sql
      - migrations/000017_upload_ledger.up.sql
      - migrations/000017_upload_ledger.down.sql
      - migrations/000018_reco.up.sql
      - migrations/000018_reco.down.sql
      - migrations/000019_cin2_series.up.sql
      - migrations/000019_cin2_series.down.sql
      - migrations/000020_video_tags.up.sql
      - migrations/000020_video_tags.down.sql
      - migrations/000021_tag_slugs.up.sql
      - migrations/000021_tag_slugs.down.sql
