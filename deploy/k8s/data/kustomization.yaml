      - migrations/000023_audio_tracks.down.sql
      - migrations/000024_av1_master.up.sql
      - migrations/000024_av1_master.down.sql
      - migrations/000025_subtitle_default.up.sql
      - migrations/000025_subtitle_default.down.sql
      - migrations/000026_watch_history.up.sql
      - migrations/000026_watch_history.down.sql
      - migrations/000027_creator_requests.up.sql
      - migrations/000027_creator_requests.down.sql
      - migrations/000028_account_security.up.sql
      - migrations/000028_account_security.down.sql
  - name: winkey-pg-scripts
    files:
      - scripts/grants.sql

generatorOptions:
  disableNameSuffixHash: true
