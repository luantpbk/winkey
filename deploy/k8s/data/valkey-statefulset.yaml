apiVersion: v1
kind: Service
metadata:
  name: valkey
  namespace: default
  labels:
    app.kubernetes.io/name: valkey
    app.kubernetes.io/part-of: winkey
spec:
  type: ClusterIP
  ports:
    - name: valkey
      port: 6379
      targetPort: 6379
      protocol: TCP
  selector:
    app.kubernetes.io/name: valkey
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: valkey
  namespace: default
  labels:
    app.kubernetes.io/name: valkey
    app.kubernetes.io/part-of: winkey
spec:
  replicas: 1
  serviceName: valkey
  selector:
    matchLabels:
      app.kubernetes.io/name: valkey
  template:
    metadata:
      labels:
        app.kubernetes.io/name: valkey
        app.kubernetes.io/part-of: winkey
    spec:
      containers:
        - name: valkey
          image: valkey/valkey:8.0.2-alpine
          command:
            - /bin/sh
            - -c
            - exec valkey-server /etc/valkey/valkey.conf --requirepass "$VALKEY_PASSWORD"
          env:
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: valkey-auth
                  key: password
          ports:
            - name: valkey
              containerPort: 6379
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - valkey-cli -a "$VALKEY_PASSWORD" ping
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - valkey-cli -a "$VALKEY_PASSWORD" ping
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 200m
              memory: 768Mi
          volumeMounts:
            - name: config
              mountPath: /etc/valkey
              readOnly: true
            - name: data
              mountPath: /data
      volumes:
        - name: config
          configMap:
            name: valkey-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path
        resources:
          requests:
            storage: 1Gi
