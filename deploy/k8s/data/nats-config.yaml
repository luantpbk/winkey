apiVersion: v1
kind: ConfigMap
metadata:
  name: nats-config
  namespace: default
  labels:
    app.kubernetes.io/name: nats
    app.kubernetes.io/part-of: winkey
data:
  nats.conf: |
    # NATS JetStream Configuration for Winkey
    port: 4222
    http_port: 8222

    jetstream {
      store_dir: "/data"
      max_mem: 64MB
      max_file: 20GB
    }

    # Auth configuration dynamically mounted from Secret
    include "../nats-auth/auth.conf"
