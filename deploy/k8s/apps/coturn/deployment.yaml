apiVersion: apps/v1
kind: Deployment
metadata:
  name: coturn
  namespace: default
  labels:
    app.kubernetes.io/name: coturn
    app.kubernetes.io/part-of: winkey
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: coturn
  template:
    metadata:
      labels:
        app.kubernetes.io/name: coturn
        app.kubernetes.io/part-of: winkey
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '9641'
        prometheus.io/path: '/metrics'
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/hostname: edge-1
      terminationGracePeriodSeconds: 30
      initContainers:
        - name: init-coturn
          image: docker.io/coturn/coturn@sha256:e2bca2f79a4269d7240de5872ab60a9305013ad37296d2acf14f9510874346be
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - FOWNER
                - DAC_OVERRIDE
          command:
            - sh
            - -c
            - |
              set -euo pipefail
              mkdir -p /dest/certs
              cp -L /etc/letsencrypt/live/winkey.vn/fullchain.pem /dest/certs/fullchain.pem
              cp -L /etc/letsencrypt/live/winkey.vn/privkey.pem /dest/certs/privkey.pem
              cp /config-src/turnserver.conf /dest/turnserver.conf

              printf "\n# Dynamic bindings & secrets\n" >> /dest/turnserver.conf
              if [ -n "${TURN_SECRET:-}" ]; then
                printf "static-auth-secret=%s\n" "$TURN_SECRET" >> /dest/turnserver.conf
              fi
              if [ -n "${NODE_INTERNAL_IP:-}" ]; then
                printf "prometheus-address=%s\n" "$NODE_INTERNAL_IP" >> /dest/turnserver.conf
                printf "denied-peer-ip=%s\n" "$NODE_INTERNAL_IP" >> /dest/turnserver.conf
              fi
              if [ -n "${EDGE_PUBLIC_IP:-}" ]; then
                printf "denied-peer-ip=%s\n" "$EDGE_PUBLIC_IP" >> /dest/turnserver.conf
              fi

              chown -R 65534:65534 /dest
              chmod 0700 /dest /dest/certs
              chmod 0600 /dest/certs/* /dest/turnserver.conf
          env:
            - name: TURN_SECRET
              valueFrom:
                secretKeyRef:
                  name: coturn-secrets
                  key: TURN_SECRET
            - name: EDGE_PUBLIC_IP
              valueFrom:
                secretKeyRef:
                  name: coturn-secrets
                  key: EDGE_PUBLIC_IP
                  optional: true
            - name: NODE_INTERNAL_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          volumeMounts:
            - name: config-source
              mountPath: /config-src
              readOnly: true
            - name: letsencrypt
              mountPath: /etc/letsencrypt
              readOnly: true
            - name: coturn-run
              mountPath: /dest
      containers:
        - name: coturn
          image: docker.io/coturn/coturn@sha256:e2bca2f79a4269d7240de5872ab60a9305013ad37296d2acf14f9510874346be
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE
          command:
            - turnserver
          args:
            - -c
            - /etc/coturn/turnserver.conf
          ports:
            - name: stun-turn-udp
              containerPort: 3478
              protocol: UDP
            - name: stun-turn-tcp
              containerPort: 3478
              protocol: TCP
            - name: turns-tls-tcp
              containerPort: 5349
              protocol: TCP
            - name: turns-tls-udp
              containerPort: 5349
              protocol: UDP
            - name: metrics
              containerPort: 9641
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: coturn-run
              mountPath: /etc/coturn
              readOnly: true
            - name: tmp
              mountPath: /var/tmp
      volumes:
        - name: config-source
          configMap:
            name: coturn-config
        - name: coturn-run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: letsencrypt
          hostPath:
            path: /etc/letsencrypt
            type: Directory
