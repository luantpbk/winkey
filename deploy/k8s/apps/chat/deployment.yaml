apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-svc
  namespace: default
  labels:
    app.kubernetes.io/name: chat-svc
    app.kubernetes.io/part-of: winkey
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: chat-svc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chat-svc
        app.kubernetes.io/part-of: winkey
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '3006'
        prometheus.io/path: '/metrics'
    spec:
      terminationGracePeriodSeconds: 30
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
        - name: chat
          image: ghcr.io/luantpbk/winkey-chat
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3006
              protocol: TCP
          env:
            - name: NODE_ENV
              value: 'production'
            - name: HTTP_PORT
              value: '3006'
            - name: MEDIA_BASE_URL
              value: 'https://media.winkey.vn'
            - name: TRUST_PROXY_CIDRS
              value: '10.42.0.0/16,127.0.0.1'
            - name: TO_DEVICE_PURGE_INTERVAL
              value: '1h'
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: chat-secrets
                  key: DATABASE_URL
            - name: NATS_URL
              valueFrom:
                secretKeyRef:
                  name: chat-secrets
                  key: NATS_URL
            - name: VALKEY_URL
              valueFrom:
                secretKeyRef:
                  name: chat-secrets
                  key: VALKEY_URL
            # SOC-3b attachments: Cloudflare R2 bucket winkey-chat
            - name: CHAT_S3_ENDPOINT
              value: 'https://2588dff2e56bf889918bc5c7af53ad86.r2.cloudflarestorage.com'
            - name: CHAT_S3_PUBLIC_ENDPOINT
              value: 'https://2588dff2e56bf889918bc5c7af53ad86.r2.cloudflarestorage.com'
            - name: CHAT_S3_REGION
              value: 'auto'
            - name: CHAT_S3_BUCKET
              value: 'winkey-chat'
            - name: CHAT_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: chat-secrets
                  key: CHAT_S3_ACCESS_KEY_ID
                  optional: true
            - name: CHAT_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: chat-secrets
                  key: CHAT_S3_SECRET_ACCESS_KEY
                  optional: true
            # SOC-4a WebRTC TURN (coturn)
            - name: TURN_SECRET
              valueFrom:
                secretKeyRef:
                  name: chat-secrets
                  key: TURN_SECRET
                  optional: true
            - name: TURN_URLS
              value: 'turn:turn.winkey.vn:3478?transport=udp,turns:turn.winkey.vn:5349?transport=tcp'
          resources:
            requests:
              cpu: 30m
              memory: 192Mi
            limits:
              cpu: 300m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
