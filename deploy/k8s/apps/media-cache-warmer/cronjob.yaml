apiVersion: batch/v1
kind: CronJob
metadata:
  name: media-cache-warmer
  namespace: default
  labels:
    app.kubernetes.io/name: media-cache-warmer
    app.kubernetes.io/part-of: winkey
spec:
  schedule: '*/15 * * * *'
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: media-cache-warmer
            app.kubernetes.io/part-of: winkey
        spec:
          restartPolicy: OnFailure
          containers:
            - name: warmer
              image: node:22-alpine
              command: ['node', '/app/warmer.mjs']
              env:
                - name: MEDIA_BASE_URL
                  value: 'https://media.winkey.vn'
                - name: API_BASE_URL
                  value: 'https://winkey.vn'
                - name: CACHE_DIR
                  value: '/nginx-cache'
                - name: MAX_CACHE_BYTES
                  value: '42949672960' # 40GB
                - name: MAX_CONCURRENCY
                  value: '4'
                - name: RATE_LIMIT_BPS
                  value: '5242880' # 5 MB/s
                - name: WARM_SEGMENTS_COUNT
                  value: '15' # ~60s
                - name: HOT_VIDEOS_LIMIT
                  value: '20'
                - name: NEW_VIDEOS_HOURS
                  value: '24'
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: script
                  mountPath: /app
                  readOnly: true
                - name: nginx-cache
                  mountPath: /nginx-cache
                  readOnly: true
          volumes:
            - name: script
              configMap:
                name: media-cache-warmer-script
            - name: nginx-cache
              hostPath:
                path: /var/lib/rancher/k3s/storage/nginx-cache/winkey-media
                type: DirectoryOrCreate
