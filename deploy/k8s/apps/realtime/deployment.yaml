apiVersion: apps/v1
kind: Deployment
metadata:
  name: realtime-svc
  namespace: default
  labels:
    app.kubernetes.io/name: realtime-svc
    app.kubernetes.io/part-of: winkey
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: realtime-svc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: realtime-svc
        app.kubernetes.io/part-of: winkey
    spec:
      terminationGracePeriodSeconds: 30
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
        - name: realtime
          image: ghcr.io/luantpbk/winkey-realtime
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3005
              protocol: TCP
          env:
            - name: NODE_ENV
              value: 'production'
            - name: HTTP_PORT
              value: '3005'
            - name: VIDEO_SVC_URL
              value: 'http://video-svc:3003'
            - name: LOG_LEVEL
              value: 'info'
            - name: TRUST_PROXY_CIDRS
              value: '10.42.0.0/16,127.0.0.1'
            - name: NATS_URL
              valueFrom:
                secretKeyRef:
                  name: realtime-secrets
                  key: NATS_URL
            - name: VALKEY_URL
              valueFrom:
                secretKeyRef:
                  name: realtime-secrets
                  key: VALKEY_URL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 300m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
