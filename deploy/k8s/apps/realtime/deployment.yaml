apiVersion: apps/v1
kind: Deployment
metadata:
  name: realtime-svc
  namespace: default
  labels:
    app.kubernetes.io/name: realtime-svc
    app.kubernetes.io/part-of: winkey
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: realtime-svc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: realtime-svc
        app.kubernetes.io/part-of: winkey
    spec:
      terminationGracePeriodSeconds: 30
      volumes:
        - name: node-modules
          emptyDir: {}
      initContainers:
        - name: patch-modules
          image: ghcr.io/luantpbk/winkey-realtime
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          command:
            - sh
            - -c
            - |
              set -e
              cp -a /app/node_modules/. /target/
              mkdir -p /tmp/pkg
              cd /tmp/pkg
              npm install --no-save ajv@8.17.1 ajv-formats@3.0.1
              cp -a /tmp/pkg/node_modules/. /target/
              node -e '
                const fs = require("fs");
                const p = "/target/.pnpm/nats@2.29.3/node_modules/nats/lib/nats-base-client/options.js";
                if (fs.existsSync(p)) {
                  let code = fs.readFileSync(p, "utf8");
                  const target = "function parseOptions(opts) {";
                  const patch = `function parseOptions(opts) {
                    if (opts && opts.servers && typeof opts.servers === "string" && opts.servers.includes("@")) {
                      try {
                        const u = new URL(opts.servers);
                        if (u.username && !opts.user) {
                          opts.user = decodeURIComponent(u.username);
                          opts.pass = decodeURIComponent(u.password);
                          opts.servers = u.protocol + "//" + u.host;
                        }
                      } catch (_) {}
                    }`;
                  code = code.replace(target, patch);
                  fs.writeFileSync(p, code);
                }
              '
              chmod -R a+rX /target 2>/dev/null || true
          volumeMounts:
            - name: node-modules
              mountPath: /target
      containers:
        - name: realtime
          image: ghcr.io/luantpbk/winkey-realtime
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3005
              protocol: TCP
          env:
            - name: NODE_ENV
              value: 'production'
            - name: HTTP_PORT
              value: '3005'
            - name: VIDEO_SVC_URL
              value: 'http://video-svc:3003'
            - name: LOG_LEVEL
              value: 'info'
            - name: TRUST_PROXY_CIDRS
              value: '10.42.0.0/16,127.0.0.1'
            - name: NATS_URL
              valueFrom:
                secretKeyRef:
                  name: realtime-secrets
                  key: NATS_URL
            - name: VALKEY_URL
              valueFrom:
                secretKeyRef:
                  name: realtime-secrets
                  key: VALKEY_URL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 300m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          volumeMounts:
            - name: node-modules
              mountPath: /app/node_modules
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
