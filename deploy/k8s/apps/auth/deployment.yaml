apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-svc
  namespace: default
  labels:
    app.kubernetes.io/name: auth-svc
    app.kubernetes.io/part-of: winkey
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: auth-svc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auth-svc
        app.kubernetes.io/part-of: winkey
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '3001'
        prometheus.io/path: '/metrics'
    spec:
      terminationGracePeriodSeconds: 30
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
        - name: auth
          image: ghcr.io/luantpbk/winkey-auth
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3001
              protocol: TCP
          env:
            - name: NODE_ENV
              value: 'production'
            - name: HTTP_PORT
              value: '3001'
            - name: JWT_ISSUER
              value: 'https://winkey.vn'
            - name: PUBLIC_ORIGIN
              value: 'https://winkey.vn'
            - name: MEDIA_BASE_URL
              value: 'https://media.winkey.vn'
            - name: TRUST_PROXY_CIDRS
              value: '10.42.0.0/16,127.0.0.1'
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: auth-secrets
                  key: DATABASE_URL
            - name: NATS_URL
              valueFrom:
                secretKeyRef:
                  name: auth-secrets
                  key: NATS_URL
            - name: VALKEY_URL
              valueFrom:
                secretKeyRef:
                  name: auth-secrets
                  key: VALKEY_URL
            - name: JWT_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: auth-secrets
                  key: JWT_PRIVATE_KEY
            - name: JWT_KID
              valueFrom:
                secretKeyRef:
                  name: auth-secrets
                  key: JWT_KID
            - name: COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: auth-secrets
                  key: COOKIE_SECRET
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: auth-google
                  key: GOOGLE_CLIENT_ID
                  optional: true
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: auth-google
                  key: GOOGLE_CLIENT_SECRET
                  optional: true
            - name: MAIL_TRANSPORT
              value: 'smtp'
            - name: MAIL_FROM
              value: 'Winkey <no-reply@winkey.vn>'
            - name: SMTP_URL
              valueFrom:
                secretKeyRef:
                  name: auth-smtp
                  key: SMTP_URL
                  optional: true
            - name: REGISTRATION_MODE
              value: 'open'
            - name: INVITE_CODES
              valueFrom:
                secretKeyRef:
                  name: auth-secrets
                  key: INVITE_CODES
                  optional: true
            - name: TOTP_ENCRYPTION_KEYS
              valueFrom:
                secretKeyRef:
                  name: auth-secrets
                  key: TOTP_ENCRYPTION_KEYS
            - name: SESSION_IP_SALT
              valueFrom:
                secretKeyRef:
                  name: auth-secrets
                  key: SESSION_IP_SALT
            - name: WEBAUTHN_USER_HANDLE_KEY
              valueFrom:
                secretKeyRef:
                  name: auth-secrets
                  key: WEBAUTHN_USER_HANDLE_KEY
            - name: TURNSTILE_SECRET
              valueFrom:
                secretKeyRef:
                  name: auth-turnstile
                  key: TURNSTILE_SECRET
                  optional: true
            - name: WEBAUTHN_RP_ID
              value: 'winkey.vn'
            - name: WEBAUTHN_ORIGINS
              value: 'https://winkey.vn,https://www.winkey.vn'
            - name: PASSWORD_BREACH_CHECK
              value: 'true'
            - name: STAFF_MFA_REQUIRED
              value: 'false'
            - name: TRUSTED_COUNTRY_HEADER
              value: 'CF-IPCountry'
          resources:
            requests:
              cpu: 30m
              memory: 192Mi
            limits:
              cpu: 300m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
