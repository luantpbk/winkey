apiVersion: apps/v1
kind: Deployment
metadata:
  name: video-svc
  namespace: default
  labels:
    app.kubernetes.io/name: video-svc
    app.kubernetes.io/part-of: winkey
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: video-svc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: video-svc
        app.kubernetes.io/part-of: winkey
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '3003'
        prometheus.io/path: '/metrics'
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
      terminationGracePeriodSeconds: 30
      containers:
        - name: video
          image: ghcr.io/luantpbk/winkey-video
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3003
              protocol: TCP
          env:
            - name: HTTP_ADDR
              value: ':3003'
            - name: LOG_LEVEL
              value: 'info'
            - name: MEDIA_BASE_URL
              value: 'https://media.winkey.vn'
            - name: S3_MEDIA_BUCKET
              valueFrom:
                secretKeyRef:
                  name: r2-video-svc
                  key: S3_MEDIA_BUCKET
            - name: S3_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: r2-video-svc
                  key: S3_ENDPOINT
            - name: S3_REGION
              valueFrom:
                secretKeyRef:
                  name: r2-video-svc
                  key: S3_REGION
            - name: CACHE_TTL
              value: '30s'
            - name: TRUST_PROXY_CIDRS
              value: '10.42.0.0/16,127.0.0.1'
            - name: VIEW_RATE_LIMIT
              value: '60'
            - name: VIEW_DEDUP_TTL
              value: '30m'
            - name: VIEW_FLUSH_INTERVAL
              value: '30s'
            - name: VIEW_FLUSH_LOCK_TTL
              value: '2m'
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: video-secrets
                  key: DATABASE_URL
            - name: NATS_URL
              valueFrom:
                secretKeyRef:
                  name: video-secrets
                  key: NATS_URL
            - name: VALKEY_URL
              valueFrom:
                secretKeyRef:
                  name: video-secrets
                  key: VALKEY_URL
            - name: MEDIA_LINK_SECRET
              valueFrom:
                secretKeyRef:
                  name: video-secrets
                  key: MEDIA_LINK_SECRET
            - name: CURSOR_SECRET
              valueFrom:
                secretKeyRef:
                  name: video-secrets
                  key: CURSOR_SECRET
            - name: ANALYTICS_VIEWER_SALT
              valueFrom:
                secretKeyRef:
                  name: video-secrets
                  key: ANALYTICS_VIEWER_SALT
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: r2-video-svc
                  key: AWS_ACCESS_KEY_ID
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: r2-video-svc
                  key: AWS_SECRET_ACCESS_KEY
          resources:
            requests:
              cpu: 30m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
