apiVersion: apps/v1
kind: Deployment
metadata:
  name: media-origin
  namespace: default
  labels:
    app.kubernetes.io/name: media-origin
    app.kubernetes.io/part-of: winkey
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: media-origin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: media-origin
        app.kubernetes.io/part-of: winkey
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
      containers:
        - name: media-origin
          image: rclone/rclone:1.69.1@sha256:600f51856285df1ae5d91c8bb2682cbbe31bf109ebeeef9ecead6ca8c0ff6138
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          args:
            - serve
            - http
            - r2:winkey-media
            - --addr=:8080
            - --read-only
            - --no-modtime
            - --dir-cache-time=1m
            - --vfs-cache-mode=off
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          env:
            - name: RCLONE_CONFIG_R2_TYPE
              value: 's3'
            - name: RCLONE_CONFIG_R2_PROVIDER
              value: 'Cloudflare'
            - name: RCLONE_CONFIG_R2_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: r2-media-origin
                  key: S3_ENDPOINT
            - name: RCLONE_CONFIG_R2_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: r2-media-origin
                  key: S3_ACCESS_KEY_ID
            - name: RCLONE_CONFIG_R2_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: r2-media-origin
                  key: S3_SECRET_ACCESS_KEY
            - name: RCLONE_CONFIG_R2_REGION
              value: 'auto'
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 50m
              memory: 128Mi
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
