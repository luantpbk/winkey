apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-svc
  namespace: default
  labels:
    app.kubernetes.io/name: web-svc
    app.kubernetes.io/part-of: winkey
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: web-svc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web-svc
        app.kubernetes.io/part-of: winkey
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      terminationGracePeriodSeconds: 30
      containers:
        - name: web
          image: ghcr.io/luantpbk/winkey-web
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: NODE_ENV
              value: 'production'
            - name: PORT
              value: '3000'
            - name: HOSTNAME
              value: '0.0.0.0'
            - name: API_INTERNAL_URL
              value: 'http://traefik.kube-system.svc.cluster.local'
            - name: API_MOCKS
              value: '0'
            - name: NEXT_PUBLIC_API_MOCKS
              value: '0'
            - name: NEXT_PUBLIC_MEDIA_BASE_URL
              value: 'https://media.winkey.vn'
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 768Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: next-cache
              mountPath: /app/apps/web/.next/cache
      volumes:
        - name: tmp
          emptyDir: {}
        - name: next-cache
          emptyDir: {}
