# I1 — node bootstrap + k3s server. See README.md.
- name: Edge nodes
  hosts: edge
  roles:
    - base
    - role: tailscale
      tags: [tailscale, nginx_front]
    - role: firewall
      tags: [firewall]
    - role: ssh_hardening
      tags: [ssh_hardening]

    - storage
    - k3s_server
    - role: nginx_front
      tags: [nginx_front]
      when: nginx_front.hosts | default([]) | length > 0

    - role: edge_ingress
    - role: data_k3s
    - role: apps_k3s
