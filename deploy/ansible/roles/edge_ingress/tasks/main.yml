---
# Role: edge_ingress
# Deploys Traefik IngressRoute, Middlewares, and fixed NodePorts to k3s.
# Uses k3s auto-deploy manifests directory (/var/lib/rancher/k3s/server/manifests)

- name: Deploy Traefik middlewares manifest
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../k8s/edge/middlewares.yaml"
    dest: /var/lib/rancher/k3s/server/manifests/winkey-middlewares.yaml
    mode: "0644"

- name: Deploy Traefik IngressRoute manifest
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../k8s/edge/ingressroute.yaml"
    dest: /var/lib/rancher/k3s/server/manifests/winkey-ingressroute.yaml
    mode: "0644"

- name: Deploy NodePort services manifest (ADR-015)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../k8s/edge/nodeports.yaml"
    dest: /var/lib/rancher/k3s/server/manifests/winkey-nodeports.yaml
    mode: "0644"

- name: Deploy ClusterIP backend services manifest
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../k8s/edge/clusterip-services.yaml"
    dest: /var/lib/rancher/k3s/server/manifests/winkey-services.yaml
    mode: "0644"

- name: Remove whoami smoke test manifest
  ansible.builtin.file:
    path: /var/lib/rancher/k3s/server/manifests/winkey-whoami.yaml
    state: absent
  register: whoami_manifest

- name: Remove whoami smoke test workload
  ansible.builtin.command: /usr/local/bin/k3s kubectl delete deployment whoami service whoami -n default --ignore-not-found --wait=true
  when:
    - whoami_manifest.changed
    - not ansible_check_mode
  changed_when: false
