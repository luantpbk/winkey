---
# Role: edge_ingress
# Deploys Traefik IngressRoute, Middlewares, fixed NodePorts, ClusterIP services, and whoami smoke test service to k3s.
# Applies manifests directly via kubectl apply (replaces k3s auto-deploy manifests).

- name: Render Traefik middlewares manifest
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../k8s/edge/middlewares.yaml"
    dest: /tmp/winkey-middlewares.yaml
    mode: "0600"

- name: Apply Traefik middlewares manifest
  ansible.builtin.command: /usr/local/bin/k3s kubectl apply -f /tmp/winkey-middlewares.yaml

- name: Remove rendered middlewares temp file
  ansible.builtin.file:
    path: /tmp/winkey-middlewares.yaml
    state: absent

- name: Apply Traefik IngressRoute manifest
  ansible.builtin.command: /usr/local/bin/k3s kubectl apply -f "{{ playbook_dir }}/../k8s/edge/ingressroute.yaml"

- name: Apply NodePort services manifest (ADR-015)
  ansible.builtin.command: /usr/local/bin/k3s kubectl apply -f "{{ playbook_dir }}/../k8s/edge/nodeports.yaml"

- name: Apply ClusterIP backend services manifest
  ansible.builtin.command: /usr/local/bin/k3s kubectl apply -f "{{ playbook_dir }}/../k8s/edge/clusterip-services.yaml"

- name: Apply whoami smoke test workload
  ansible.builtin.command: /usr/local/bin/k3s kubectl apply -f "{{ playbook_dir }}/../k8s/edge/whoami.yaml"

- name: Wait for whoami deployment rollout
  ansible.builtin.command: /usr/local/bin/k3s kubectl rollout status deployment/whoami -n default --timeout=60s
  register: whoami_rollout
  retries: 5
  delay: 5
  until: whoami_rollout.rc == 0
  changed_when: false
  when: not ansible_check_mode
