---
# Role: edge_ingress
# Deploys Traefik IngressRoute, Middlewares, fixed NodePorts, ClusterIP services, and whoami smoke test service to k3s.
# Syncs manifests to /var/lib/rancher/k3s/edge-manifests/ and applies via kubectl apply.

- name: Sync edge manifests to node
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../k8s/edge/"
    dest: /var/lib/rancher/k3s/edge-manifests/
    mode: preserve

- name: Render Traefik middlewares manifest with tailscale IP
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../k8s/edge/middlewares.yaml"
    dest: /var/lib/rancher/k3s/edge-manifests/middlewares.yaml
    mode: "0644"

- name: Apply edge ingress and routing manifests
  ansible.builtin.command: /usr/local/bin/k3s kubectl apply -f /var/lib/rancher/k3s/edge-manifests/
  register: edge_manifests_apply
  changed_when: "'configured' in edge_manifests_apply.stdout or 'created' in edge_manifests_apply.stdout"

- name: Wait for whoami deployment rollout
  ansible.builtin.command: /usr/local/bin/k3s kubectl rollout status deployment/whoami -n default --timeout=60s
  register: whoami_rollout
  retries: 5
  delay: 5
  until: whoami_rollout.rc == 0
  changed_when: false
  when: not ansible_check_mode
