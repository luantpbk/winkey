- name: Ensure sshd_config.d directory exists
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy ssh hardening drop-in configuration
  ansible.builtin.template:
    src: 10-winkey.conf.j2
    dest: /etc/ssh/sshd_config.d/10-winkey.conf
    owner: root
    group: root
    mode: "0600"
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload sshd
