- name: Ensure nginx media cache directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: nginx
    group: nginx
    mode: "0700"
  loop:
    - /var/cache/nginx/winkey-media
    - /var/cache/nginx/winkey-media-auth

- name: Slurp media link secret from host
  ansible.builtin.slurp:
    src: /etc/nginx/winkey-media-link-secret
  register: media_link_secret_file
  failed_when: false

- name: Set media_link_secret fact
  ansible.builtin.set_fact:
    media_link_secret: "{{ (media_link_secret_file.content | b64decode | trim) if (media_link_secret_file.content is defined) else (lookup('env', 'MEDIA_LINK_SECRET') | default('', true)) }}"

- name: Is the certificate there yet?
  ansible.builtin.stat:
    path: "/etc/letsencrypt/live/{{ nginx_front.cert_name }}/fullchain.pem"
  register: front_cert

- name: Winkey server blocks
  ansible.builtin.template:
    src: winkey.conf.j2
    dest: /etc/nginx/conf.d/winkey.conf
    mode: "0644"
  vars:
    with_tls: "{{ front_cert.stat.exists }}"
  register: front_conf

- name: Reload nginx for the HTTP-01 challenge
  ansible.builtin.shell: nginx -t && systemctl reload nginx
  when: front_conf.changed and not front_cert.stat.exists

# Uses the Let's Encrypt account already registered on the host; certbot only answers the challenge
# through nginx and never edits the config (certonly). --expand adds any newly added hosts (e.g. www.winkey.vn).
- name: Certificate for the Winkey hosts
  ansible.builtin.command: >-
    certbot certonly --nginx --non-interactive --keep-until-expiring --expand
    --cert-name {{ nginx_front.cert_name }}
    {% for h in nginx_front.hosts %}-d {{ h }} {% endfor %}
  register: front_certbot
  changed_when: "'Certificate not yet due for renewal' not in front_certbot.stdout and 'Keeping the existing certificate' not in front_certbot.stdout"

- name: Winkey server blocks with TLS
  ansible.builtin.template:
    src: winkey.conf.j2
    dest: /etc/nginx/conf.d/winkey.conf
    mode: "0644"
  vars:
    with_tls: true
  notify: Reload nginx

- name: Certbot renews on its timer
  ansible.builtin.systemd:
    name: certbot-renew.timer
    enabled: true
    state: started
