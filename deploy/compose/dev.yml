services:
  # ---------------------------------------------------------------------------
  # Database: PostgreSQL 17
  # Roles: winkey_migrator (DB owner), auth_svc, media_svc
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:17-alpine
    container_name: winkey-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-winkey}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      MIGRATOR_USER: ${MIGRATOR_USER:-winkey_migrator}
      MIGRATOR_PASSWORD: ${MIGRATOR_PASSWORD:-winkey_migrator}
      AUTH_SVC_USER: ${AUTH_SVC_USER:-auth_svc}
      AUTH_SVC_PASSWORD: ${AUTH_SVC_PASSWORD:-auth_svc}
      MEDIA_SVC_USER: ${MEDIA_SVC_USER:-media_svc}
      MEDIA_SVC_PASSWORD: ${MEDIA_SVC_PASSWORD:-media_svc}
    ports:
      - '${DEV_BIND_IP:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/01-init-roles.sh:/docker-entrypoint-initdb.d/01-init-roles.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d winkey']
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1536M

  # ---------------------------------------------------------------------------
  # Database Migrations: golang-migrate applying db/migrations as winkey_migrator
  # ---------------------------------------------------------------------------
  migrate:
    image: migrate/migrate:v4.18.2
    container_name: winkey-migrate
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../../db/migrations:/migrations:ro
    command:
      [
        '-path',
        '/migrations',
        '-database',
        'postgres://${MIGRATOR_USER:-winkey_migrator}:${MIGRATOR_PASSWORD:-winkey_migrator}@postgres:5432/${POSTGRES_DB:-winkey}?sslmode=disable',
        'up',
      ]
    restart: 'no'
    deploy:
      resources:
        limits:
          memory: 256M

  # ---------------------------------------------------------------------------
  # Database Grants: Applies role permissions per db/README.md after migrations
  # ---------------------------------------------------------------------------
  db-grants:
    image: postgres:17-alpine
    container_name: winkey-db-grants
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./postgres/grants.sql:/grants.sql:ro
    environment:
      PGPASSWORD: ${MIGRATOR_PASSWORD:-winkey_migrator}
    command:
      [
        'psql',
        '-h',
        'postgres',
        '-U',
        '${MIGRATOR_USER:-winkey_migrator}',
        '-d',
        '${POSTGRES_DB:-winkey}',
        '-v',
        'ON_ERROR_STOP=1',
        '-f',
        '/grants.sql',
      ]
    restart: 'no'
    deploy:
      resources:
        limits:
          memory: 128M

  # ---------------------------------------------------------------------------
  # Cache / Rate Limiting: Valkey 8.x
  # ---------------------------------------------------------------------------
  valkey:
    image: valkey/valkey:8.0-alpine
    container_name: winkey-valkey
    command: valkey-server --save "" --appendonly no
    ports:
      - '${DEV_BIND_IP:-127.0.0.1}:${VALKEY_PORT:-6379}:6379'
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  # ---------------------------------------------------------------------------
  # Message Queue: NATS JetStream 2.x
  # ---------------------------------------------------------------------------
  nats:
    image: nats:2.10.26-alpine
    container_name: winkey-nats
    command: ['-js', '-m', '8222']
    ports:
      - '${DEV_BIND_IP:-127.0.0.1}:${NATS_PORT:-4222}:4222'
      - '${DEV_BIND_IP:-127.0.0.1}:${NATS_MONITOR_PORT:-8222}:8222'
    volumes:
      - nats_data:/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "wget -q -O /dev/null http://127.0.0.1:8222/healthz || wget -q -O - http://127.0.0.1:8222/varz | grep -q 'server_id' || exit 1",
        ]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  # ---------------------------------------------------------------------------
  # NATS Bootstrap: creates JetStream streams VIDEO, USER, DLQ (replicas: 1)
  # ---------------------------------------------------------------------------
  nats-bootstrap:
    image: natsio/nats-box:0.14.5
    container_name: winkey-nats-bootstrap
    depends_on:
      nats:
        condition: service_healthy
    volumes:
      - ./nats/bootstrap-streams.sh:/bootstrap-streams.sh:ro
    entrypoint: ['/bin/sh', '/bootstrap-streams.sh']
    environment:
      NATS_SERVER: nats:4222
    restart: 'no'
    deploy:
      resources:
        limits:
          memory: 256M

  # ---------------------------------------------------------------------------
  # Object Storage: Garage S3 (v1.x, replication_factor = 1)
  # ---------------------------------------------------------------------------
  garage:
    image: dxflrs/garage:v1.0.1
    container_name: winkey-garage
    command: ['/garage', '-c', '/etc/garage.toml', 'server']
    ports:
      - '${DEV_BIND_IP:-127.0.0.1}:${GARAGE_S3_PORT:-3900}:3900'
      - '${DEV_BIND_IP:-127.0.0.1}:${GARAGE_WEB_PORT:-3902}:3902'
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    healthcheck:
      test: ['CMD', '/garage', '-c', '/etc/garage.toml', 'status']
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1024M

  # ---------------------------------------------------------------------------
  # Garage Bootstrap: layout assign/apply, key export, buckets, website, CORS
  # ---------------------------------------------------------------------------
  garage-bootstrap:
    build:
      context: ./garage
      dockerfile: Dockerfile
    container_name: winkey-garage-bootstrap
    depends_on:
      garage:
        condition: service_healthy
    network_mode: 'service:garage'
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta:ro
      - .:/env
    environment:
      GARAGE_HOST: 127.0.0.1
    restart: 'no'
    deploy:
      resources:
        limits:
          memory: 512M

  # ---------------------------------------------------------------------------
  # Media Cache: Nginx in front of Garage web endpoint on :8081
  # ---------------------------------------------------------------------------
  media-cache:
    image: nginx:1.27-alpine
    container_name: winkey-media-cache
    depends_on:
      - garage
    ports:
      - '${DEV_BIND_IP:-127.0.0.1}:${MEDIA_CACHE_PORT:-8081}:8081'
    volumes:
      - ./media-cache/nginx.conf:/etc/nginx/nginx.conf:ro
      - media_cache_data:/var/cache/nginx/media
    healthcheck:
      test: ['CMD-SHELL', "wget -q -O - http://127.0.0.1:8081/healthz | grep -q 'OK' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  # ---------------------------------------------------------------------------
  # Stand-in Upstream for Gateway Header Spoofing Smoke Test
  # ---------------------------------------------------------------------------
  whoami:
    image: traefik/whoami:v1.10
    container_name: winkey-whoami
    deploy:
      resources:
        limits:
          memory: 128M

  # ---------------------------------------------------------------------------
  # Gateway / Ingress: Traefik on :8080 (ADR-009, pinned to v3.7 matching edge-1)
  # ---------------------------------------------------------------------------
  traefik:
    image: traefik:v3.7
    container_name: winkey-traefik
    ports:
      - '${DEV_BIND_IP:-127.0.0.1}:${GATEWAY_PORT:-8080}:8080'
      - '127.0.0.1:8082:8082'
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      whoami:
        condition: service_started
      db-grants:
        condition: service_completed_successfully
      nats-bootstrap:
        condition: service_completed_successfully
      garage-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'traefik', 'healthcheck', '--ping']
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

