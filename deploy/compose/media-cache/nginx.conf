user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format json_combined escape=json
        '{"ts":"$time_iso8601","remote_addr":"$remote_addr","request":"$request",'
        '"status":$status,"bytes_sent":$body_bytes_sent,"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time","upstream_cache_status":"$upstream_cache_status"}';

    access_log /var/log/nginx/access.log json_combined;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Local disk cache for media segments
    proxy_cache_path /var/cache/nginx/media levels=1:2 keys_zone=media_cache:20m max_size=5g inactive=30d use_temp_path=off;

    server {
        listen 8081;
        server_name localhost media.winkey.vn;

        # Range request support
        proxy_cache_key $uri;
        proxy_cache_methods GET HEAD;
        proxy_cache_valid 200 206 30d;
        proxy_force_ranges on;
        proxy_http_version 1.1;

        location / {
            # CORS headers for web origin
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin "http://localhost:3000" always;
                add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
                add_header Access-Control-Allow-Headers "*" always;
                add_header Access-Control-Max-Age 3600 always;
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }

            proxy_pass http://garage:3902;
            proxy_set_header Host winkey-media.web.garage.localhost;
            proxy_set_header Range $http_range;
            proxy_set_header If-Range $http_if_range;

            proxy_cache media_cache;
            proxy_cache_lock on;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;

            # Production intent: immutable caching
            add_header Access-Control-Allow-Origin "http://localhost:3000" always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers "*" always;
            add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges, ETag" always;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Cache-Status $upstream_cache_status always;
        }

        location /healthz {
            access_log off;
            return 200 "OK\n";
        }
    }
}
