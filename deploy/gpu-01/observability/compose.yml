services:
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.112.0@sha256:98363e91a586c6cf095833bbb284eddc303d606aa018d6757a74e35a4a4e9afb
    container_name: winkey-observability-victoriametrics
    restart: unless-stopped
    network_mode: host
    command:
      - -retentionPeriod=30d
      - -storageDataPath=/victoria-metrics-data
      - -httpListenAddr=127.0.0.1:8428
      - -httpListenAddr=100.88.247.70:8428
      - -promscrape.config=/etc/victoriametrics/scrape.yml
    volumes:
      - /srv/winkey-obs/victoria:/victoria-metrics-data
      - ./scrape.yml:/etc/victoriametrics/scrape.yml:ro
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: '5'

  loki:
    image: grafana/loki:3.4.2@sha256:58a6c186ce78ba04d58bfe2a927eff296ba733a430df09645d56cdc158f3ba08
    container_name: winkey-observability-loki
    restart: unless-stopped
    network_mode: host
    command:
      - -config.file=/etc/loki/local-config.yaml
    volumes:
      - /srv/winkey-obs/loki:/loki
      - ./loki-config.yml:/etc/loki/local-config.yaml:ro
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: '5'

  grafana:
    image: grafana/grafana:11.5.2@sha256:8b37a2f028f164ce7b9889e1765b9d6ee23fec80f871d156fbf436d6198d32b7
    container_name: winkey-observability-grafana
    restart: unless-stopped
    network_mode: host
    env_file:
      - path: /srv/winkey-obs/secrets/grafana.env
        required: true
    environment:
      GF_INSTALL_PLUGINS: 'grafana-clickhouse-datasource 4.22.0'
      GF_SERVER_HTTP_ADDR: '100.88.247.70'
      GF_SERVER_HTTP_PORT: '3000'
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: 'false'
      GF_ALERTING_NOTIFICATION_RATE_LIMIT_BURST_SIZE: '10'
      GF_UNIFIED_ALERTING_SCREENSHOTS_CAPTURE: 'false'
    volumes:
      - /srv/winkey-obs/grafana:/var/lib/grafana
      - ./provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: '5'
