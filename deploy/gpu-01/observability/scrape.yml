global:
  scrape_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: 'gpu-node'
    static_configs:
      - targets: ['127.0.0.1:9100']
        labels:
          node: 'gpu-01'

  - job_name: 'gpu-clickhouse'
    static_configs:
      - targets: ['127.0.0.1:9363']
        labels:
          node: 'gpu-01'
          app: 'clickhouse'

  - job_name: 'gpu-analytics-worker'
    static_configs:
      - targets: ['127.0.0.1:8081']
        labels:
          node: 'gpu-01'
          app: 'analytics-worker'

  - job_name: 'gpu-transcoder'
    static_configs:
      - targets: ['127.0.0.1:8085']
        labels:
          node: 'gpu-01'
          app: 'transcoder'

  - job_name: 'gpu-victoriametrics'
    static_configs:
      - targets: ['127.0.0.1:8428']
        labels:
          node: 'gpu-01'
          app: 'victoriametrics'

  - job_name: 'r2-usage'
    static_configs:
      - targets: ['127.0.0.1:9095']
        labels:
          node: 'gpu-01'
          app: 'r2-usage'
