services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.12@sha256:8a790dd3468db22b1d4e7b18a176f378ff5ff6053b9c48dd4ea1fa71a24c5ba6
    container_name: winkey-analytics-clickhouse
    restart: unless-stopped
    network_mode: 'host'
    environment:
      CLICKHOUSE_PASSWORD: '${CLICKHOUSE_PASSWORD}'
      CLICKHOUSE_SKIP_USER_SETUP: '1'
    volumes:
      - /srv/winkey-analytics/clickhouse:/var/lib/clickhouse
      - /srv/winkey-analytics/backup:/var/lib/clickhouse/backup
      - ./config.d:/etc/clickhouse-server/config.d:ro
      - ./users.d:/etc/clickhouse-server/users.d:ro
    cpus: 8
    mem_limit: 14g
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    logging:
      driver: 'json-file'
      options:
        max-size: '50m'
        max-file: '5'
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:8123/ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  analytics-worker:
    image: '${ANALYTICS_WORKER_IMAGE:?ANALYTICS_WORKER_IMAGE must be set in .env to the image digest published by CI (ghcr.io/luantpbk/winkey-analytics-worker@sha256:...)}'
    container_name: winkey-analytics-worker
    restart: unless-stopped
    network_mode: 'host'
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      CLICKHOUSE_DSN: '${CLICKHOUSE_DSN:-clickhouse://winkey:${CLICKHOUSE_PASSWORD}@127.0.0.1:9000/winkey}'
      CLICKHOUSE_MIGRATIONS_DIR: '/migrations'
      NATS_URL: '${NATS_URL:-nats://analytics:${NATS_ANALYTICS_PASSWORD}@100.113.240.3:30422}'
      POSTGRES_URL: '${POSTGRES_URL:?POSTGRES_URL must be set in .env (e.g. postgres://analytics_svc:password@100.113.240.3:30432/winkey?sslmode=require)}'
      ROLLUP_ENABLED: '${ROLLUP_ENABLED:-true}'
      HTTP_ADDR: '${HTTP_ADDR:-:8081}'

    volumes:
      - '${MIGRATIONS_PATH:-../../../db/clickhouse}:/migrations:ro'
    logging:
      driver: 'json-file'
      options:
        max-size: '50m'
        max-file: '5'
