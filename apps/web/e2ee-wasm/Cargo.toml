[package]
name = "vodozemac-winkey"
version = "0.1.0"
edition = "2021"
description = "Thin wasm-bindgen wrapper around vodozemac for Winkey SOC-3 E2EE"
authors = ["Antigravity 1 <antigravity1@winkey.vn>"]
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
vodozemac = { version = "0.11.1", features = ["wasm_js", "libolm-compat"] }
wasm-bindgen = "0.2.100"
getrandom = { version = "0.2.15", features = ["js"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zeroize = { version = "1.8", features = ["zeroize_derive"] }

[dev-dependencies]
wasm-bindgen-test = "0.3.50"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O", "--enable-bulk-memory"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = true
