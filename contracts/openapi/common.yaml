openapi: 3.1.0
info:
  title: Winkey shared components
  version: 1.0.0
  description: Shared schemas, parameters and responses referenced by every Winkey API spec.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
paths: {}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        RS256 access token issued by auth-svc (15 min). The edge gateway validates it through
        auth-svc `GET /v1/auth/verify` (Traefik forwardAuth) and forwards the identity to upstream
        services as `X-User-Id` / `X-User-Roles`. Upstream services never parse the JWT themselves.

  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor copied from `next_cursor` of the previous page.
      schema:
        type: string
        maxLength: 512
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 24
    VideoId:
      name: video_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'

  schemas:
    Uuid:
      type: string
      format: uuid
      description: UUIDv7 generated by the owning service.
      examples: ['0192f5e4-7c1a-7b3e-9d2a-5f6e7a8b9c0d']

    Problem:
      type: object
      description: RFC 9457 problem details. Content type `application/problem+json`.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
          description: Stable identifier of the error kind, e.g. `/problems/validation`.
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          description: Machine-readable error code, SCREAMING_SNAKE_CASE (e.g. `UPLOAD_TOO_LARGE`).
        errors:
          type: array
          description: Field-level validation errors.
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
              message:
                type: string

    Role:
      type: string
      enum: [viewer, creator, moderator, admin]

    PublicProfile:
      type: object
      required: [id, handle, display_name, avatar_url]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        handle:
          type: string
          pattern: '^[A-Za-z0-9_.]{3,30}$'
        display_name:
          type: string
          minLength: 1
          maxLength: 50
        avatar_url:
          type: [string, 'null']
          format: uri

    VideoStatus:
      type: string
      enum: [UPLOADING, UPLOADED, PROCESSING, READY, FAILED]

    Visibility:
      type: string
      enum: [PUBLIC, UNLISTED, PRIVATE]
      description: |
        Until task SEC1 (signed cookies) ships, PRIVATE/UNLISTED only affect listings and API reads;
        media URLs are unguessable but not access-controlled.

  responses:
    BadRequest:
      description: Validation failed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing or invalid credentials.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Authenticated but not allowed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Resource does not exist or is not visible to the caller.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Resource is in a state that does not allow this operation.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Rate limit exceeded. See `Retry-After`.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
