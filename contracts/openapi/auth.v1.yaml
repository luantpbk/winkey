openapi: 3.1.0
info:
  title: Winkey auth-svc API
  version: 1.0.0
  description: |
    Identity, sessions and public user profiles. Owner: Antigravity 3 (tasks A1, A2, A3, A6).

    Session model:
    - Access token: RS256 JWT, 15 min, returned in the response body; the web client keeps it in memory.
      Claims: `iss`, `aud=winkey-api`, `sub` (user id), `roles`, `sid` (refresh family id), `iat`, `exp`, `jti`.
      Header `kid` references a key published at `/.well-known/jwks.json`.
    - Refresh token: opaque 256-bit random value in cookie `wk_rt`
      (`HttpOnly; Secure; SameSite=Strict; Path=/v1/auth; Max-Age=2592000`).
      Only its SHA-256 is stored. Every refresh rotates it; presenting an already-rotated token
      revokes the whole family (reuse detection).

    Account security (task SOC-1a, ADR-049 §3):
    - A refresh family is a **session** (`auth.sessions`, id = `sid`). `listMySessions` shows them; revoking one
      revokes its family.
    - **Second factor.** An account with TOTP or a passkey has `mfa_enabled = true`. Password and Google sign-in
      then return an `MfaChallenge` instead of tokens; `completeMfaLogin` finishes with a TOTP code, a recovery code
      or a passkey. Signing in with a passkey (`passkeyLogin`) needs no second step.
    - **Staff roles need a second factor.** With `STAFF_MFA_REQUIRED=true` (default) the access token of an account
      without `mfa_enabled` carries its roles **minus** `moderator` and `admin`; `User.staff_roles_pending_mfa` lists
      what was left out so the web app can ask the user to turn on 2FA. Enabling 2FA takes effect at the next
      `refresh`; disabling it revokes every other session.
    - **Step-up.** Sensitive operations (marked "Needs step-up") answer `403` code `STEP_UP_REQUIRED` unless the
      caller's session re-authenticated with `stepUp` in the last 10 minutes.
    - **Captcha.** When auth-svc has `TURNSTILE_SECRET`, `register` always needs `turnstile_token`, and `login`
      needs it after 3 failed attempts for the same email or IP within 15 minutes. Missing → `400` code
      `CAPTCHA_REQUIRED`; rejected by Cloudflare → `400` code `CAPTCHA_INVALID`. Without the secret (dev, systest)
      the field is ignored.
    - **Breached passwords.** With `PASSWORD_BREACH_CHECK=true`, `register`, `changePassword` and `resetPassword`
      reject a password found in Pwned Passwords (k-anonymity range query, only the first 5 hex characters of its
      SHA-1 leave the server) with `400` code `PASSWORD_BREACHED`. If the lookup fails or takes longer than 1.5 s
      the password is accepted.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://winkey.vn
    description: Production. Same origin as the web app; the gateway routes `/v1/auth/*`, `/v1/users/*` and `/.well-known/*` to auth-svc.
  - url: http://localhost:8080
    description: Local dev stack (Traefik from deploy/compose).
tags:
  - name: auth
    description: Registration, sign-in and session management.
  - name: users
    description: Public user profiles.
  - name: security
    description: Second factors, passkeys, sessions and the security log of the signed-in user (task SOC-1a).
  - name: internal
    description: Endpoints for the gateway only; not routed to the internet.
  - name: admin
    description: |
      User administration (task A2). Routed by the gateway under `/v1/admin/*` with forwardAuth like any
      `/v1/*` route. Authorization uses `X-User-Roles` only:
      - `moderator` or `admin`: read users, suspend and unsuspend `viewer`/`creator` accounts;
      - `admin` only: change roles, suspend or unsuspend a `moderator`, read the audit log.
      Nobody can suspend an `admin`, suspend themselves or change their own roles (`403`, code
      `CANNOT_MODERATE_TARGET`). Every change writes one `auth.audit_log` row in the same transaction.
      Role and suspension changes reach other services through the access token, so they take effect
      within one access-token lifetime (≤ 15 min): suspension revokes every refresh-token family at once.
paths:
  /v1/auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: Create an account with email and password.
      description: |
        Also queues a `VERIFY_EMAIL` mail in the same transaction (task A6, see `resendEmailVerification`).
        An unverified email blocks nothing yet; the user sees a reminder in the web app.

        Closed beta (task BETA1, ADR-034): when auth-svc runs with `REGISTRATION_MODE=invite`, a new account
        needs a valid `invite_code`. Missing → `403` code `INVITE_REQUIRED`; not one of the configured codes →
        `403` code `INVITE_INVALID`. Both are checked before any other conflict, so the response never reveals
        whether an email or handle exists. With `REGISTRATION_MODE=open` (default) `invite_code` is accepted
        and ignored. Existing accounts sign in normally in both modes.

        Roles (task ROLE1, ADR-046): a new account — password or Google — gets `roles = [viewer]` only. Uploading and
        managing videos need `creator`, granted by an admin through `createCreatorRequest` /
        `adminDecideCreatorRequest` or `adminSetUserRoles`.
        Local dev and test stacks (compose, systest, CI simulation) may run auth-svc with
        `SIGNUP_ROLES=viewer,creator` so their seed accounts can upload; production never sets it (default `viewer`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created and signed in. Sets the `wk_rt` cookie.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '409':
          $ref: './common.yaml#/components/responses/Conflict'
        '429':
          $ref: './common.yaml#/components/responses/TooManyRequests'

  /v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Sign in with email and password.
      description: |
        When the account has a second factor (SOC-1a) the response is an `MfaChallenge`: no cookie is set and the
        client calls `completeMfaLogin` with its `mfa_token`. Otherwise it is a `TokenResponse` and `wk_rt` is set.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Signed in (sets `wk_rt`), or a second factor is needed (no cookie).
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/TokenResponse'
                  - $ref: '#/components/schemas/MfaChallenge'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          description: |
            Correct credentials but the account is suspended (code `ACCOUNT_SUSPENDED`, task A2). Checked
            only after the password verifies, so it does not reveal whether an email exists.
          content:
            application/problem+json:
              schema:
                $ref: './common.yaml#/components/schemas/Problem'
        '429':
          $ref: './common.yaml#/components/responses/TooManyRequests'

  /v1/auth/refresh:
    post:
      tags: [auth]
      operationId: refresh
      summary: Rotate the refresh cookie and issue a new access token.
      description: Requires the `wk_rt` cookie. The server also rejects requests whose `Origin` is not the site origin.
      security: []
      responses:
        '200':
          description: New access token; `wk_rt` rotated.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'

  /v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Revoke the current refresh family and clear the cookie.
      security: []
      responses:
        '204':
          description: Signed out.
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'

  /v1/auth/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: Current user.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The signed-in user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
    patch:
      tags: [auth]
      operationId: updateMe
      summary: Edit your own profile (tasks A3, SOC-1b).
      description: |
        At least one field. A handle that another account uses (case-insensitive) → `409` `HANDLE_TAKEN`.
        Sending the current value again is a no-op (`200`). Rate limited per user: 10 changes / hour → `429`.
        The new handle takes effect immediately in `auth.public_profiles`; old `/@handle` URLs stop resolving.

        Profile fields (SOC-1b, ADR-049):
        - `bio`: trimmed; empty string or `null` clears it. Rendered as plain text only.
        - `links`: replaces the whole list (≤ 5). Each `url` must be `https://`, ≤ 200 chars, without credentials
          (`user:pass@`); otherwise `400` code `LINK_INVALID`. Labels are trimmed.
        - `avatar_image_id` / `banner_image_id`: an image from `media.ready_images` owned by the caller with purpose
          `AVATAR` / `BANNER` (upload-svc `createImageUpload`); otherwise `400` code `IMAGE_INVALID`. auth-svc copies
          its `image_key` into `avatar_key` / `banner_key`. `null` removes the avatar / banner.
        - `is_private`: see social-svc `subscribe` for what a private account changes. Turning it off does not
          approve pending follow requests; they stay until the owner decides.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMeRequest'
      responses:
        '200':
          description: The user after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '409':
          $ref: './common.yaml#/components/responses/Conflict'
        '429':
          $ref: './common.yaml#/components/responses/TooManyRequests'
    delete:
      tags: [auth]
      operationId: deleteMe
      summary: Delete your own account (task A3).
      description: |
        Confirmation: `confirm_handle` must equal your current handle (case-insensitive), and accounts with a
        password must also send the correct `password`; otherwise `400` (`CONFIRMATION_MISMATCH`) or `403`
        (`INVALID_CREDENTIALS`). Rate limited like `login` → `429`.

        In one transaction: `status = DELETED`; `email` → `deleted+<id>@invalid.winkey.vn`; `handle` →
        `d_` + the first 28 hex digits of the id without dashes; `display_name` → `Deleted user`;
        `password_hash`, `email_verified_at`, `avatar_key` → NULL; every `oauth_identities` row and every
        refresh-token family of the user is removed / revoked. The email and handle become free for new
        accounts. The response clears `wk_rt`. Already-issued access tokens keep working until they expire
        (≤ 15 min), exactly as for suspension; every service already hides content of non-ACTIVE owners
        through `auth.public_profiles`. Admins cannot delete themselves while they are the last admin
        (`409` `LAST_ADMIN`).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteMeRequest'
      responses:
        '204':
          description: Account deleted; `wk_rt` cleared.
          headers:
            Set-Cookie:
              schema:
                type: string
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '409':
          $ref: './common.yaml#/components/responses/Conflict'
        '429':
          $ref: './common.yaml#/components/responses/TooManyRequests'

  /v1/auth/me/creator-request:
    get:
      tags: [auth]
      operationId: getMyCreatorRequest
      summary: Your latest creator-upgrade request (task ROLE1, ADR-046).
      description: |
        The most recent request of the signed-in user, whatever its status. None yet → `404`. The web client
        polls this on the upgrade page; when it turns `APPROVED` while the access token still lacks `creator`,
        it calls `refresh` once to get a token with the new role (approval never revokes sessions).
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The latest request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatorRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'
    post:
      tags: [auth]
      operationId: createCreatorRequest
      summary: Ask an admin to grant the `creator` role (task ROLE1, ADR-046).
      description: |
        Creates a `PENDING` request. Conflicts (`409`), checked in this order:
        - the user already has `creator` → `ALREADY_CREATOR`;
        - the user already has a `PENDING` request → `REQUEST_PENDING`;
        - the latest request was `REJECTED` less than 24 h ago → `REQUEST_COOLDOWN` (the problem `detail`
          says when a new request is possible).
        Rate limited per user: 5 requests / day → `429`. Logs carry the request id and user id, never `message`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCreatorRequestRequest'
      responses:
        '201':
          description: The new request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatorRequest'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '409':
          $ref: './common.yaml#/components/responses/Conflict'
        '429':
          $ref: './common.yaml#/components/responses/TooManyRequests'

  /v1/auth/me/password:
    put:
      tags: [auth]
      operationId: changePassword
      summary: Set or change your password (task A3).
      description: |
        - Account with a password: `current_password` is required and must match, else `403`
          `INVALID_CREDENTIALS`.
        - OAuth-only account (`has_password = false`): `current_password` must be omitted; this sets a first
          password so the account can also sign in with email + password.

        On success every refresh-token family of the user is revoked **except** the one in the request's
        `wk_rt` cookie (other devices are signed out; this one stays). Rate limited like `login` → `429`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Password changed.
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '429':
          $ref: './common.yaml#/components/responses/TooManyRequests'

  /v1/auth/password/forgot:
    post:
      tags: [auth]
      operationId: requestPasswordReset
      summary: Email a password-reset link (task A6, ADR-026).
      description: |
        Always answers `202` with an empty body, whether or not the email belongs to an account, so the
        endpoint cannot be used to find accounts. When the email belongs to an `ACTIVE` user, auth-svc stores
        a one-time token (SHA-256 only, valid 1 hour) and queues a `RESET_PASSWORD` mail with the link
        `{PUBLIC_ORIGIN}/{locale}/reset-password?token={token}`. Earlier unused reset tokens of that user
        stay valid until they expire or one of them is used. At most 3 reset mails per user per hour: extra
        requests still answer `202` and send nothing. Rate limited per IP like `login` → `429`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '202':
          description: Accepted. A mail is sent only if the account exists and is active.
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '429':
          $ref: './common.yaml#/components/responses/TooManyRequests'

  /v1/auth/password/reset:
    post:
      tags: [auth]
      operationId: resetPassword
      summary: Set a new password with a reset token (task A6, ADR-026).
      description: |
        The token must exist, be a `RESET_PASSWORD` token, be unused, not expired, belong to an `ACTIVE` user
        and have been sent to the user's current email; otherwise `400` with code `INVALID_TOKEN` (one code for
        every case). On success, in one transaction:
        - set the new password (also works for an OAuth-only account, which then gets a password);
        - mark this token and every other unused reset token of the user as used;
        - set `email_verified_at` if it was NULL (the user proved they read the mailbox);
        - revoke every refresh-token family of the user and record the revocation mark (ADR-019), so every
          device is signed out, including access tokens within seconds;
        - queue a `PASSWORD_CHANGED` mail (no link).
        Does not sign the caller in and sets no cookie. Rate limited per IP like `login` → `429`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '204':
          description: Password changed; sign in again.
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '429':
          $ref: './common.yaml#/components/responses/TooManyRequests'

  /v1/auth/email/verification:
    post:
      tags: [auth]
      operationId: resendEmailVerification
      summary: Send the email-verification link again (task A6, ADR-026).
      description: |
        Queues a `VERIFY_EMAIL` mail for the caller's current email with a new token (valid 48 hours) and the
        link `{PUBLIC_ORIGIN}/{locale}/verify-email?token={token}`. `409` with code `EMAIL_ALREADY_VERIFIED`
        when `email_verified` is already true. At most 3 per user per hour, else `429`. `register` sends the
        first one automatically. Mail language for this call and for `register`: `Accept-Language` starting
        with `en` → English, anything else → Vietnamese.
      security:
        - bearerAuth: []
      responses:
        '202':
          description: Mail queued.
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '409':
          $ref: './common.yaml#/components/responses/Conflict'
        '429':
          $ref: './common.yaml#/components/responses/TooManyRequests'

  /v1/auth/email/verify:
    post:
      tags: [auth]
      operationId: verifyEmail
      summary: Confirm an email address with a verification token (task A6, ADR-026).
      description: |
        No authentication: the link may be opened on another device. The token must be a `VERIFY_EMAIL` token,
        unused, not expired, of an `ACTIVE` user, and its email must still equal the user's current email;
        otherwise `400` with code `INVALID_TOKEN`. On success the token is marked used and `email_verified_at`
        is set (kept if already set). Using a token twice gives `400 INVALID_TOKEN`; the web page should then
        tell the user to sign in and check the settings page. Rate limited per IP like `login` → `429`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
      responses:
        '204':
          description: Email verified.
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '429':
          $ref: './common.yaml#/components/responses/TooManyRequests'

  /v1/auth/login/mfa:
    post:
      tags: [auth]
      operationId: completeMfaLogin
      summary: Finish a sign-in that needs a second factor (task SOC-1a).
      description: |
        The `mfa_token` comes from `login` (body) or from the `wk_mfa` cookie set by the Google callback; the body
        value wins when both are present. A token lives 5 minutes and allows 5 attempts; after that, or once used,
        → `401` code `MFA_TOKEN_INVALID` and the user signs in again. A wrong code → `401` code `MFA_CODE_INVALID`
        (and a `MFA_FAILED` security event). A TOTP code is accepted once (`users.totp_last_step`). A recovery code
        is spent on use (`RECOVERY_CODE_USED` event; the response's `user` shows how many remain through
        `getMySecurity`). For `method = passkey`, `flow_id` comes from `passkeyAssertionOptions` with
        `purpose = mfa`. On success: the session gets `amr = [pwd|google, otp|rcode|passkey]`, `wk_rt` is set and
        `wk_mfa` cleared.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaLoginRequest'
      responses:
        '200':
          description: Signed in. Sets `wk_rt`, clears `wk_mfa`.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '429':
          $ref: './common.yaml#/components/responses/TooManyRequests'

  /v1/auth/passkeys/assertion-options:
    post:
      tags: [auth]
      operationId: passkeyAssertionOptions
      summary: WebAuthn request options for signing in, finishing a sign-in, or re-authenticating (task SOC-1a).
      description: |
        - `purpose = login`: no authentication; `allowCredentials` is empty (discoverable credentials only), so the
          response never reveals whether an account exists.
        - `purpose = mfa`: needs `mfa_token` (body or `wk_mfa` cookie); `allowCredentials` lists that user's passkeys.
        - `purpose = step_up`: needs a bearer token; `allowCredentials` lists the caller's passkeys.

        `userVerification = required`, `rpId = WEBAUTHN_RP_ID` (production `winkey.vn`), timeout 120 s. The
        challenge is single-use and lives 2 minutes (Valkey), bound to `flow_id` and the purpose.
      security:
        - {}
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasskeyAssertionOptionsRequest'
      responses:
        '200':
          description: Options for `navigator.credentials.get()`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasskeyOptions'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '429':
          $ref: './common.yaml#/components/responses/TooManyRequests'

  /v1/auth/passkeys/login:
    post:
      tags: [auth]
      operationId: passkeyLogin
      summary: Sign in with a passkey (task SOC-1a).
      description: |
        `flow_id` from `passkeyAssertionOptions` (`purpose = login`). The credential must belong to an ACTIVE
        account and pass WebAuthn verification (origin, rpIdHash, user verification flag, signature, sign counter:
        a counter that goes backwards is rejected and logged). Any failure → `401` code `INVALID_CREDENTIALS`.
        A suspended account → `403` `ACCOUNT_SUSPENDED` after verification. A passkey is both factors: the session
        gets `amr = [passkey]` and staff roles are kept.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasskeyAssertionRequest'
      responses:
        '200':
          description: Signed in. Sets `wk_rt`.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '429':
          $ref: './common.yaml#/components/responses/TooManyRequests'

  /v1/auth/me/step-up:
    post:
      tags: [security]
      operationId: stepUp
      summary: Re-authenticate the current session for 10 minutes (task SOC-1a).
      description: |
        Methods: `password` (accounts with a password), `totp`, `passkey` (`flow_id` from
        `passkeyAssertionOptions` with `purpose = step_up`) or `email_code` (6 digits sent by
        `sendStepUpEmailCode`; for accounts with neither a password nor a second factor, e.g. Google-only).
        Recovery codes are not accepted here. A method the account does not have → `400` code `METHOD_UNAVAILABLE`;
        a wrong secret → `403` code `INVALID_CREDENTIALS`. Rate limited like `login`. Sets
        `auth.sessions.step_up_at` for the caller's `sid` and writes a `STEP_UP` security event.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StepUpRequest'
      responses:
        '200':
          description: The session is re-authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StepUpResult'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '429':
          $ref: './common.yaml#/components/responses/TooManyRequests'

  /v1/auth/me/step-up/email-code:
    post:
      tags: [security]
      operationId: sendStepUpEmailCode
      summary: Email a 6-digit re-authentication code (task SOC-1a).
      description: |
        Queues a mail with a 6-digit code valid 10 minutes, bound to the caller's session (only its hash is kept,
        in Valkey). Issuing a new code invalidates the previous one. At most 3 per session per 10 minutes → `429`.
      security:
        - bearerAuth: []
      responses:
        '202':
          description: Code queued.
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '429':
          $ref: './common.yaml#/components/responses/TooManyRequests'

  /v1/auth/me/security:
    get:
      tags: [security]
      operationId: getMySecurity
      summary: Second factors and step-up state of the signed-in user (task SOC-1a).
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Summary for the security settings page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecuritySummary'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'

  /v1/auth/me/totp:
    post:
      tags: [security]
      operationId: startTotpSetup
      summary: Start enabling TOTP — returns a new secret (task SOC-1a). Needs step-up.
      description: |
        Generates a 160-bit secret, kept encrypted in Valkey for 10 minutes under `setup_id` until
        `confirmTotpSetup`. TOTP already enabled → `409` code `TOTP_ALREADY_ENABLED`. The secret is shown once;
        it is never returned again.
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Scan `otpauth_uri` (QR) or type `secret` into an authenticator app.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpSetup'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '409':
          $ref: './common.yaml#/components/responses/Conflict'
    delete:
      tags: [security]
      operationId: disableTotp
      summary: Turn TOTP off (task SOC-1a). Needs step-up.
      description: |
        Removes the secret. When the account then has no passkey either, its recovery codes are deleted,
        `mfa_enabled` becomes false and every session except the caller's is revoked (`MFA_DISABLED`).
        TOTP not enabled → `404`. Writes `TOTP_DISABLED`.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: TOTP disabled.
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'

  /v1/auth/me/totp/confirm:
    post:
      tags: [security]
      operationId: confirmTotpSetup
      summary: Finish enabling TOTP with a first code (task SOC-1a).
      description: |
        `setup_id` unknown or expired → `404`. Wrong code → `400` code `MFA_CODE_INVALID` (5 tries per setup).
        On success the encrypted secret is stored in `auth.users`, and when the account had no recovery codes yet
        10 new ones are generated and returned once. Writes `TOTP_ENABLED` (and `RECOVERY_CODES_GENERATED`).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpConfirmRequest'
      responses:
        '200':
          description: TOTP enabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpConfirmResult'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'
        '429':
          $ref: './common.yaml#/components/responses/TooManyRequests'

  /v1/auth/me/recovery-codes:
    post:
      tags: [security]
      operationId: regenerateRecoveryCodes
      summary: Replace all recovery codes with 10 new ones (task SOC-1a). Needs step-up.
      description: |
        Only for accounts with `mfa_enabled` (otherwise `409` code `MFA_NOT_ENABLED`). Old codes stop working
        immediately. Codes are 10 characters from `[a-z2-9]` shown as `xxxxx-xxxxx`; matching ignores case, spaces
        and dashes. Writes `RECOVERY_CODES_GENERATED`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The new codes, shown once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryCodes'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '409':
          $ref: './common.yaml#/components/responses/Conflict'

  /v1/auth/me/passkeys:
    get:
      tags: [security]
      operationId: listMyPasskeys
      summary: Passkeys of the signed-in user (task SOC-1a).
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Oldest first; at most 10.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasskeyList'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
    post:
      tags: [security]
      operationId: addPasskey
      summary: Register a passkey (task SOC-1a). Needs step-up.
      description: |
        `flow_id` from `passkeyRegistrationOptions`. Attestation `none` is accepted (no attestation required);
        user verification must be set. 10 passkeys already → `409` code `PASSKEY_LIMIT`; a credential id already
        registered (any account) → `409` code `PASSKEY_EXISTS`. The first passkey of an account without TOTP also
        generates 10 recovery codes (returned in `recovery_codes`, else null). Writes `PASSKEY_ADDED`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddPasskeyRequest'
      responses:
        '201':
          description: Registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddPasskeyResult'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '409':
          $ref: './common.yaml#/components/responses/Conflict'

  /v1/auth/me/passkeys/registration-options:
    post:
      tags: [security]
      operationId: passkeyRegistrationOptions
      summary: WebAuthn creation options for a new passkey (task SOC-1a). Needs step-up.
      description: |
        `residentKey = required`, `userVerification = required`, `attestation = none`, `excludeCredentials` = the
        caller's passkeys, `user.id` (the WebAuthn user handle) = HMAC-SHA256(WEBAUTHN_USER_HANDLE_KEY, user id), never the
        user id itself, `user.name` = handle.
        The challenge is single-use and lives 2 minutes.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Options for `navigator.credentials.create()`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasskeyOptions'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'

  /v1/auth/me/passkeys/{passkey_id}:
    parameters:
      - name: passkey_id
        in: path
        required: true
        schema:
          $ref: './common.yaml#/components/schemas/Uuid'
    patch:
      tags: [security]
      operationId: renamePasskey
      summary: Rename a passkey (task SOC-1a).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenamePasskeyRequest'
      responses:
        '200':
          description: The passkey after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Passkey'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'
    delete:
      tags: [security]
      operationId: deletePasskey
      summary: Remove a passkey (task SOC-1a). Needs step-up.
      description: |
        Not the caller's → `404`. Removing the last second factor (no TOTP, no other passkey) behaves like
        `disableTotp`: recovery codes deleted, other sessions revoked. Writes `PASSKEY_REMOVED`.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Removed.
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'

  /v1/auth/me/sessions:
    get:
      tags: [security]
      operationId: listMySessions
      summary: Active sessions (signed-in devices) of the user (task SOC-1a).
      description: Non-revoked, non-expired sessions, most recently used first, at most 50. `current` marks the caller's `sid`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The sessions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionList'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'

  /v1/auth/me/sessions/{session_id}:
    parameters:
      - name: session_id
        in: path
        required: true
        schema:
          $ref: './common.yaml#/components/schemas/Uuid'
    delete:
      tags: [security]
      operationId: revokeMySession
      summary: Sign out one device (task SOC-1a).
      description: |
        Revokes the session and its refresh family (`USER_REVOKED`). Not the caller's or already revoked → `404`.
        Revoking the caller's own session works like `logout` and clears `wk_rt`. Its access tokens keep working
        until they expire (≤ 15 min), as for every revocation. Writes `SESSION_REVOKED`.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Revoked.
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'

  /v1/auth/me/sessions/revoke-others:
    post:
      tags: [security]
      operationId: revokeOtherSessions
      summary: Sign out every other device (task SOC-1a).
      description: Revokes every session of the user except the caller's (`REVOKE_OTHERS`). Writes `OTHER_SESSIONS_REVOKED`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: How many sessions were revoked.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [revoked]
                properties:
                  revoked:
                    type: integer
                    minimum: 0
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'

  /v1/auth/sessions/report:
    post:
      tags: [security]
      operationId: reportSession
      summary: '"This wasn''t me" from a new-sign-in mail: revoke that session (task SOC-1a).'
      description: |
        A `NEW_SIGN_IN` mail is queued when a sign-in comes from a device the account has not used before (no
        session of the user with the same `ip_hash` and device label in the last 90 days). It carries a
        `SESSION_REPORT` email token (single use, 7 days) bound to that session. Using it revokes the session
        (`REPORTED`), writes `SESSION_REPORTED`, and the web app then suggests changing the password and enabling
        2FA. Unknown, used or expired token → `400` code `TOKEN_INVALID`. No authentication: the token is the proof.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
      responses:
        '204':
          description: The session was revoked (or was already revoked).
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '429':
          $ref: './common.yaml#/components/responses/TooManyRequests'

  /v1/auth/me/security-events:
    get:
      tags: [security]
      operationId: listMySecurityEvents
      summary: Security log of the signed-in user, newest first (task SOC-1a).
      description: Kept 1 year. Never contains secrets, codes or IP addresses.
      security:
        - bearerAuth: []
      parameters:
        - $ref: './common.yaml#/components/parameters/Cursor'
        - $ref: './common.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: A page of events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityEventPage'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'

  /v1/auth/oauth/google:
    get:
      tags: [auth]
      operationId: googleStart
      summary: Start Google OAuth (authorization code + PKCE).
      security: []
      parameters:
        - name: return_to
          in: query
          required: false
          description: Relative path to return to after sign-in. Absolute URLs are rejected.
          schema:
            type: string
            pattern: '^/[^/].*$|^/$'
        - name: invite_code
          in: query
          required: false
          description: |
            Closed beta (ADR-034). Carried in the signed, HttpOnly OAuth state cookie next to the PKCE verifier
            (never sent to Google) and checked in the callback only when the Google account is not linked to an
            existing user. Not validated here, so a
            wrong code is reported after the Google round trip.
          schema:
            type: string
            minLength: 1
            maxLength: 64
      responses:
        '302':
          description: Redirect to Google.
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'

  /v1/auth/oauth/google/callback:
    get:
      tags: [auth]
      operationId: googleCallback
      summary: Google OAuth callback. Links or creates the account, sets `wk_rt`, redirects to `return_to`.
      description: |
        Second factor (SOC-1a): when the account has `mfa_enabled`, `wk_rt` is NOT set. auth-svc sets cookie
        `wk_mfa` (the `mfa_token`; `HttpOnly; Secure; SameSite=Lax; Path=/v1/auth/login; Max-Age=300`) and redirects
        to `/login/2fa?return_to=<return_to>`, where the web app calls `completeMfaLogin` without `mfa_token` in the
        body. The token never appears in a URL.

        With `REGISTRATION_MODE=invite` (ADR-034), creating a NEW account needs the `invite_code` given to
        `googleStart`. Missing → redirect to `/register?error=INVITE_REQUIRED`; invalid → redirect to
        `/register?error=INVITE_INVALID`. In both cases no user is created and `wk_rt` is not set. Linking to an
        existing account (same verified email) and signing in an already linked account never need a code.
      security: []
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        '302':
          description: Redirect back to the web app. The web app then calls `/v1/auth/refresh` to get an access token.
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'

  /v1/auth/verify:
    get:
      tags: [internal]
      operationId: verify
      summary: Gateway forwardAuth endpoint. Not routed publicly.
      description: |
        - No `Authorization` header → `204` without identity headers (anonymous request).
        - Valid bearer token → `204` with `X-User-Id` and `X-User-Roles`.
        - Invalid or expired token → `401`.

        Signature and claims are checked in memory, no database access. Task A4 (ADR-019): then ONE Valkey
        round trip checks the revocation keys; a token whose session (`sid`) was revoked, or whose `iat` is not
        after the user's revocation cutoff (suspension, role change, account deletion), → `401`. If Valkey does
        not answer within 50 ms the check is skipped (fail-open, counted in a metric).
        The gateway MUST strip client-supplied `X-User-Id` / `X-User-Roles` before calling upstreams.
      security: []
      parameters:
        - name: Authorization
          in: header
          required: false
          schema:
            type: string
            pattern: '^Bearer .+$'
      responses:
        '204':
          description: Request may proceed.
          headers:
            X-User-Id:
              description: Present only for authenticated requests.
              schema:
                type: string
                format: uuid
            X-User-Roles:
              description: Comma-separated roles, e.g. `viewer,creator`. Present only for authenticated requests.
              schema:
                type: string
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'

  /.well-known/jwks.json:
    get:
      tags: [internal]
      operationId: jwks
      summary: Public signing keys (JWKS). Keep the previous key published for at least 24h after rotation.
      security: []
      responses:
        '200':
          description: JSON Web Key Set.
          content:
            application/json:
              schema:
                type: object
                required: [keys]
                properties:
                  keys:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
        '404':
          $ref: './common.yaml#/components/responses/NotFound'

  /v1/users/{handle}:
    get:
      tags: [users]
      operationId: getUserByHandle
      summary: Public profile (channel header).
      description: |
        SOC-1b: also returns the profile fields. Follower counts, the caller's relationship and blocks come from
        social-svc (`getSubscription`, `getRelationship`). A private account's profile header is still public.
      security: []
      parameters:
        - name: handle
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9_.]{3,30}$'
      responses:
        '200':
          description: Public profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'

  /v1/admin/users:
    get:
      tags: [admin]
      operationId: adminListUsers
      summary: Search users (moderator or admin). Newest first.
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: false
          description: Case-insensitive match on email or handle prefix, or on display name (trigram).
          schema:
            type: string
            minLength: 2
            maxLength: 100
        - name: role
          in: query
          required: false
          schema:
            $ref: './common.yaml#/components/schemas/Role'
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/UserStatus'
        - $ref: './common.yaml#/components/parameters/Cursor'
        - $ref: './common.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: One page of users.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserPage'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'

  /v1/admin/users/{user_id}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [admin]
      operationId: adminGetUser
      summary: One user with moderation details (moderator or admin).
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'

  /v1/admin/users/{user_id}/roles:
    parameters:
      - $ref: '#/components/parameters/UserId'
    put:
      tags: [admin]
      operationId: adminSetUserRoles
      summary: Replace a user's roles (admin only). Audited as `USER_ROLES_CHANGED`.
      description: |
        The set must contain `viewer`. Setting the same roles again is a no-op (`200`, no audit row).
        Changing your own roles → `403` `CANNOT_MODERATE_TARGET`. An admin may change another admin's
        roles. A `DELETED` user → `409`; removing `admin` from the last non-deleted admin → `409`
        `LAST_ADMIN`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetRolesRequest'
      responses:
        '200':
          description: The user after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'
        '409':
          $ref: './common.yaml#/components/responses/Conflict'

  /v1/admin/users/{user_id}/suspension:
    parameters:
      - $ref: '#/components/parameters/UserId'
    put:
      tags: [admin]
      operationId: adminSuspendUser
      summary: Suspend a user, or change an existing suspension. Audited as `USER_SUSPENDED`.
      description: |
        Sets `status = SUSPENDED`, stores `reason` and `until` (omitted or null = indefinite) and revokes
        every refresh-token family of the user (so `refresh` answers `401`). While suspended, `login`
        answers `403` with code `ACCOUNT_SUSPENDED` (the problem `detail` may include `until`, never the
        internal reason) and the Google callback redirects to `/login?error=ACCOUNT_SUSPENDED` without
        setting `wk_rt`. `verify` keeps accepting already-issued access tokens until they expire
        (≤ 15 min). A `DELETED` user → `409`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuspendUserRequest'
      responses:
        '200':
          description: The user after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'
        '409':
          $ref: './common.yaml#/components/responses/Conflict'
    delete:
      tags: [admin]
      operationId: adminUnsuspendUser
      summary: Lift a suspension. Audited as `USER_UNSUSPENDED`. Idempotent.
      description: An `ACTIVE` user → `200` without an audit row. A `DELETED` user → `409`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The user after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'
        '409':
          $ref: './common.yaml#/components/responses/Conflict'

  /v1/admin/creator-requests:
    get:
      tags: [admin]
      operationId: adminListCreatorRequests
      summary: Creator-upgrade requests (admin only, task ROLE1, ADR-046).
      description: |
        `status=PENDING` (default) is the review queue, oldest first. `APPROVED` / `REJECTED` list decided
        requests, most recently decided first. `pending_count` is the total number of `PENDING` requests
        whatever `status` is asked for (the admin tab badge). Moderators get `403`.
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/CreatorRequestStatus'
        - $ref: './common.yaml#/components/parameters/Cursor'
        - $ref: './common.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: One page of requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCreatorRequestPage'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'

  /v1/admin/creator-requests/{request_id}/decision:
    parameters:
      - name: request_id
        in: path
        required: true
        schema:
          $ref: './common.yaml#/components/schemas/Uuid'
    post:
      tags: [admin]
      operationId: adminDecideCreatorRequest
      summary: Approve or reject a creator-upgrade request (admin only, task ROLE1, ADR-046).
      description: |
        Only a `PENDING` request can be decided; otherwise `409` `REQUEST_ALREADY_DECIDED` (two admins racing:
        exactly one wins). `REJECT` needs a `note` (shown to the user); `APPROVE` may have one.

        `APPROVE`, in one transaction: the request becomes `APPROVED`; `creator` is added to the user's roles
        (kept if already there); one `auth.audit_log` row `USER_ROLES_CHANGED` with details
        `{from, to, creator_request_id}` is written when the roles actually change. Approval does **not**
        revoke sessions: adding a role is safe to reach other services on the next refresh (≤ 15 min), and the
        web client refreshes at once when it sees the approval. The user is not `ACTIVE` (suspended or
        deleted) → `409` `USER_NOT_ACTIVE`, nothing changes.

        `REJECT`: the request becomes `REJECTED` with the note; roles are untouched; no audit row (the request
        row itself records who decided and when). Deciding your own request → `403` `CANNOT_MODERATE_TARGET`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatorRequestDecision'
      responses:
        '200':
          description: The request after the decision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCreatorRequest'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'
        '409':
          $ref: './common.yaml#/components/responses/Conflict'

  /v1/admin/audit-log:
    get:
      tags: [admin]
      operationId: adminListAuditLog
      summary: Admin actions, newest first (admin only).
      security:
        - bearerAuth: []
      parameters:
        - name: target_user_id
          in: query
          required: false
          schema:
            $ref: './common.yaml#/components/schemas/Uuid'
        - $ref: './common.yaml#/components/parameters/Cursor'
        - $ref: './common.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: One page of audit entries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEntryPage'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'

components:
  parameters:
    UserId:
      name: user_id
      in: path
      required: true
      schema:
        $ref: './common.yaml#/components/schemas/Uuid'
  securitySchemes:
    bearerAuth:
      $ref: './common.yaml#/components/securitySchemes/bearerAuth'
  schemas:
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password, handle, display_name]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 8
          maxLength: 128
          writeOnly: true
        handle:
          type: string
          pattern: '^[A-Za-z0-9_.]{3,30}$'
        display_name:
          type: string
          minLength: 1
          maxLength: 50
        invite_code:
          type: string
          minLength: 1
          maxLength: 64
          writeOnly: true
          description: Closed-beta invite (ADR-034). Required only when auth-svc runs with `REGISTRATION_MODE=invite`.
        turnstile_token:
          $ref: '#/components/schemas/TurnstileToken'

    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
        turnstile_token:
          $ref: '#/components/schemas/TurnstileToken'

    User:
      type: object
      required: [id, email, email_verified, handle, display_name, avatar_url, roles, created_at]
      properties:
        id:
          $ref: './common.yaml#/components/schemas/Uuid'
        email:
          type: string
          format: email
        email_verified:
          type: boolean
        handle:
          type: string
        display_name:
          type: string
        avatar_url:
          type: [string, 'null']
          format: uri
        roles:
          type: array
          items:
            $ref: './common.yaml#/components/schemas/Role'
        has_password:
          type: boolean
          description: |
            Whether the account can sign in with email + password. Returned by `getMe` and `updateMe`
            (task A3) so the settings page knows whether `changePassword` and `deleteMe` need the current
            password.
        mfa_enabled:
          type: boolean
          description: The account has TOTP or at least one passkey (task SOC-1a).
        bio:
          type: [string, 'null']
          maxLength: 300
          description: SOC-1b.
        links:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/ProfileLink'
        banner_url:
          type: [string, 'null']
          format: uri
        is_private:
          type: boolean
        staff_roles_pending_mfa:
          type: array
          description: |
            Roles the account holds but that are left out of its access tokens until it enables a second factor
            (`STAFF_MFA_REQUIRED`, SOC-1a). Empty for most users. `roles` lists only the effective roles.
          items:
            $ref: './common.yaml#/components/schemas/Role'
        created_at:
          type: string
          format: date-time

    UpdateMeRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 50
        handle:
          type: string
          pattern: '^[A-Za-z0-9_.]{3,30}$'
        bio:
          type: [string, 'null']
          maxLength: 300
        links:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/ProfileLink'
        avatar_image_id:
          oneOf:
            - $ref: './common.yaml#/components/schemas/Uuid'
            - type: 'null'
        banner_image_id:
          oneOf:
            - $ref: './common.yaml#/components/schemas/Uuid'
            - type: 'null'
        is_private:
          type: boolean

    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [new_password]
      properties:
        current_password:
          type: string
          writeOnly: true
        new_password:
          type: string
          minLength: 8
          maxLength: 128
          writeOnly: true

    PasswordResetRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        locale:
          type: string
          enum: [vi, en]
          default: vi
          description: Language of the mail and of the link.

    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required: [token, new_password]
      properties:
        token:
          type: string
          minLength: 43
          maxLength: 43
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: The value of `token` in the link (256-bit random value, base64url without padding).
          writeOnly: true
        new_password:
          type: string
          minLength: 8
          maxLength: 128
          writeOnly: true

    VerifyEmailRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          minLength: 43
          maxLength: 43
          pattern: '^[A-Za-z0-9_-]{43}$'
          writeOnly: true

    DeleteMeRequest:
      type: object
      additionalProperties: false
      required: [confirm_handle]
      properties:
        confirm_handle:
          type: string
        password:
          type: string
          writeOnly: true
          description: Required when the account has a password.

    TokenResponse:
      type: object
      required: [access_token, token_type, expires_in, user]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          const: Bearer
        expires_in:
          type: integer
          description: Seconds until the access token expires.
          examples: [900]
        user:
          $ref: '#/components/schemas/User'

    UserStatus:
      type: string
      enum: [ACTIVE, SUSPENDED, DELETED]

    AdminUser:
      type: object
      required: [id, email, email_verified, handle, display_name, avatar_url, roles, status, suspended_until, suspension_reason, created_at]
      properties:
        id:
          $ref: './common.yaml#/components/schemas/Uuid'
        email:
          type: string
          format: email
        email_verified:
          type: boolean
        handle:
          type: string
        display_name:
          type: string
        avatar_url:
          type: [string, 'null']
          format: uri
        roles:
          type: array
          items:
            $ref: './common.yaml#/components/schemas/Role'
        status:
          $ref: '#/components/schemas/UserStatus'
        suspended_until:
          type: [string, 'null']
          format: date-time
          description: Null when not suspended or suspended indefinitely.
        suspension_reason:
          type: [string, 'null']
          description: Internal note, shown only to moderators and admins.
        created_at:
          type: string
          format: date-time

    AdminUserPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminUser'
        next_cursor:
          type: [string, 'null']

    SetRolesRequest:
      type: object
      additionalProperties: false
      required: [roles]
      properties:
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          contains:
            const: viewer
          items:
            $ref: './common.yaml#/components/schemas/Role'

    SuspendUserRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
        until:
          type: [string, 'null']
          format: date-time
          description: Must be in the future; omitted or null = indefinite.

    AuditEntry:
      type: object
      required: [id, actor, action, target_user_id, details, created_at]
      properties:
        id:
          $ref: './common.yaml#/components/schemas/Uuid'
        actor:
          $ref: './common.yaml#/components/schemas/PublicProfile'
        action:
          type: string
          enum: [USER_ROLES_CHANGED, USER_SUSPENDED, USER_UNSUSPENDED]
        target_user_id:
          $ref: './common.yaml#/components/schemas/Uuid'
        details:
          type: object
          additionalProperties: true
          description: '`{from, to}` for roles; `{reason, until}` for suspensions.'
        created_at:
          type: string
          format: date-time

    CreatorRequestStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED]

    CreateCreatorRequestRequest:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message:
          type: string
          minLength: 10
          maxLength: 1000
          description: What the user wants to publish (shown to admins only). Trimmed before the length check.

    CreatorRequest:
      type: object
      required: [id, status, message, decision_note, created_at, decided_at]
      properties:
        id:
          $ref: './common.yaml#/components/schemas/Uuid'
        status:
          $ref: '#/components/schemas/CreatorRequestStatus'
        message:
          type: string
        decision_note:
          type: [string, 'null']
          description: The admin's note; always present on `REJECTED`.
        created_at:
          type: string
          format: date-time
        decided_at:
          type: [string, 'null']
          format: date-time

    AdminCreatorRequest:
      allOf:
        - $ref: '#/components/schemas/CreatorRequest'
        - type: object
          required: [user, decided_by]
          properties:
            user:
              $ref: '#/components/schemas/AdminUser'
            decided_by:
              oneOf:
                - $ref: './common.yaml#/components/schemas/PublicProfile'
                - type: 'null'

    AdminCreatorRequestPage:
      type: object
      required: [items, next_cursor, pending_count]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminCreatorRequest'
        next_cursor:
          type: [string, 'null']
        pending_count:
          type: integer
          minimum: 0

    CreatorRequestDecision:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision:
          type: string
          enum: [APPROVE, REJECT]
        note:
          type: string
          minLength: 1
          maxLength: 500
          description: Required for `REJECT`; trimmed.

    AuditEntryPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditEntry'
        next_cursor:
          type: [string, 'null']

    TurnstileToken:
      type: string
      minLength: 1
      maxLength: 2048
      writeOnly: true
      description: Cloudflare Turnstile response token (SOC-1a). See the captcha rules in the API description.

    MfaMethod:
      type: string
      enum: [totp, recovery_code, passkey]

    MfaChallenge:
      type: object
      additionalProperties: false
      required: [mfa_required, mfa_token, methods, expires_in]
      properties:
        mfa_required:
          type: boolean
          const: true
        mfa_token:
          type: string
          description: Opaque, single-use, 5 minutes, 5 attempts. Send it to `completeMfaLogin`.
        methods:
          type: array
          minItems: 1
          description: Second factors the account has; `recovery_code` is present whenever unused codes remain.
          items:
            $ref: '#/components/schemas/MfaMethod'
        expires_in:
          type: integer
          examples: [300]

    WebAuthnCredential:
      type: object
      description: |
        The JSON form of a `PublicKeyCredential` (`credential.toJSON()`, WebAuthn Level 3): base64url fields. auth-svc
        validates it with a maintained WebAuthn library, never by hand.
      required: [id, rawId, type, response]
      properties:
        id:
          type: string
        rawId:
          type: string
        type:
          type: string
          const: public-key
        response:
          type: object
        authenticatorAttachment:
          type: [string, 'null']
        clientExtensionResults:
          type: object

    MfaLoginRequest:
      type: object
      additionalProperties: false
      required: [method]
      properties:
        mfa_token:
          type: string
          description: From `login`. Omit when the `wk_mfa` cookie carries it (Google sign-in).
        method:
          $ref: '#/components/schemas/MfaMethod'
        code:
          type: string
          minLength: 6
          maxLength: 32
          writeOnly: true
          description: The 6-digit TOTP code, or a recovery code. Required unless `method = passkey`.
        flow_id:
          type: string
          description: Required when `method = passkey`.
        credential:
          $ref: '#/components/schemas/WebAuthnCredential'

    PasskeyAssertionOptionsRequest:
      type: object
      additionalProperties: false
      required: [purpose]
      properties:
        purpose:
          type: string
          enum: [login, mfa, step_up]
        mfa_token:
          type: string
          description: For `purpose = mfa` when the `wk_mfa` cookie is not used.

    PasskeyOptions:
      type: object
      additionalProperties: false
      required: [flow_id, public_key]
      properties:
        flow_id:
          type: string
        public_key:
          type: object
          description: |
            `PublicKeyCredentialRequestOptionsJSON` (assertion) or `PublicKeyCredentialCreationOptionsJSON`
            (registration), base64url encoded, ready for `PublicKeyCredential.parse*OptionsFromJSON()`.

    PasskeyAssertionRequest:
      type: object
      additionalProperties: false
      required: [flow_id, credential]
      properties:
        flow_id:
          type: string
        credential:
          $ref: '#/components/schemas/WebAuthnCredential'

    StepUpRequest:
      type: object
      additionalProperties: false
      required: [method]
      properties:
        method:
          type: string
          enum: [password, totp, passkey, email_code]
        password:
          type: string
          writeOnly: true
        code:
          type: string
          pattern: '^[0-9]{6}$'
          writeOnly: true
          description: TOTP or email code.
        flow_id:
          type: string
        credential:
          $ref: '#/components/schemas/WebAuthnCredential'

    StepUpResult:
      type: object
      additionalProperties: false
      required: [step_up_until]
      properties:
        step_up_until:
          type: string
          format: date-time

    SecuritySummary:
      type: object
      additionalProperties: false
      required: [mfa_enabled, totp_enabled, passkey_count, recovery_codes_remaining, has_password, step_up_until, staff_roles_pending_mfa]
      properties:
        mfa_enabled:
          type: boolean
        totp_enabled:
          type: boolean
        passkey_count:
          type: integer
          minimum: 0
          maximum: 10
        recovery_codes_remaining:
          type: integer
          minimum: 0
          maximum: 10
        has_password:
          type: boolean
        step_up_until:
          type: [string, 'null']
          format: date-time
          description: When the current session's step-up expires; null when not stepped up.
        staff_roles_pending_mfa:
          type: array
          items:
            $ref: './common.yaml#/components/schemas/Role'

    TotpSetup:
      type: object
      additionalProperties: false
      required: [setup_id, secret, otpauth_uri, expires_at]
      properties:
        setup_id:
          type: string
        secret:
          type: string
          description: Base32, no padding.
          pattern: '^[A-Z2-7]{32}$'
        otpauth_uri:
          type: string
          description: '`otpauth://totp/Winkey:<handle>?secret=…&issuer=Winkey&algorithm=SHA1&digits=6&period=30`'
        expires_at:
          type: string
          format: date-time

    TotpConfirmRequest:
      type: object
      additionalProperties: false
      required: [setup_id, code]
      properties:
        setup_id:
          type: string
        code:
          type: string
          pattern: '^[0-9]{6}$'
          writeOnly: true

    RecoveryCodes:
      type: object
      additionalProperties: false
      required: [recovery_codes]
      properties:
        recovery_codes:
          type: array
          minItems: 10
          maxItems: 10
          items:
            type: string
            pattern: '^[a-z2-9]{5}-[a-z2-9]{5}$'

    TotpConfirmResult:
      type: object
      additionalProperties: false
      required: [recovery_codes]
      properties:
        recovery_codes:
          type: [array, 'null']
          description: 10 new codes when the account had none; null when it already had codes (from a passkey).
          items:
            type: string
            pattern: '^[a-z2-9]{5}-[a-z2-9]{5}$'

    Passkey:
      type: object
      additionalProperties: false
      required: [id, name, created_at, last_used_at, backed_up]
      properties:
        id:
          $ref: './common.yaml#/components/schemas/Uuid'
        name:
          type: string
          minLength: 1
          maxLength: 64
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: [string, 'null']
          format: date-time
        backed_up:
          type: boolean
          description: Synced passkey (backup state flag), e.g. iCloud Keychain or Google Password Manager.

    PasskeyList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/Passkey'

    AddPasskeyRequest:
      type: object
      additionalProperties: false
      required: [flow_id, credential, name]
      properties:
        flow_id:
          type: string
        credential:
          $ref: '#/components/schemas/WebAuthnCredential'
        name:
          type: string
          minLength: 1
          maxLength: 64

    AddPasskeyResult:
      type: object
      additionalProperties: false
      required: [passkey, recovery_codes]
      properties:
        passkey:
          $ref: '#/components/schemas/Passkey'
        recovery_codes:
          type: [array, 'null']
          items:
            type: string
            pattern: '^[a-z2-9]{5}-[a-z2-9]{5}$'

    RenamePasskeyRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64

    Session:
      type: object
      additionalProperties: false
      required: [id, current, device_label, country, created_at, last_used_at, methods]
      properties:
        id:
          $ref: './common.yaml#/components/schemas/Uuid'
        current:
          type: boolean
        device_label:
          type: [string, 'null']
          maxLength: 80
        country:
          type: [string, 'null']
          pattern: '^[A-Z]{2}$'
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
        methods:
          type: array
          description: How the session signed in (`amr`).
          items:
            type: string
            enum: [pwd, otp, rcode, passkey, google, email]

    SessionList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/Session'

    SecurityEventKind:
      type: string
      enum: [SIGN_IN, SIGN_IN_NEW_DEVICE, MFA_FAILED, TOTP_ENABLED, TOTP_DISABLED, RECOVERY_CODES_GENERATED,
             RECOVERY_CODE_USED, PASSKEY_ADDED, PASSKEY_REMOVED, SESSION_REVOKED, OTHER_SESSIONS_REVOKED,
             SESSION_REPORTED, PASSWORD_CHANGED, PASSWORD_RESET, STEP_UP]

    SecurityEvent:
      type: object
      additionalProperties: false
      required: [id, kind, session_id, device_label, country, details, created_at]
      properties:
        id:
          $ref: './common.yaml#/components/schemas/Uuid'
        kind:
          $ref: '#/components/schemas/SecurityEventKind'
        session_id:
          oneOf:
            - $ref: './common.yaml#/components/schemas/Uuid'
            - type: 'null'
        device_label:
          type: [string, 'null']
        country:
          type: [string, 'null']
          pattern: '^[A-Z]{2}$'
        details:
          type: object
          description: Kind-specific, e.g. `{"passkey_name":"iPhone"}`, `{"revoked":3}`.
        created_at:
          type: string
          format: date-time

    SecurityEventPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SecurityEvent'
        next_cursor:
          type: [string, 'null']

    ProfileLink:
      type: object
      additionalProperties: false
      required: [url, label]
      properties:
        url:
          type: string
          format: uri
          pattern: '^https://'
          maxLength: 200
        label:
          type: string
          minLength: 1
          maxLength: 30

    UserProfile:
      description: A public profile with the SOC-1b fields (`getUserByHandle`).
      allOf:
        - $ref: './common.yaml#/components/schemas/PublicProfile'
        - type: object
          description: Sent by every SOC-1b server; clients treat missing fields as empty / false.
          properties:
            bio:
              type: [string, 'null']
              maxLength: 300
            links:
