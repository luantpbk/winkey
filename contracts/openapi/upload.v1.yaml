openapi: 3.1.0
info:
  title: Winkey upload-svc API
  version: 1.0.0
  description: |
    Direct-to-object-storage multipart upload. Owner: Sonnet 5.5 (task V1).

    Flow:
    1. `POST /v1/uploads` creates the video row (`UPLOADING`) and an S3 multipart upload.
    2. `POST /v1/uploads/{video_id}/parts` returns presigned `PUT` URLs (TTL 1h) on the **public**
       S3 endpoint. The browser uploads each part directly and reads the `ETag` response header
       (the raw bucket CORS policy exposes `ETag`).
    3. `POST /v1/uploads/{video_id}/complete` completes the multipart upload, sets `UPLOADED` and
       writes a `video.uploaded` event to the transactional outbox in the same DB transaction.

    Audio tracks (task MUX1, ADR-042): extra audio tracks of an existing video (dub, voice-over, commentary)
    use the same three-step multipart flow under `/v1/uploads/{video_id}/audio-tracks`. Completing one writes
    a `video.audio_uploaded` event; the transcoder encodes only that audio, never the video again. Format rules:
    `docs/specs/media-package-v1.md`.

    Images (task SOC-1b, ADR-049 §4): avatars, banners and post images use a single presigned `PUT` (≤ 20 MiB)
    under `/v1/images`. Completing one writes a `media.image_uploaded` event; the transcoder converts it to WebP
    (metadata stripped, orientation applied), deletes the raw file and marks the image `READY` or `FAILED`.
    Clients poll `getImage` (every 1–2 s, at most 60 s). Videos keep their own flow and quality.

    Limits: `size_bytes` ≤ 20 GiB. `part_size = max(16 MiB, ceil(size_bytes / 10000))` rounded up to
    a whole MiB, so `part_count` ≤ 10,000. Abandoned uploads (`UPLOADING` > 24h) are aborted by a janitor.

    Quotas (task UQ1, ADR-027), checked by `createUpload` for every caller without role `admin`:
    - at most `UPLOAD_MAX_CONCURRENT` (default 3) of the caller's videos in status `UPLOADING`;
    - at most `UPLOAD_DAILY_COUNT` (default 20) uploads started in the last 24 hours;
    - at most `UPLOAD_DAILY_BYTES` (default 50 GiB) of `size_bytes` started in the last 24 hours, counting the
      new upload.
    Every video row created in the window counts, whatever its later status (aborted, failed, deleted), so
    deleting and re-uploading does not reset the quota. A refused request answers `429` with code
    `UPLOAD_QUOTA_EXCEEDED`, a `detail` naming the limit, and `Retry-After` in seconds (until the oldest
    counted upload leaves the 24-hour window; 60 for the concurrent limit).
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://winkey.vn
    description: Production.
  - url: http://localhost:8080
    description: Local dev stack (Traefik from deploy/compose).
tags:
  - name: uploads
    description: Direct-to-storage multipart uploads.
  - name: images
    description: |
      Social images (SOC-1b). Any signed-in user may upload (no `creator` role needed). Quotas, for every caller
      without role `admin`: at most `IMAGE_MAX_PENDING` (default 5) images in `UPLOADING` or `PROCESSING`, and
      `IMAGE_DAILY_COUNT` (default 60) images started in the last 24 hours → `429` code `UPLOAD_QUOTA_EXCEEDED`
      with `Retry-After`. Abandoned uploads (`UPLOADING` > 1 h) are deleted by the janitor.

      Outputs (WebP, quality ≈ 72), keys in the media bucket under `i/{owner_id}/{image_id}/`:
      - `AVATAR`: centre-cropped to a square, `image.webp` 400×400, `thumb.webp` 96×96;
      - `BANNER`: centre-cropped to 3:1, `image.webp` 1500×500, `thumb.webp` 600×200;
      - `POST`: long edge ≤ 1600 px (never upscaled), `thumb.webp` long edge ≤ 400 px.
      Inputs larger than 40 megapixels or 8000 px on a side, animated images and anything ffprobe does not read as a
      single still image fail with `INVALID_INPUT`.
security:
  - bearerAuth: []
paths:
  /v1/uploads:
    post:
      tags: [uploads]
      operationId: createUpload
      summary: Start an upload. Requires role `creator` (except `purpose = SOCIAL`).
      description: |
        SOC-2b (ADR-049): `purpose: SOCIAL` starts a short video for a post. Any signed-in user may do it (no `creator`
        role); the video is created `UNLISTED` whatever `visibility` says; `size_bytes` ≤ 314572800 (300 MiB) else `400`
        code `VIDEO_TOO_LARGE`. The transcoder fails a social video longer than 180 s (`video.failed` reason
        `INVALID_INPUT`, not retried; `getUpload.error` = "The video is longer than 3 minutes."). Clients check the
        duration before uploading. Social uploads count against the same quotas as films. The rest of the flow (parts,
        complete, progress, `getUpload`) is unchanged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUploadRequest'
      responses:
        '201':
          description: Upload started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateUploadResponse'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '429':
          description: Upload quota exceeded (code `UPLOAD_QUOTA_EXCEEDED`). See the quota rules above and `Retry-After`.
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
          content:
            application/problem+json:
              schema:
                $ref: './common.yaml#/components/schemas/Problem'

  /v1/uploads/{video_id}:
    parameters:
      - $ref: './common.yaml#/components/parameters/VideoId'
    get:
      tags: [uploads]
      operationId: getUpload
      summary: Upload / processing status (owner only). Used for polling when realtime is unavailable.
      responses:
        '200':
          description: Current status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadStatus'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'
    delete:
      tags: [uploads]
      operationId: abortUpload
      summary: Abort an upload that is still `UPLOADING` (owner only). Deletes the video row.
      responses:
        '204':
          description: Aborted.
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'
        '409':
          $ref: './common.yaml#/components/responses/Conflict'

  /v1/uploads/{video_id}/parts:
    parameters:
      - $ref: './common.yaml#/components/parameters/VideoId'
    post:
      tags: [uploads]
      operationId: presignParts
      summary: Presign part upload URLs (owner only, status `UPLOADING`). Can be called again to resume.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresignPartsRequest'
      responses:
        '200':
          description: Presigned URLs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresignPartsResponse'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'
        '409':
          $ref: './common.yaml#/components/responses/Conflict'

  /v1/uploads/{video_id}/complete:
    parameters:
      - $ref: './common.yaml#/components/parameters/VideoId'
    post:
      tags: [uploads]
      operationId: completeUpload
      summary: Complete the multipart upload (owner only). Idempotent once `UPLOADED`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteUploadRequest'
      responses:
        '202':
          description: Upload accepted; transcoding is queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadStatus'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'
        '409':
          $ref: './common.yaml#/components/responses/Conflict'

  /v1/images:
    post:
      tags: [images]
      operationId: createImageUpload
      summary: Start an image upload — returns one presigned PUT URL (task SOC-1b).
      description: |
        Creates the `media.images` row (`UPLOADING`) and a presigned `PUT` (TTL 15 min) on the public raw-bucket
        endpoint for `{owner_id}/images/{image_id}`. The signature covers `Content-Type` and `Content-Length`, so
        the browser must send exactly `content_type` and `size_bytes`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateImageUploadRequest'
      responses:
        '201':
          description: Upload started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateImageUploadResponse'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '429':
          description: Image quota exceeded (code `UPLOAD_QUOTA_EXCEEDED`).
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
          content:
            application/problem+json:
              schema:
                $ref: './common.yaml#/components/schemas/Problem'

  /v1/images/{image_id}:
    parameters:
      - $ref: '#/components/parameters/ImageId'
    get:
      tags: [images]
      operationId: getImage
      summary: An image of the caller and its processing state (task SOC-1b).
      description: Another user's image → `404`.
      responses:
        '200':
          description: The image.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Image'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'

  /v1/images/{image_id}/complete:
    parameters:
      - $ref: '#/components/parameters/ImageId'
    post:
      tags: [images]
      operationId: completeImageUpload
      summary: Mark an image uploaded; processing starts (task SOC-1b).
      description: |
        The image must be the caller's and `UPLOADING` (`409` code `INVALID_STATE` otherwise; `404` if unknown).
        upload-svc checks with `HEAD` that the object exists and its size equals `size_bytes` (`409` code
        `UPLOAD_INCOMPLETE` otherwise), then in one transaction sets `PROCESSING` and writes `media.image_uploaded`
        to the outbox. Idempotent for an image already `PROCESSING`, `READY` or `FAILED` (returns it as is).
      responses:
        '202':
          description: Processing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Image'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'
        '409':
          $ref: './common.yaml#/components/responses/Conflict'

  /v1/uploads/{video_id}/audio-tracks:
    parameters:
      - $ref: './common.yaml#/components/parameters/VideoId'
    post:
      tags: [uploads]
      operationId: createAudioTrackUpload
      summary: Start uploading an extra audio track for a video (owner with role `creator`, task MUX1).
      description: |
        Requires role `creator` like `createUpload` (ROLE1, ADR-046): without it `403`, before anything is read.
        The video must exist and not be `DELETED` (it may still be processing). At most 8 extra tracks per video
        and one per (`lang`, `kind`): a duplicate answers `409` `AUDIO_TRACK_EXISTS`, a ninth `409`
        `TOO_MANY_AUDIO_TRACKS`. The new track is `UPLOADING` until completed; it counts toward the upload quotas
        like a video upload.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAudioTrackUploadRequest'
      responses:
        '201':
          description: Upload started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAudioTrackUploadResponse'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'
        '409':
          $ref: './common.yaml#/components/responses/Conflict'
        '429':
          description: Upload quota exceeded (code `UPLOAD_QUOTA_EXCEEDED`), as for `createUpload`.
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
          content:
            application/problem+json:
              schema:
                $ref: './common.yaml#/components/schemas/Problem'

  /v1/uploads/{video_id}/audio-tracks/{track_id}:
    parameters:
      - $ref: './common.yaml#/components/parameters/VideoId'
      - $ref: '#/components/parameters/TrackId'
    delete:
      tags: [uploads]
      operationId: abortAudioTrackUpload
      summary: Abort an audio track upload that is still `UPLOADING` (owner only).
      responses:
        '204':
          description: Aborted.
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'
        '409':
          $ref: './common.yaml#/components/responses/Conflict'

  /v1/uploads/{video_id}/audio-tracks/{track_id}/parts:
    parameters:
      - $ref: './common.yaml#/components/parameters/VideoId'
      - $ref: '#/components/parameters/TrackId'
    post:
      tags: [uploads]
      operationId: presignAudioTrackParts
      summary: Presign part upload URLs for an audio track (owner only, track `UPLOADING`). Can be called again to resume.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresignPartsRequest'
      responses:
        '200':
          description: Presigned URLs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresignPartsResponse'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'
        '409':
          $ref: './common.yaml#/components/responses/Conflict'

  /v1/uploads/{video_id}/audio-tracks/{track_id}/complete:
    parameters:
      - $ref: './common.yaml#/components/parameters/VideoId'
      - $ref: '#/components/parameters/TrackId'
    post:
      tags: [uploads]
      operationId: completeAudioTrackUpload
      summary: Complete an audio track upload (owner only). Idempotent once `UPLOADED`; writes `video.audio_uploaded`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteUploadRequest'
      responses:
        '202':
          description: Accepted; the audio encode is queued.
          content:
            application/json:
              schema:
                $ref: './video.v1.yaml#/components/schemas/AudioTrack'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'
        '409':
          $ref: './common.yaml#/components/responses/Conflict'

components:
  parameters:
    ImageId:
      name: image_id
      in: path
      required: true
      schema:
        $ref: './common.yaml#/components/schemas/Uuid'
    TrackId:
      name: track_id
      in: path
      required: true
      schema:
        $ref: './common.yaml#/components/schemas/Uuid'
  securitySchemes:
    bearerAuth:
      $ref: './common.yaml#/components/securitySchemes/bearerAuth'
  schemas:
    CreateUploadRequest:
      type: object
      additionalProperties: false
      required: [title, filename, content_type, size_bytes]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 5000
          default: ''
        visibility:
          $ref: './common.yaml#/components/schemas/Visibility'
        filename:
          type: string
          minLength: 1
          maxLength: 255
        content_type:
          type: string
          enum: [video/mp4, video/quicktime, video/webm, video/x-matroska]
          description: Advisory only; the transcoder validates the real container with ffprobe.
        size_bytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 21474836480
        purpose:
          $ref: './common.yaml#/components/schemas/VideoPurpose'
          description: Defaults to `FILM` (task SOC-2b).

    CreateUploadResponse:
      type: object
      required: [video_id, part_size, part_count]
      properties:
        video_id:
          $ref: './common.yaml#/components/schemas/Uuid'
        part_size:
          type: integer
          format: int64
          description: Bytes per part. Every part except the last must be exactly this size.
        part_count:
          type: integer
          minimum: 1
          maximum: 10000

    CreateAudioTrackUploadRequest:
      type: object
      additionalProperties: false
      required: [lang, label, kind, filename, content_type, size_bytes]
      properties:
        lang:
          $ref: './video.v1.yaml#/components/schemas/LangTag'
        label:
          type: string
          minLength: 1
          maxLength: 50
          description: Shown in the player's audio menu, e.g. `Thuyết minh`.
        kind:
          $ref: './video.v1.yaml#/components/schemas/AudioTrackKind'
        is_default:
          type: boolean
          description: Absent means `false`. Selected first by players; setting it clears it on the video's other tracks.
        filename:
          type: string
          minLength: 1
          maxLength: 255
        content_type:
          type: string
          enum: [audio/wav, audio/x-wav, audio/flac, audio/mp4, audio/x-m4a, audio/aac, audio/ogg, audio/webm]
          description: Advisory only; the transcoder validates the real stream with ffprobe.
        size_bytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 4294967296

    CreateAudioTrackUploadResponse:
      type: object
      required: [track_id, part_size, part_count]
      properties:
        track_id:
          $ref: './common.yaml#/components/schemas/Uuid'
        part_size:
          type: integer
          format: int64
          description: Bytes per part, same rule as `createUpload`.
        part_count:
          type: integer
          minimum: 1
          maximum: 10000

    PresignPartsRequest:
      type: object
      additionalProperties: false
      required: [part_numbers]
      properties:
        part_numbers:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            type: integer
            minimum: 1
            maximum: 10000

    PresignPartsResponse:
      type: object
      required: [urls, expires_at]
      properties:
        urls:
          type: array
          items:
            type: object
            required: [part_number, url]
            properties:
              part_number:
                type: integer
              url:
                type: string
                format: uri
        expires_at:
          type: string
          format: date-time

    CompleteUploadRequest:
      type: object
      additionalProperties: false
      required: [parts]
      properties:
        parts:
          type: array
          minItems: 1
          maxItems: 10000
          items:
            type: object
            additionalProperties: false
            required: [part_number, etag]
            properties:
              part_number:
                type: integer
                minimum: 1
                maximum: 10000
              etag:
                type: string
                minLength: 1

    UploadStatus:
      type: object
      required: [video_id, status, progress, error]
      properties:
        video_id:
          $ref: './common.yaml#/components/schemas/Uuid'
        status:
          $ref: './common.yaml#/components/schemas/VideoStatus'
        progress:
          type: number
          minimum: 0
          maximum: 100
          description: Transcoding progress of the latest job; 0 before processing starts.
        error:
          type: [string, 'null']

    ImagePurpose:
      type: string
      enum: [AVATAR, BANNER, POST]

    CreateImageUploadRequest:
      type: object
      additionalProperties: false
      required: [purpose, content_type, size_bytes]
      properties:
        purpose:
          $ref: '#/components/schemas/ImagePurpose'
        content_type:
          type: string
          enum: [image/jpeg, image/png, image/webp, image/avif]
          description: Advisory; the transcoder trusts only ffprobe.
        size_bytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 20971520

    CreateImageUploadResponse:
      type: object
      additionalProperties: false
      required: [image_id, upload_url, upload_headers, expires_at]
      properties:
        image_id:
          $ref: './common.yaml#/components/schemas/Uuid'
        upload_url:
          type: string
          format: uri
        upload_headers:
          type: object
          description: Headers the `PUT` must send exactly (`Content-Type`; browsers set `Content-Length` themselves).
          additionalProperties:
            type: string
        expires_at:
          type: string
          format: date-time

    ImageStatus:
      type: string
      enum: [UPLOADING, PROCESSING, READY, FAILED]

    Image:
      type: object
      additionalProperties: false
      required: [id, purpose, status, url, thumb_url, width, height, error, created_at]
      properties:
        id:
          $ref: './common.yaml#/components/schemas/Uuid'
        purpose:
          $ref: '#/components/schemas/ImagePurpose'
        status:
          $ref: '#/components/schemas/ImageStatus'
        url:
          type: [string, 'null']
          format: uri
          description: Public URL of `image.webp` once READY.
        thumb_url:
          type: [string, 'null']
          format: uri
        width:
          type: [integer, 'null']
          minimum: 1
        height:
          type: [integer, 'null']
          minimum: 1
        error:
          type: [string, 'null']
          enum: [INVALID_INPUT, STORAGE_ERROR, INTERNAL, null]
          description: Set when FAILED. `INVALID_INPUT` means the file is not a usable still image.
        created_at:
          type: string
          format: date-time
