openapi: 3.1.0
info:
  title: Winkey video-svc API
  version: 1.0.0
  description: |
    Video metadata, feeds and playback info. Owner: Sonnet 5.5 (task S1).

    Visibility rules for non-owners: only `READY` videos are returned; `PRIVATE` → 404;
    `UNLISTED` → readable by id but never listed. Owners and `admin`/`moderator` see everything.
    Videos whose owner has no active profile (suspended or deleted, i.e. absent from
    `auth.public_profiles`) are hidden from feeds and return `404` to everyone except the owner,
    moderators and admins; for those callers `owner` is a placeholder profile with handle `deleted_user`.
    `GET /v1/videos?owner_id=` lists only `PUBLIC` + `READY` videos, even for the owner (use the studio).
    Task A2 — moderation: a video with `moderation_state = HIDDEN` is treated like `PRIVATE` for everyone
    except its owner, moderators and admins: `404` on read, never listed, `recordView` does not count it.
    Those three callers get the `moderation` object on `Video`/`StudioVideo`; everyone else never sees it.
    Media URLs are built as `MEDIA_BASE_URL + object key`, e.g.
    `https://media.winkey.vn/v/{video_id}/a{attempt}/hls/master.m3u8`.
    Task SEC1 (ADR-017) — media access: plain media URLs work only for videos that the public could
    watch (`READY`, `PUBLIC` or `UNLISTED`, `VISIBLE`, owner active); nginx checks `mediaAccess`. For any
    other video, callers allowed to see it (owner, moderator, admin) receive **signed** URLs:
    `MEDIA_BASE_URL + "s/" + expires + "/" + sig + "/" + object key`, where `expires` is Unix seconds
    (now + 6 h) and `sig` is the unpadded base64url of `md5(expires + "/v/" + video_id + "/ " + MEDIA_LINK_SECRET)`
    (nginx `secure_link` format). `Playback.expires_at` is then set; the player refetches the video
    before it passes.
    Task V5b (ADR-018) — subtitles: WebVTT tracks, one per language, uploaded by the owner. Objects live
    under `v/{video_id}/subtitles/`, so SEC1 signing and the delete path apply to them unchanged.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://winkey.vn
    description: Production.
  - url: http://localhost:8080
    description: Local dev stack (Traefik from deploy/compose).
tags:
  - name: videos
    description: Public video metadata and playback info.
  - name: studio
    description: Creator views of their own videos.
  - name: moderation
    description: Hide or restore a video (task A2).
  - name: subtitles
    description: WebVTT subtitle tracks (task V5b, ADR-018).
  - name: internal
    description: Called only by infrastructure (nginx on edge-1). Never routed publicly (task SEC1).
  - name: search
    description: |
      Video search (task SR1): PostgreSQL FTS on title and description with Vietnamese diacritics folded
      (`Hà Nội` = `ha noi`), plus trigram similarity on the title for typos. Only videos that the public
      feed would show are returned (PUBLIC, READY, not hidden, owner active), whoever calls.
      Gateway: `/v1/search` and `/v1/search/suggest` go to video-svc.
  - name: analytics
    description: |
      Player QoE and watch-time samples (task R1, ADR-022), forwarded to ClickHouse on gpu-01 through the
      JetStream stream `ANALYTICS`. Gateway: `/v1/playback` goes to video-svc.
paths:
  /v1/videos:
    get:
      tags: [videos]
      operationId: listVideos
      summary: Public feed, newest first (or trending with `sort=trending`). Optional auth.
      description: |
        Task R2-a (ADR-020) — `sort=trending` returns the current trending ranking (recomputed every 10 minutes
        from views of the last 72 h), best first, only videos the public feed would show. At most 200 videos in
        total; the cursor pages through that ranking. The ranking may be empty (no recent views): the client
        then shows the newest feed. `owner_id` together with `sort=trending` → `400` `INVALID_SORT`.
        Trending responses carry `Cache-Control: public, max-age=60`.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: './common.yaml#/components/parameters/Cursor'
        - $ref: './common.yaml#/components/parameters/Limit'
        - name: owner_id
          in: query
          required: false
          description: Restrict to one creator (channel page).
          schema:
            $ref: './common.yaml#/components/schemas/Uuid'
        - name: sort
          in: query
          required: false
          description: '`newest` (default) or `trending` (task R2-a).'
          schema:
            type: string
            enum: [newest, trending]
            default: newest
      responses:
        '200':
          description: One page of videos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoPage'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'

  /v1/videos/batch:
    get:
      tags: [videos]
      operationId: batchGetVideos
      summary: Summaries of up to 50 videos by id, in request order (task PL1). Optional auth.
      description: |
        For playlist pages and other lists stored outside video-svc (ADR-024). Returns only the videos the caller
        could open with `getVideo` right now (READY, not hidden, `PRIVATE` only for the owner); unknown or unreadable
        ids are silently left out, so `items` can be shorter than `ids`. Duplicates in `ids` → `400`. Reuses the
        video cache. `Cache-Control: private, no-store` when authenticated, otherwise `public, max-age=30`.
        Static route: it must be matched before `/v1/videos/{video_id}`.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: ids
          in: query
          required: true
          description: Comma-separated video ids, 1 to 50, no duplicates.
          style: form
          explode: false
          schema:
            type: array
            minItems: 1
            maxItems: 50
            uniqueItems: true
            items:
              $ref: './common.yaml#/components/schemas/Uuid'
      responses:
        '200':
          description: The readable videos, in the order of `ids`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoBatch'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'

  /v1/videos/{video_id}:
    parameters:
      - $ref: './common.yaml#/components/parameters/VideoId'
    get:
      tags: [videos]
      operationId: getVideo
      summary: Watch page data. Optional auth.
      security:
        - {}
        - bearerAuth: []
      responses:
        '200':
          description: Video with playback info.
          headers:
            Cache-Control:
              description: '`public, max-age=30` for public READY videos, otherwise `private, no-store`.'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Video'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'
    patch:
      tags: [videos]
      operationId: updateVideo
      summary: Edit metadata (owner only).
      description: |
        Task C4: when `visibility` actually changes, `video.visibility_changed` is written to the outbox in the
        same transaction (not emitted for a no-op or for other fields).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateVideoRequest'
      responses:
        '200':
          description: Updated video.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Video'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'
    delete:
      tags: [videos]
      operationId: deleteVideo
      summary: Delete (owner, moderator or admin). Emits `video.deleted`; objects are removed asynchronously.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'

  /v1/videos/{video_id}/related:
    parameters:
      - $ref: './common.yaml#/components/parameters/VideoId'
    get:
      tags: [videos]
      operationId: listRelatedVideos
      summary: Videos to watch next, shown beside the player (task R2-c). No auth needed.
      description: |
        Recommendation v1 without personalisation (ADR-025). Candidates are only videos the public can watch
        (`PUBLIC`, `READY`, not hidden), never the video itself, each at most once. Built from three sources:
        1. up to 8 videos whose title/description match the source title (the search index of SR1);
        2. up to 4 newest videos of the same channel;
        3. the current trending ranking (R2-a) to fill up to `limit`.
        Order of `items`: the sources interleaved in the order 1, 1, 2, 1, 3, ... with duplicates skipped (see
        ADR-025). Same answer for every caller, so `Cache-Control: public, max-age=300`. The source video
        itself must be readable by the caller like `getVideo`, otherwise `404`.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          description: 1 to 24, default 12.
          schema:
            type: integer
            minimum: 1
            maximum: 24
            default: 12
      responses:
        '200':
          description: The related videos, best first. May be shorter than `limit` (even empty).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelatedVideos'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'

  /v1/videos/{video_id}/views:
    parameters:
      - $ref: './common.yaml#/components/parameters/VideoId'
    post:
      tags: [videos]
      operationId: recordView
      summary: Report one qualified playback (task C3). Optional auth.
      description: |
        The player calls this once per playback, after the viewer has watched at least
        `min(30 s, duration_ms / 2)` (sum of played time, seeking excluded). The server re-checks the
        threshold against `duration_ms` and ignores reports below it.

        Counting rules (anti-inflation):
        - The video must be readable by the caller (same rules as `GET /v1/videos/{video_id}`) and `READY`.
        - One counted view per **viewer** per video per **30 minutes**. The viewer is the user id when
          authenticated, otherwise `sha256(client_ip + user_agent)`. `client_ip` is taken from
          `X-Forwarded-For` only when the peer is in `TRUST_PROXY_CIDRS`. Dedup key in Valkey:
          `views:seen:{video_id}:{viewer}` (`SET NX EX 1800`).
        - The same `playback_id` is counted at most once (retries are safe).
        - Rate limit per client IP: 60 reports per minute (`429`).
        - Counted views are buffered in Valkey and added to `media.videos.view_count` in batches at
          least every 30 s, so `view_count` in other responses is eventually consistent (≤ 30 s plus
          the cache TTL). A buffered view is never lost on a flush failure: it is retried.

        The response does not reveal why a report was not counted beyond `counted: false`.
      security:
        - {}
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordViewRequest'
      responses:
        '202':
          description: Report accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordViewResult'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'
        '429':
          $ref: './common.yaml#/components/responses/TooManyRequests'

  /v1/playback/heartbeats:
    post:
      tags: [analytics]
      operationId: recordPlaybackHeartbeats
      summary: Report player QoE and watch-time samples (task R1, ADR-022). Optional auth.
      description: |
        The player sends a batch of samples of the playbacks it is running: one `start` when the first frame is
        shown, one `heartbeat` about every 30 s while the page is open, and one `end` when the playback stops
        (`navigator.sendBeacon` on page hide). Each sample carries the **deltas since the previous sample of the
        same playback** (`watched_ms`, `rebuffer_ms`, `rebuffer_count`), so losing a sample loses only its own
        interval and nothing is counted twice.

        video-svc validates the batch, drops samples of videos it does not know or the caller may not read, and
        publishes one `analytics.playback` event per accepted sample to JetStream (stream `ANALYTICS`). This is
        telemetry, not a domain event: it is published directly (no outbox) and a publish failure is not an error
        for the client (the samples are dropped and a metric is incremented). The data ends up in ClickHouse on
        gpu-01; nothing is stored in PostgreSQL and nothing in this response depends on it.

        Privacy: the server never forwards the IP address or the user agent. The viewer is identified by
        `viewer_key` = HMAC-SHA256(`ANALYTICS_VIEWER_SALT`, user id or C3's anonymous viewer hash), so
        ClickHouse never holds a user id in clear.

        Limits: at most 20 samples per request, body ≤ 16 KiB, rate limit 30 requests per minute per client IP
        (`429`). `view` counting stays with `recordView` (C3); this endpoint never changes `view_count`.
      security:
        - {}
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaybackHeartbeatBatch'
      responses:
        '202':
          description: Batch accepted (possibly partially; rejected samples are not reported back).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaybackHeartbeatResult'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '413':
          description: Body larger than 16 KiB.
          content:
            application/problem+json:
              schema:
                $ref: './common.yaml#/components/schemas/Problem'
        '429':
          $ref: './common.yaml#/components/responses/TooManyRequests'

  /v1/studio/videos:
    get:
      tags: [studio]
      operationId: listStudioVideos
      summary: The caller's own videos in every status, newest first.
      security:
        - bearerAuth: []
      parameters:
        - $ref: './common.yaml#/components/parameters/Cursor'
        - $ref: './common.yaml#/components/parameters/Limit'
        - name: status
          in: query
          required: false
          schema:
            $ref: './common.yaml#/components/schemas/VideoStatus'
      responses:
        '200':
          description: One page of the caller's videos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudioVideoPage'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'

  /v1/studio/videos/{video_id}/stats:
    parameters:
      - $ref: './common.yaml#/components/parameters/VideoId'
    get:
      tags: [studio]
      operationId: getVideoStats
      summary: Daily player statistics of one of the caller's videos (task R1-b). Owner or admin only.
      description: |
        Read from `analytics.video_daily` in PostgreSQL, which analytics-worker refreshes from ClickHouse every few
        minutes (ADR-022 addendum R1-b). While gpu-01 is off the numbers stop advancing; `refreshed_at` says how old
        they are. Days are calendar days in `Asia/Ho_Chi_Minh`. `days` holds EVERY day of the range in ascending
        order, with zeros (and null ratios/percentiles) for days without plays. `starts` counts player sessions,
        which is not the anti-fraud `view_count`; `view_count` is the lifetime counter of the video.
        Any other caller (also for a missing or deleted video) gets `404`, never `403`.
        `Cache-Control: private, no-store`. Rate limit 60 requests/min per user, shared with `getChannelStats`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/StatsFrom'
        - $ref: '#/components/parameters/StatsTo'
      responses:
        '200':
          description: The statistics of the range.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoStats'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'
        '429':
          $ref: './common.yaml#/components/responses/TooManyRequests'

  /v1/studio/stats:
    get:
      tags: [studio]
      operationId: getChannelStats
      summary: Daily player statistics summed over all of the caller's videos, plus the top 10 videos (task R1-b).
      description: |
        Same source, timezone, day filling and freshness rules as `getVideoStats`. Only videos that still exist and
        belong to the caller count. `viewers` is NOT summed (unique viewers are not additive), so channel days have
        no `viewers` field. `top_videos` ranks the caller's videos by `watch_time_ms` over the range (ties by
        `starts` then `video_id`), at most 10, omitting videos with no plays. `Cache-Control: private, no-store`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/StatsFrom'
        - $ref: '#/components/parameters/StatsTo'
      responses:
        '200':
          description: The channel statistics of the range.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelStats'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '429':
          $ref: './common.yaml#/components/responses/TooManyRequests'

  /v1/videos/{video_id}/moderation:
    parameters:
      - $ref: './common.yaml#/components/parameters/VideoId'
    put:
      tags: [moderation]
      operationId: moderateVideo
      summary: Hide or restore a video (moderator or admin). Emits `video.moderated`.
      description: |
        Authorization from `X-User-Roles` only. `HIDDEN` needs a `reason`; `VISIBLE` clears it. Setting
        the current state again is a no-op (`200`, no event). The row update and the `video.moderated`
        outbox row are written in one transaction (ADR-008). Media objects are not deleted.
        Gateway: this path goes to video-svc like the rest of `/v1/videos/*`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModerateVideoRequest'
      responses:
        '200':
          description: Video after the change, with `moderation`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Video'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'

  /v1/videos/{video_id}/subtitles/{lang}:
    parameters:
      - $ref: './common.yaml#/components/parameters/VideoId'
      - name: lang
        in: path
        required: true
        description: BCP 47 language tag, lowercase language + optional uppercase region (`vi`, `en`, `en-US`).
        schema:
          type: string
          pattern: '^[a-z]{2,3}(-[A-Z]{2})?$'
    put:
      tags: [subtitles]
      operationId: putSubtitle
      summary: Create or replace the subtitle track of one language (owner only).
      description: |
        Only the owner (moderators and admins included: `403` unless they own the video). Any status except
        `FAILED` (`409`); a track can be prepared while the video is processing.

        `content` is validated server-side, otherwise `400` with `code`:
        - `SUBTITLE_TOO_LARGE`: more than 524288 bytes of UTF-8;
        - `INVALID_WEBVTT`: not valid UTF-8, contains NUL, the first line (after an optional BOM) is not
          `WEBVTT` optionally followed by a space or tab and text, no cue, a cue timing that is not
          `[HH:]MM:SS.mmm --> [HH:]MM:SS.mmm` or whose end is not after its start. `detail` names the line.
        The stored file is normalised (BOM removed, CRLF/CR → LF) and served as `text/vtt; charset=utf-8`
        with the same immutable Cache-Control as other media. Every upload gets a NEW object key
        (`v/{video_id}/subtitles/{lang}-{uuidv7}.vtt`); the previous object is removed after the commit,
        best effort. At most 20 tracks per video: a new language beyond that → `409` `TOO_MANY_SUBTITLES`.
        No event is emitted.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutSubtitleRequest'
      responses:
        '200':
          description: Track replaced.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubtitleTrack'
        '201':
          description: Track created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubtitleTrack'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'
        '409':
          $ref: './common.yaml#/components/responses/Conflict'
    delete:
      tags: [subtitles]
      operationId: deleteSubtitle
      summary: Remove the subtitle track of one language (owner only). The object is removed best effort.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Removed.
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          description: Unknown video, video the caller may not see, or no track for this language.
          content:
            application/problem+json:
              schema:
                $ref: './common.yaml#/components/schemas/Problem'

  /internal/media-access/{video_id}:
    get:
      tags: [internal]
      operationId: mediaAccess
      summary: May the public fetch this video's media? Used by nginx `auth_request` (task SEC1).
      description: |
        `204` when the video is `READY`, `PUBLIC` or `UNLISTED`, `moderation_state = VISIBLE` and its owner is
        in `auth.public_profiles`; `403` otherwise, including unknown ids (never `404`, so the answer does not
        reveal whether a video exists). One primary-key lookup; no body; no auth headers are read.
        Both answers carry `Cache-Control: max-age=30`; nginx caches them per `video_id`.
        Traefik routes it only for the internal Host `media-auth.internal`; it is not reachable from the internet.
      security: []
      parameters:
        - name: video_id
          in: path
          required: true
          schema:
            $ref: './common.yaml#/components/schemas/Uuid'
      responses:
        '204':
          description: Public media; nginx serves the request.
          headers:
            Cache-Control:
              schema:
                type: string
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '403':
          description: Not public (or unknown); nginx answers `403`.
          headers:
            Cache-Control:
              schema:
                type: string

  /v1/feed/subscriptions:
    get:
      tags: [videos]
      operationId: getSubscriptionFeed
      summary: Newest videos of the channels the caller follows (task R2-b, ADR-021).
      description: |
        Public-feed videos only (PUBLIC, READY, VISIBLE, owner active), newest first by `published_at`, of the
        channels in the caller's subscriptions. video-svc answers from its own projection of
        `social.subscription.changed`, so a new subscription shows up within seconds (eventual consistency).
        No subscriptions → empty page. `Cache-Control: private, no-store`.
        Gateway: `/v1/feed` goes to video-svc.
      security:
        - bearerAuth: []
      parameters:
        - $ref: './common.yaml#/components/parameters/Cursor'
        - $ref: './common.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: One page of videos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoPage'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'

  /v1/feed/recommended:
    get:
      tags: [videos]
      operationId: getRecommendedFeed
      summary: Home feed "Dành cho bạn", personalised for signed-in callers (task R2, ADR-028). Optional auth.
      description: |
        Public-feed videos only (PUBLIC, READY, VISIBLE, owner active), never the caller's own videos and never a
        video the caller has already watched (per the recommendation history). The ranking blends co-view neighbours
        of the caller's recent watches, fresh videos of the channels they follow and trending; the exact formula is
        ADR-028 and is NOT part of this contract. Channel diversity is best effort: the list avoids more than 2
        videos of one channel in any 10 consecutive items whenever another eligible video can take the slot, but it
        never drops an eligible video to enforce that (a catalogue dominated by one channel still returns all of
        it). The rule is applied once over the whole ranked list, so it holds across page boundaries.
        When personal signals are missing (anonymous caller, new account, gpu-01 has not computed anything yet) the
        feed degrades to trending, then newest, so it is empty only when no public video exists.
        Pagination: the first page fixes a ranked list of at most 200 videos for about 10 minutes; `cursor` walks
        that list. A cursor whose list has expired is still accepted and continues at the same position of a
        freshly computed list (a rare duplicate or gap is possible). After the 200th video `next_cursor` is null.
        Signed in: `Cache-Control: private, no-store`. Anonymous: `Cache-Control: public, max-age=60`.
        Gateway: `/v1/feed` goes to video-svc.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: './common.yaml#/components/parameters/Cursor'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: One page of recommended videos.
          headers:
            Cache-Control:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoPage'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'

  /v1/search:
    get:
      tags: [search]
      operationId: searchVideos
      summary: Search public videos by relevance. Optional auth (the result does not depend on it).
      description: |
        Matching: the query is folded (lower-case, diacritics removed) and matched against
        `media.videos.search_vector` (`plainto_tsquery('simple', …)`; title weight A, description B).
        When that finds nothing, fall back to trigram similarity on the folded title (`%`, threshold
        0.3). Ranking: `ts_rank_cd` (or `similarity` for the fallback), then `published_at` DESC, then
        `id` DESC. The `cursor` encodes the position in that order; at most 10 pages are served, after
        which `next_cursor` is null. Rate limit per client IP: 60 requests per minute (`429`).
        Responses may be cached publicly for 30 s (`Cache-Control: public, max-age=30`).
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 100
          description: Free text. Leading/trailing spaces are trimmed; empty after trimming → `400`.
        - $ref: './common.yaml#/components/parameters/Cursor'
        - $ref: './common.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: One page of results (possibly empty).
          headers:
            Cache-Control:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoPage'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '429':
          $ref: './common.yaml#/components/responses/TooManyRequests'

  /v1/search/suggest:
    get:
      tags: [search]
      operationId: suggestSearch
      summary: Up to 8 title suggestions for a search box. Optional auth.
      description: |
        Titles of public videos whose folded title starts with the folded query or is similar to it
        (trigram), best match first, duplicates removed. Rate limit per client IP: 120 requests per
        minute. `Cache-Control: public, max-age=60`.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 50
      responses:
        '200':
          description: Suggestions.
          headers:
            Cache-Control:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchSuggestions'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '429':
          $ref: './common.yaml#/components/responses/TooManyRequests'

components:
  securitySchemes:
    bearerAuth:
      $ref: './common.yaml#/components/securitySchemes/bearerAuth'
  parameters:
    StatsFrom:
      name: from
      in: query
      required: false
      description: |
        First day (inclusive, `Asia/Ho_Chi_Minh`). Default `to` minus 27 days. Must not be after `to`, at most 89
        days before `to` (a range holds 1 to 90 days) and not more than 730 days before today, else `400`.
      schema:
        type: string
        format: date
    StatsTo:
      name: to
      in: query
      required: false
      description: Last day (inclusive, `Asia/Ho_Chi_Minh`). Default today; a later day is clamped to today.
      schema:
        type: string
        format: date
  schemas:
    Rendition:
      type: object
      required: [name, width, height, bitrate_kbps]
      properties:
        name:
          type: string
          pattern: '^[0-9]{3,4}p$'
          examples: ['1080p']
        width:
          type: integer
        height:
          type: integer
        bitrate_kbps:
          type: integer

    Playback:
      type: object
      required: [hls_url, thumbnail_url, renditions]
      properties:
        hls_url:
          type: string
          format: uri
          description: Signed (`/s/{expires}/{sig}/…`) when the video is not publicly watchable (task SEC1).
        thumbnail_url:
          type: string
          format: uri
        storyboard_url:
          type: [string, 'null']
          format: uri
          description: |
            WebVTT seek-preview track (task V5a): cues point at sprite sheets with `#xywh=x,y,w,h`, relative to
            this URL. Null when the video has no storyboard. Signed like `hls_url` when the video is not
            publicly watchable (task SEC1).
        expires_at:
          type: string
          format: date-time
          description: Present only for signed URLs; when they stop working (task SEC1).
        subtitles:
          type: array
          maxItems: 20
          description: |
            Subtitle tracks (task V5b), sorted by `lang`. video-svc always sends it (empty when there is none);
            optional only so that older servers stay valid.
          items:
            $ref: '#/components/schemas/SubtitleTrack'
        renditions:
          type: array
          items:
            $ref: '#/components/schemas/Rendition'

    Video:
      type: object
      required:
        - id
        - title
        - description
        - owner
        - visibility
        - status
        - duration_ms
        - width
        - height
        - view_count
        - like_count
        - published_at
        - created_at
        - playback
      properties:
        id:
          $ref: './common.yaml#/components/schemas/Uuid'
        title:
          type: string
        description:
          type: string
        owner:
          $ref: './common.yaml#/components/schemas/PublicProfile'
        visibility:
          $ref: './common.yaml#/components/schemas/Visibility'
        status:
          $ref: './common.yaml#/components/schemas/VideoStatus'
        duration_ms:
          type: [integer, 'null']
        width:
          type: [integer, 'null']
        height:
          type: [integer, 'null']
        view_count:
          type: integer
          format: int64
        like_count:
          type: integer
          format: int64
        published_at:
          type: [string, 'null']
          format: date-time
        created_at:
          type: string
          format: date-time
        tags:
          type: array
          maxItems: 10
          description: |
            Owner-chosen tags (task TAG1, ADR-036), in the owner's order. Searched like the title and used for related
            videos. video-svc always sends it (empty array when none); optional in the schema so older clients stay valid.
          items:
            type: string
            minLength: 1
            maxLength: 30
        playback:
          description: Null until the video is `READY`.
          oneOf:
            - $ref: '#/components/schemas/Playback'
            - type: 'null'
        moderation:
          $ref: '#/components/schemas/VideoModeration'

    VideoSummary:
      type: object
      required: [id, title, owner, duration_ms, view_count, published_at, thumbnail_url]
      properties:
        id:
          $ref: './common.yaml#/components/schemas/Uuid'
        title:
          type: string
        owner:
          $ref: './common.yaml#/components/schemas/PublicProfile'
        duration_ms:
          type: integer
        view_count:
          type: integer
          format: int64
        published_at:
          type: string
          format: date-time
        thumbnail_url:
          type: string
          format: uri

    StatsTotals:
      type: object
      additionalProperties: false
      required: [starts, watch_time_ms, avg_watch_ms, rebuffer_ratio, errors]
      properties:
        starts:
          type: integer
          minimum: 0
          description: Player sessions started in the range.
        watch_time_ms:
          type: integer
          minimum: 0
        avg_watch_ms:
          type: [integer, 'null']
          minimum: 0
          description: watch_time_ms / starts, rounded down; null when starts is 0.
        rebuffer_ratio:
          type: [number, 'null']
          minimum: 0
          maximum: 1
          description: rebuffer_ms / (watched_ms + rebuffer_ms); null when both are 0.
        errors:
          type: integer
          minimum: 0
          description: Sessions that ended with a player error.
    VideoStatsDay:
      type: object
      additionalProperties: false
      required: [day, starts, watch_time_ms, viewers, rebuffer_ratio, startup_p50_ms, startup_p95_ms]
      properties:
        day:
          type: string
          format: date
        starts:
          type: integer
          minimum: 0
        watch_time_ms:
          type: integer
          minimum: 0
        viewers:
          type: integer
          minimum: 0
          description: Approximate unique viewers of that day.
        rebuffer_ratio:
          type: [number, 'null']
          minimum: 0
          maximum: 1
        startup_p50_ms:
          type: [integer, 'null']
          minimum: 0
        startup_p95_ms:
          type: [integer, 'null']
          minimum: 0
    VideoStats:
      type: object
      additionalProperties: false
      required: [video_id, from, to, timezone, view_count, totals, days, refreshed_at]
      properties:
        video_id:
          $ref: './common.yaml#/components/schemas/Uuid'
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        timezone:
          type: string
          const: Asia/Ho_Chi_Minh
        view_count:
          type: integer
          minimum: 0
          description: Lifetime counted views of the video (same as `Video.view_count`).
        totals:
          $ref: '#/components/schemas/StatsTotals'
        days:
          type: array
          minItems: 1
          maxItems: 90
          items:
            $ref: '#/components/schemas/VideoStatsDay'
        refreshed_at:
          type: [string, 'null']
          format: date-time
          description: Latest refresh of any returned day; null when the range has no data at all.
    ChannelStatsDay:
      type: object
      additionalProperties: false
      required: [day, starts, watch_time_ms, rebuffer_ratio]
      properties:
        day:
          type: string
          format: date
        starts:
          type: integer
          minimum: 0
        watch_time_ms:
          type: integer
          minimum: 0
        rebuffer_ratio:
          type: [number, 'null']
          minimum: 0
          maximum: 1
    ChannelStatsTopVideo:
      type: object
      additionalProperties: false
      required: [video_id, title, starts, watch_time_ms]
      properties:
        video_id:
          $ref: './common.yaml#/components/schemas/Uuid'
        title:
          type: string
        starts:
          type: integer
          minimum: 0
        watch_time_ms:
          type: integer
          minimum: 0
    ChannelStats:
      type: object
      additionalProperties: false
      required: [from, to, timezone, totals, days, top_videos, refreshed_at]
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        timezone:
          type: string
          const: Asia/Ho_Chi_Minh
        totals:
          $ref: '#/components/schemas/StatsTotals'
        days:
          type: array
          minItems: 1
          maxItems: 90
          items:
            $ref: '#/components/schemas/ChannelStatsDay'
        top_videos:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/ChannelStatsTopVideo'
        refreshed_at:
          type: [string, 'null']
          format: date-time
    RelatedVideos:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 24
          items:
            $ref: '#/components/schemas/VideoSummary'
    VideoBatch:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/VideoSummary'

    VideoPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/VideoSummary'
        next_cursor:
          type: [string, 'null']

    StudioVideo:
      type: object
      required: [id, title, visibility, status, progress, error, duration_ms, created_at, thumbnail_url]
      properties:
        id:
          $ref: './common.yaml#/components/schemas/Uuid'
        title:
          type: string
        visibility:
          $ref: './common.yaml#/components/schemas/Visibility'
        status:
          $ref: './common.yaml#/components/schemas/VideoStatus'
        progress:
          type: number
          minimum: 0
          maximum: 100
        error:
          type: [string, 'null']
        duration_ms:
          type: [integer, 'null']
        created_at:
          type: string
          format: date-time
        thumbnail_url:
          type: [string, 'null']
          format: uri
        moderation:
          $ref: '#/components/schemas/VideoModeration'

    StudioVideoPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/StudioVideo'
        next_cursor:
          type: [string, 'null']

    UpdateVideoRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 5000
        visibility:
          $ref: './common.yaml#/components/schemas/Visibility'
        tags:
          type: array
          maxItems: 10
          description: |
            Replaces the whole tag list (task TAG1). Each tag is trimmed and inner whitespace collapsed; empty tags are
            dropped; duplicates that differ only in case or Vietnamese accents are dropped (the first one is kept).
            `[]` clears the tags. More than 10 tags, or a tag longer than 30 characters after trimming → `400`.
          items:
            type: string
            maxLength: 60

    RecordViewRequest:
      type: object
      additionalProperties: false
      required: [playback_id, watched_ms]
      properties:
        playback_id:
          $ref: './common.yaml#/components/schemas/Uuid'
          description: Generated by the player once per playback (UUIDv4 or v7); makes retries idempotent.
        watched_ms:
          type: integer
          minimum: 0
          maximum: 86400000
          description: Played time so far in milliseconds, seeking excluded.

    RecordViewResult:
      type: object
      additionalProperties: false
      required: [counted]
      properties:
        counted:
          type: boolean
          description: '`true` when this report added one view.'

    PlaybackHeartbeatBatch:
      type: object
      additionalProperties: false
      required: [samples]
      properties:
        samples:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: '#/components/schemas/PlaybackSample'

    PlaybackSample:
      type: object
      additionalProperties: false
      description: One sample of one playback (task R1). Counters are deltas since the previous sample of the same playback.
      required: [playback_id, video_id, kind, seq, sent_at, position_ms, watched_ms, rebuffer_ms, rebuffer_count]
      properties:
        playback_id:
          $ref: './common.yaml#/components/schemas/Uuid'
          description: Same id as `RecordViewRequest.playback_id`.
        video_id:
          $ref: './common.yaml#/components/schemas/Uuid'
        kind:
          type: string
          enum: [start, heartbeat, end]
        seq:
          type: integer
          minimum: 0
          maximum: 100000
          description: 0 for `start`, +1 for every later sample of the playback; (playback_id, seq) is unique.
        sent_at:
          type: string
          format: date-time
          description: Client clock; the server stores its own receive time too and trusts that one for bucketing.
        position_ms:
          type: integer
          minimum: 0
          maximum: 86400000
        watched_ms:
          type: integer
          minimum: 0
          maximum: 600000
          description: Played time since the previous sample, seeking and stalls excluded.
        rebuffer_ms:
          type: integer
          minimum: 0
          maximum: 600000
          description: Stall time since the previous sample (buffer empty while playing; the initial load is not a stall).
        rebuffer_count:
          type: integer
          minimum: 0
          maximum: 1000
        startup_ms:
          type: integer
          minimum: 0
          maximum: 600000
          description: Only on `start`, time from play request to first frame.
        rendition:
          type: [string, 'null']
          maxLength: 16
          description: Current rendition label, e.g. `720p`; null when unknown.
        bitrate_kbps:
          type: [integer, 'null']
          minimum: 0
          maximum: 200000
        error_code:
          type: [string, 'null']
          maxLength: 64
          description: Only on `end` when the playback stopped because of an error (e.g. hls.js `fatal` details).
        client:
          type: string
          enum: [web, ios, android, other]
          default: web
        surface:
          type: string
          enum: [for_you, latest, trending, up_next, search, subscriptions, channel, playlist, other]
          description: |
            Where the viewer started this playback (task R2-ab, ADR-030): the home tabs (`for_you`, `latest`,
            `trending`), the watch page column (`up_next`), search, the subscription feed, a channel page, a playlist,
            or `other` (direct link, notification, unknown). Same value on every sample of one playback; omitted
            by older clients (stored as unknown).

    PlaybackHeartbeatResult:
      type: object
      additionalProperties: false
      required: [accepted]
      properties:
        accepted:
          type: integer
          minimum: 0
          description: Number of samples accepted from the batch.

    VideoModeration:
      type: object
      description: Present only for the owner, moderators and admins (task A2).
      required: [state, reason, moderated_at]
      properties:
        state:
          type: string
          enum: [VISIBLE, HIDDEN]
        reason:
          type: [string, 'null']
          description: Shown to the owner so they know why the video is hidden.
        moderated_at:
          type: [string, 'null']
          format: date-time

    SubtitleTrack:
      type: object
      additionalProperties: false
      required: [lang, label, source, url, updated_at]
      properties:
        lang:
          type: string
          pattern: '^[a-z]{2,3}(-[A-Z]{2})?$'
        label:
          type: string
          minLength: 1
          maxLength: 50
          description: Shown in the player menu, e.g. `Tiếng Việt`.
        source:
          type: string
          enum: [UPLOAD, AUTO]
          description: '`AUTO` is reserved for auto-captions (V5c); only `UPLOAD` exists today.'
        url:
          type: string
          format: uri
          description: The `.vtt` file. Signed like `Playback.hls_url` when the video is not publicly watchable (SEC1).
        updated_at:
          type: string
          format: date-time

    PutSubtitleRequest:
      type: object
      additionalProperties: false
      required: [label, content]
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 50
        content:
          type: string
          minLength: 6
          maxLength: 524288
          description: The whole WebVTT file. The byte limit (524288 bytes of UTF-8) is checked server-side.

    ModerateVideoRequest:
      type: object
      additionalProperties: false
      required: [state]
      properties:
        state:
          type: string
          enum: [VISIBLE, HIDDEN]
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: Required when `state` is `HIDDEN` (missing → `400`); ignored for `VISIBLE`.

    SearchSuggestions:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 8
          items:
            type: string
