openapi: 3.1.0
info:
  title: Winkey social-svc API
  version: 1.0.0
  description: |
    Comments (two levels), video likes and channel subscriptions. Owner: Antigravity 3 (task C1).

    - Identity comes only from the gateway headers `X-User-Id` / `X-User-Roles` (ADR-009).
      Endpoints marked "optional auth" also work anonymously; `liked` / `subscribed` are then `false`.
    - A video can receive comments and likes only once social-svc has seen its `video.ready`
      event (projection `social.videos`); otherwise the video endpoints answer `404`.
    - Authors are resolved from `auth.public_profiles`. A comment whose author no longer has an
      active profile is returned with `author: null`.
    - `DELETED` comments with replies stay in the thread as a tombstone (`status: DELETED`,
      `body: ""`) so the replies keep their context; without replies they are omitted.
      `HIDDEN` comments are omitted for everyone except moderators and admins.
    - Gateway routing: `/v1/videos/{video_id}/comments` and `/v1/videos/{video_id}/like` go to
      social-svc and must win over the `/v1/videos` prefix that goes to video-svc, e.g. Traefik
      `PathRegexp(`^/v1/videos/[^/]+/(comments|like)$`)` with a higher priority.
    - Task A2: a video hidden by a moderator (`video.moderated` with `state: HIDDEN`, projected into
      `social.videos.hidden`) answers `404` on its comment and like endpoints for everyone except
      moderators and admins, until `state: VISIBLE` arrives. Existing comments and likes are kept.
    - Task C4: a `PRIVATE` video (visibility projected into `social.videos.visibility` from `video.ready` and
      `video.visibility_changed`) answers `404` on its comment and like endpoints for everyone except the
      video owner, moderators and admins. `UNLISTED` behaves like `PUBLIC`. Rows projected before C4 are
      `PUBLIC` until an event says otherwise.
    - Task A2: `/v1/reports` and `/v1/moderation/*` also go to social-svc (gateway: `PathPrefix`).
    - Task N1 (ADR-023): in-app notifications live in social-svc; `/v1/notifications` goes to social-svc
      (gateway: `PathPrefix`).
    - Task PL1 (ADR-024): playlists and watch-later live in social-svc; `/v1/playlists` and `/v1/me/watch-later`
      go to social-svc (gateway: `PathPrefix`).
    - Task CIN2 (ADR-035): the cinema catalogue and series episodes live in social-svc; `/v1/cinema` and `/v1/series`
      go to social-svc (gateway: `PathPrefix`).
    - Task SOC-2a (ADR-049): posts, post comments, reactions, hashtags and feeds live in social-svc; `/v1/posts`,
      `/v1/post-comments`, `/v1/feed` and `/v1/hashtags` go to social-svc (gateway: `PathPrefix`), as does
      `/v1/channels/{id}/posts`.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://winkey.vn
    description: Production.
  - url: http://localhost:8080
    description: Local dev stack (Traefik from deploy/compose).
tags:
  - name: comments
    description: Two-level comment threads on videos.
  - name: likes
    description: Video likes.
  - name: subscriptions
    description: |
      Channel subscriptions ("theo dõi"). Every user is a channel.

      Private accounts (task SOC-1b, ADR-049): `auth.public_profiles.is_private`. Subscribing to a private account
      you do not follow yet creates a **follow request** instead (`requested = true`); the owner approves or
      rejects it with `decideFollowRequest`. A private account's followers and following lists are visible only
      to the owner and its approved followers. Its videos keep their own visibility rules; its posts (SOC-2)
      follow the account. Becoming private keeps existing followers; becoming public does not approve pending
      requests.
  - name: relationships
    description: |
      Blocks, mutes and the caller's relationship to another user (task SOC-1b, ADR-049). Gateway: `/v1/me/blocks`,
      `/v1/me/mutes` and `/v1/me/follow-requests` go to social-svc.

      **Block** (either direction is enforced, the blocked user is never told):
      - creating a block removes subscriptions and follow requests in both directions (each removed subscription
        emits `social.subscription.changed`);
      - the blocked user cannot subscribe to or request to follow the blocker (`404`, as if the account did not
        exist), and cannot comment on or reply under the blocker's videos or comments (`403` code
        `INTERACTION_BLOCKED`);
      - comment lists, replies, followers / following lists and notifications hide users in a block relation with
        the signed-in caller (both directions);
      - no notification is created between the two users.

      **Mute**: the muted user's actions create no notification for the muter; SOC-2 feeds hide their posts. The
      muted user is not told and nothing else changes.

      Limits: 1000 blocks and 1000 mutes per user (`409` code `LIMIT_REACHED`). Rate limit: 60 block / mute
      changes per hour (`429`). Other services that must honour blocks (SOC-3 chat, realtime) read
      `social.blocks` through a grant; it is not an event.
  - name: moderation
    description: |
      User reports and the moderation queue (task A2). Reading and resolving reports needs `moderator` or
      `admin` in `X-User-Roles`. Resolving a report records the decision only; the action itself uses
      the owning endpoint: `moderateComment` here, `moderateVideo` in video-svc, `adminSuspendUser` in
      auth-svc.
  - name: notifications
    description: |
      In-app notifications of the caller (task N1, ADR-023): a channel you follow published a video, someone
      commented on your video, replied to your comment, or subscribed to your channel. Created by social-svc
      itself (same transaction as the comment / subscription) or from `video.ready` / `video.visibility_changed`
      on its existing `social-videos` consumer. Kept 90 days. A notification whose video or comment is gone,
      hidden or PRIVATE, or whose actor has no active profile, is not returned. No push/e-mail in N1: clients
      poll `getUnreadNotificationCount`.
  - name: playlists
    description: |
      Playlists and the watch-later list (task PL1, ADR-024), owned by social-svc. A playlist stores video ids
      only; clients fetch titles and thumbnails with video-svc `batchGetVideos`. Items reference the
      `social.videos` projection: a deleted video disappears from every playlist, a hidden or `PRIVATE` one is
      filtered at read time (still shown to the video's owner). Gateway: `/v1/playlists` and `/v1/me/watch-later`
      go to social-svc (`PathPrefix`), as does `/v1/videos/{id}/playlist-membership` (add it to the videos regex);
      `/v1/channels/{id}/playlists` already goes there.
  - name: cinema
    description: |
      Cinema catalogue and series (task CIN2, ADR-035). A REGULAR playlist marked `is_series` is a series ("Bộ phim");
      its episodes are its items in position order. **Playable** means: known to `social.videos` (READY), visibility
      `PUBLIC`, not hidden, and owned by the playlist owner. Only playable videos count as episodes, appear in the
      catalogue or get an episode number. social-svc returns ids only; clients hydrate titles and thumbnails with
      video-svc `batchGetVideos` (one call per page) and drop items that call omits. video-svc stays the final
      authority when a video is played.
  - name: posts
    description: |
      Posts (task SOC-2a, ADR-049 addendum 2026-10-28). Gateway: `/v1/posts`, `/v1/post-comments`, `/v1/feed` and
      `/v1/hashtags` go to social-svc (`PathPrefix`), as does `/v1/channels/{id}/posts`.

      A post has a plain-text `body` (≤ 2000 characters) and at most one attachment kind:
      - up to 10 images (`image_ids`: `POST` images from upload-svc `createImageUpload`, `READY`, owned by the caller,
        not used by another post), shown in the given order;
      - or one embedded Winkey video (`video_id`, known to `social.videos`, playable by the caller when posting);
      - or a reshare of another post (`reshare_of`), with or without text ("quote" when it has text).
      A post needs a non-empty trimmed body or an attachment. Images and the embedded video cannot be changed after
      posting; `editPost` changes `body` and `visibility` only.

      **Who sees a post** (`getPost`, feeds, timelines; otherwise `404`):
      - status `VISIBLE` (a `HIDDEN` post is shown only to moderators and admins; `DELETED` to nobody);
      - no block between the caller and the author, either direction;
      - the caller is the author, or the post is `PUBLIC` and the author's account is public, or the caller is an
        approved follower (`social.subscriptions`). A private account's posts are followers-only whatever their
        `visibility`.
      An embedded video the caller cannot play (deleted, hidden, `PRIVATE`) is returned as `video_id: null`;
      a reshared post the caller cannot see is returned as `reshared_post: null` with `reshare_unavailable: true`.

      **Mentions and hashtags** are parsed from `body` by social-svc on create and edit:
      - `@handle` (handle syntax of `PublicProfile`) of an active user who is not in a block relation with the author;
        at most 10 per post, extra or unknown handles stay plain text. A newly mentioned user gets `POST_MENTION`,
        unless they cannot see the post.
      - `#tag`: `#` followed by letters, digits and `_` (Unicode), 1–50 characters; at most 10 per post. Matched on the
        same slug as video tags (lower-case, Vietnamese diacritics removed, đ → d), so `#HàNội` and `#hanoi` are the
        same hashtag. Tags with an empty slug are ignored.
      Clients render `body` as text and link only the `@handle` / `#tag` tokens listed in `mentions` / `hashtags`
      (same token rules as above); never as HTML.

      **Reshares**: only a `PUBLIC` post of a public account can be reshared, and a reshare always points at the
      original (resharing a reshare reshares its original). One plain reshare per user and post (`409` code
      `ALREADY_RESHARED`); quotes are not limited. Resharing notifies the original author (`POST_RESHARE`).

      **Reactions**: one per user and post, one of `LIKE`, `LOVE`, `HAHA`, `WOW`, `SAD`, `ANGRY`; setting another
      kind replaces it. The author gets `POST_REACTION` once per reacting user and post.

      **Rate limits** (`429` with `Retry-After`): 30 posts per hour, 300 reaction changes per hour, 10 post comments
      per minute per user.

      Moderation: `POST` and `POST_COMMENT` are report targets; `moderatePost` / `moderatePostComment` hide or restore.
  - name: post-comments
    description: |
      Two-level comments on posts (task SOC-2a). Same rules as video comments: plain text ≤ 2000 characters, replies
      only to top-level comments, `DELETED` comments with replies stay as tombstones, `HIDDEN` ones only for moderators
      and admins. Commenting requires seeing the post; a block between the caller and the post author or (for a reply)
      the parent comment's author → `403` code `INTERACTION_BLOCKED`. The post author gets `POST_COMMENT`, the parent
      comment's author gets `POST_COMMENT_REPLY`. Deletable by the comment author, the post author, moderators and
      admins.
  - name: feeds
    description: |
      Feeds (task SOC-2a, ADR-049 §8). Every item is a `Post` the caller may see; posts by users in a block relation
      with the caller or muted by the caller are left out.
      - `getFollowingFeed` ("Đang theo dõi"): the caller's own posts and those of the accounts the caller follows,
        newest first (keyset on `created_at`, `id`). The first page may be cached up to 30 s per user.
      - `getExploreFeed` ("Khám phá"): `PUBLIC` posts of public accounts from the last 7 days, ranked by an
        engagement score with time decay (`(reactions + 2·comments + 3·reshares + 1) / (age_hours + 2)^1.5`),
        recomputed by social-svc at least every 10 minutes. Anonymous callers get it too.
      - `listHashtagPosts`: posts carrying a hashtag (slug or text), newest first.
      - `listChannelPosts`: one user's timeline, newest first (reshares included).
paths:
  /v1/videos/{video_id}/comments:
    parameters:
      - $ref: './common.yaml#/components/parameters/VideoId'
    get:
      tags: [comments]
      operationId: listComments
      summary: Top-level comments, newest first. Optional auth.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: './common.yaml#/components/parameters/Cursor'
        - $ref: './common.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: One page of top-level comments.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentPage'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'
    post:
      tags: [comments]
      operationId: createComment
      summary: Post a comment or a reply. Emits `social.comment.created`.
      description: |
        `parent_id` must be a top-level, non-deleted comment on the same video (only two levels).
        Rate limit per user: 10 comments per minute (`429` with `Retry-After`).
        SOC-1b: a block between the caller and the video owner, or (for a reply) the parent comment's author, in
        either direction → `403` code `INTERACTION_BLOCKED`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommentRequest'
      responses:
        '201':
          description: Created.
          headers:
            Location:
              description: '`/v1/comments/{comment_id}`'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'
        '409':
          $ref: './common.yaml#/components/responses/Conflict'
        '429':
          $ref: './common.yaml#/components/responses/TooManyRequests'

  /v1/comments/{comment_id}:
    parameters:
      - $ref: '#/components/parameters/CommentId'
    get:
      tags: [comments]
      operationId: getComment
      summary: One comment (deep link). Optional auth.
      security:
        - {}
        - bearerAuth: []
      responses:
        '200':
          description: The comment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'
    patch:
      tags: [comments]
      operationId: editComment
      summary: Edit the body (author only). Sets `edited_at`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditCommentRequest'
      responses:
        '200':
          description: Updated comment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'
        '409':
          $ref: './common.yaml#/components/responses/Conflict'
    delete:
      tags: [comments]
      operationId: deleteComment
      summary: Delete (author, video owner, moderator or admin). Idempotent.
      description: Sets `status = DELETED` and wipes the body. Deleting an already deleted comment returns `204`.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'

  /v1/comments/{comment_id}/replies:
    parameters:
      - $ref: '#/components/parameters/CommentId'
    get:
      tags: [comments]
      operationId: listReplies
      summary: Replies to a top-level comment, oldest first. Optional auth.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: './common.yaml#/components/parameters/Cursor'
        - $ref: './common.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: One page of replies.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentPage'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'

  /v1/comments/{comment_id}/moderation:
    parameters:
      - $ref: '#/components/parameters/CommentId'
    put:
      tags: [comments]
      operationId: moderateComment
      summary: Hide or restore a comment (moderator or admin).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModerateCommentRequest'
      responses:
        '200':
          description: Comment after moderation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'
        '409':
          $ref: './common.yaml#/components/responses/Conflict'

  /v1/videos/{video_id}/like:
    parameters:
      - $ref: './common.yaml#/components/parameters/VideoId'
    get:
      tags: [likes]
      operationId: getLike
      summary: Like count and whether the caller liked the video. Optional auth.
      security:
        - {}
        - bearerAuth: []
      responses:
        '200':
          description: Like state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LikeState'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'
    put:
      tags: [likes]
      operationId: likeVideo
      summary: Like (idempotent). Emits `social.video.like_changed` when the state changes.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Like state after the call.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LikeState'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'
        '429':
          $ref: './common.yaml#/components/responses/TooManyRequests'
    delete:
      tags: [likes]
      operationId: unlikeVideo
      summary: Remove the like (idempotent). Emits `social.video.like_changed` when the state changes.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Like state after the call.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LikeState'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'
        '429':
          $ref: './common.yaml#/components/responses/TooManyRequests'

  /v1/channels/{channel_id}/subscription:
    parameters:
      - $ref: '#/components/parameters/ChannelId'
    get:
      tags: [subscriptions]
      operationId: getSubscription
      summary: Subscriber count and whether the caller is subscribed. Optional auth.
      description: "Unknown channels return `subscriber_count` 0; social-svc does not validate that the user exists."
      security:
        - {}
        - bearerAuth: []
      responses:
        '200':
          description: Subscription state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionState'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
    put:
      tags: [subscriptions]
      operationId: subscribe
      summary: Subscribe (idempotent). Emits `social.subscription.changed` when the state changes.
      description: |
        The channel must be an active profile in `auth.public_profiles`; subscribing to yourself is `400`.

        SOC-1b: a block between the caller and the channel (either direction) → `404`. A **private** channel the
        caller does not follow yet: a follow request is created instead (idempotent), the channel gets a
        `FOLLOW_REQUEST` notification, the response has `subscribed = false, requested = true`, and no event is
        emitted. At most 200 pending outgoing requests per user (`409` code `LIMIT_REACHED`).
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Subscription state after the call.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionState'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'
        '429':
          $ref: './common.yaml#/components/responses/TooManyRequests'
    delete:
      tags: [subscriptions]
      operationId: unsubscribe
      summary: Unsubscribe (idempotent). Emits `social.subscription.changed` when the state changes.
      description: Also cancels the caller's pending follow request to this channel (SOC-1b).
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Subscription state after the call.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionState'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '429':
          $ref: './common.yaml#/components/responses/TooManyRequests'

  /v1/me/subscriptions:
    get:
      tags: [subscriptions]
      operationId: listMySubscriptions
      summary: Channels the caller subscribes to, most recent first.
      security:
        - bearerAuth: []
      parameters:
        - $ref: './common.yaml#/components/parameters/Cursor'
        - $ref: './common.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: One page of subscriptions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionPage'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'

  /v1/channels/{channel_id}/followers:
    parameters:
      - $ref: '#/components/parameters/ChannelId'
    get:
      tags: [subscriptions]
      operationId: listFollowers
      summary: Users who follow the channel, newest first (task SOC-1b). Optional auth.
      description: |
        A private channel: only the owner and its approved followers may read it; anyone else → `403` code
        `PRIVATE_ACCOUNT`. Users without an active profile and users in a block relation with the caller are left
        out. Unknown channel → empty page.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: './common.yaml#/components/parameters/Cursor'
        - $ref: './common.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: One page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FollowPage'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'

  /v1/channels/{channel_id}/following:
    parameters:
      - $ref: '#/components/parameters/ChannelId'
    get:
      tags: [subscriptions]
      operationId: listFollowing
      summary: Channels the user follows, newest first (task SOC-1b). Optional auth.
      description: Same visibility and filtering rules as `listFollowers`.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: './common.yaml#/components/parameters/Cursor'
        - $ref: './common.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: One page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FollowPage'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'

  /v1/channels/{channel_id}/relationship:
    parameters:
      - $ref: '#/components/parameters/ChannelId'
    get:
      tags: [relationships]
      operationId: getRelationship
      summary: The caller's relationship to another user (task SOC-1b).
      description: |
        Never reveals whether the other user blocks the caller. Asking about yourself → `400`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Relationship flags.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Relationship'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'

  /v1/me/follow-requests:
    get:
      tags: [subscriptions]
      operationId: listFollowRequests
      summary: Pending follow requests to the caller, newest first (task SOC-1b).
      description: Requesters without an active profile or in a block relation are left out.
      security:
        - bearerAuth: []
      parameters:
        - $ref: './common.yaml#/components/parameters/Cursor'
        - $ref: './common.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: One page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FollowRequestPage'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'

  /v1/me/follow-requests/{requester_id}/decision:
    parameters:
      - name: requester_id
        in: path
        required: true
        schema:
          $ref: './common.yaml#/components/schemas/Uuid'
    post:
      tags: [subscriptions]
      operationId: decideFollowRequest
      summary: Approve or reject a follow request (task SOC-1b).
      description: |
        No pending request from that user → `404`. `APPROVE`: in one transaction the request becomes a
        subscription (`social.subscription.changed` through the outbox, `NEW_SUBSCRIBER` notification to the
        caller as for a normal subscription) and the requester gets `FOLLOW_REQUEST_APPROVED`. `REJECT`: the
        request is deleted; the requester is not notified and may ask again.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FollowRequestDecision'
      responses:
        '204':
          description: Decided.
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'

  /v1/me/blocks:
    get:
      tags: [relationships]
      operationId: listMyBlocks
      summary: Users the caller blocks, newest first (task SOC-1b).
      security:
        - bearerAuth: []
      parameters:
        - $ref: './common.yaml#/components/parameters/Cursor'
        - $ref: './common.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: One page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelationPage'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'

  /v1/me/blocks/{user_id}:
    parameters:
      - $ref: '#/components/parameters/RelationUserId'
    put:
      tags: [relationships]
      operationId: blockUser
      summary: Block a user (idempotent, task SOC-1b).
      description: |
        The target must be an active profile (`404` otherwise); yourself → `400`. Effects are in the tag
        description; everything happens in one transaction.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Blocked.
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'
        '409':
          $ref: './common.yaml#/components/responses/Conflict'
        '429':
          $ref: './common.yaml#/components/responses/TooManyRequests'
    delete:
      tags: [relationships]
      operationId: unblockUser
      summary: Unblock a user (idempotent, task SOC-1b). Removed subscriptions are not restored.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Not blocked.
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '429':
          $ref: './common.yaml#/components/responses/TooManyRequests'

  /v1/me/mutes:
    get:
      tags: [relationships]
      operationId: listMyMutes
      summary: Users the caller mutes, newest first (task SOC-1b).
      security:
        - bearerAuth: []
      parameters:
        - $ref: './common.yaml#/components/parameters/Cursor'
        - $ref: './common.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: One page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelationPage'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'

  /v1/me/mutes/{user_id}:
    parameters:
      - $ref: '#/components/parameters/RelationUserId'
    put:
      tags: [relationships]
      operationId: muteUser
      summary: Mute a user (idempotent, task SOC-1b).
      description: The target must be an active profile (`404` otherwise); yourself → `400`.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Muted.
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'
        '409':
          $ref: './common.yaml#/components/responses/Conflict'
        '429':
          $ref: './common.yaml#/components/responses/TooManyRequests'
    delete:
      tags: [relationships]
      operationId: unmuteUser
      summary: Unmute a user (idempotent, task SOC-1b).
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Not muted.
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '429':
          $ref: './common.yaml#/components/responses/TooManyRequests'

  /v1/notifications:
    get:
      tags: [notifications]
      operationId: listNotifications
      summary: The caller's notifications, newest first (task N1).
      description: |
        Ordered by (`created_at`, `id`) descending; the cursor encodes that position. Filtering rules in the tag
        description. `Cache-Control: private, no-store`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: './common.yaml#/components/parameters/Cursor'
        - $ref: './common.yaml#/components/parameters/Limit'
        - name: unread
          in: query
          required: false
          description: '`true` returns only unread notifications.'
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: One page of notifications.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPage'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'

  /v1/notifications/unread-count:
    get:
      tags: [notifications]
      operationId: getUnreadNotificationCount
      summary: Number of unread notifications (capped at 100), for the badge (task N1).
      description: |
        Cheap enough to poll every 60 s (partial index on unread rows). Counts with the same filtering rules as
        `listNotifications`. `Cache-Control: private, no-store`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Unread count.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnreadCount'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'

  /v1/notifications/read:
    post:
      tags: [notifications]
      operationId: markNotificationsRead
      summary: Mark notifications as read (task N1).
      description: |
        Either `ids` (at most 100 of the caller's notifications; unknown or foreign ids are ignored) or
        `up_to` (every notification of the caller created at or before that time). Exactly one of the two.
        Idempotent: already-read notifications keep their original `read_at`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkNotificationsReadRequest'
      responses:
        '204':
          description: Marked.
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'

  /v1/playlists:
    post:
      tags: [playlists]
      operationId: createPlaylist
      summary: Create a playlist owned by the caller (task PL1).
      description: |
        At most 200 playlists per user (the watch-later list included) → `409` `PLAYLIST_LIMIT`. Rate limit
        30/min per user → `429`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlaylistRequest'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Playlist'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '409':
          $ref: './common.yaml#/components/responses/Conflict'
        '429':
          $ref: './common.yaml#/components/responses/TooManyRequests'

  /v1/playlists/{playlist_id}:
    parameters:
      - $ref: '#/components/parameters/PlaylistId'
    get:
      tags: [playlists]
      operationId: getPlaylist
      summary: One playlist. Optional auth.
      description: |
        `PRIVATE` playlists (and the watch-later list, always private) → `404` for everyone but the owner.
        `PUBLIC` and `UNLISTED` → anyone with the id. `Cache-Control: private, no-store`.
      security:
        - {}
        - bearerAuth: []
      responses:
        '200':
          description: The playlist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Playlist'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'
    patch:
      tags: [playlists]
      operationId: updatePlaylist
      summary: Rename, re-describe or change the visibility of an own playlist.
      description: |
        Owner only (others → `404`). The watch-later list cannot be changed → `409` `WATCH_LATER_IMMUTABLE`.
        Setting `is_series: true` while the playlist holds a video of another channel → `409` `SERIES_FOREIGN_ITEM`
        (nothing is removed silently). Setting it back to `false` always works.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePlaylistRequest'
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Playlist'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'
        '409':
          $ref: './common.yaml#/components/responses/Conflict'
    delete:
      tags: [playlists]
      operationId: deletePlaylist
      summary: Delete an own playlist and its items. The watch-later list cannot be deleted (`409`).
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'
        '409':
          $ref: './common.yaml#/components/responses/Conflict'

  /v1/playlists/{playlist_id}/items:
    parameters:
      - $ref: '#/components/parameters/PlaylistId'
    get:
      tags: [playlists]
      operationId: listPlaylistItems
      summary: Items in playlist order. Optional auth; same visibility rule as getPlaylist.
      description: |
        Ordered by `position` ascending. Items whose video is hidden, deleted, or `PRIVATE` (unless the caller
        owns that video) are not returned; `item_count` on the playlist counts all rows, so a page can hold fewer
        visible items than stored ones. Titles and thumbnails come from video-svc `batchGetVideos` (one call per
        page), never from social-svc.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: './common.yaml#/components/parameters/Cursor'
        - $ref: './common.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: One page of items.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaylistItemPage'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'
    post:
      tags: [playlists]
      operationId: addPlaylistItem
      summary: Append a video to an own playlist. Idempotent.
      description: |
        The video must be one the caller can currently read (known to social-svc, not hidden, not `PRIVATE` unless
        the caller owns it) → otherwise `404` `VIDEO_NOT_FOUND`. Already in the playlist → `200` with the existing
        item (position unchanged); new → `201`. At most 5 000 items per playlist → `409` `PLAYLIST_FULL`.
        A series (`is_series`) only accepts the owner's own videos → `409` `SERIES_FOREIGN_ITEM`.
        Rate limit 120/min per user → `429`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddPlaylistItemRequest'
      responses:
        '200':
          description: Already present.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaylistItem'
        '201':
          description: Added at the end.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaylistItem'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'
        '409':
          $ref: './common.yaml#/components/responses/Conflict'
        '429':
          $ref: './common.yaml#/components/responses/TooManyRequests'

  /v1/playlists/{playlist_id}/items/{video_id}:
    parameters:
      - $ref: '#/components/parameters/PlaylistId'
      - $ref: './common.yaml#/components/parameters/VideoId'
    delete:
      tags: [playlists]
      operationId: removePlaylistItem
      summary: Remove a video from an own playlist. Idempotent (`204` also when it was not there).
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Removed.
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'

  /v1/playlists/{playlist_id}/items/{video_id}/move:
    parameters:
      - $ref: '#/components/parameters/PlaylistId'
      - $ref: './common.yaml#/components/parameters/VideoId'
    post:
      tags: [playlists]
      operationId: movePlaylistItem
      summary: Move an item before another one, or to the end (`before_video_id` null).
      description: |
        Owner only. Item or `before_video_id` not in the playlist → `404`. Moving before itself is a no-op.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MovePlaylistItemRequest'
      responses:
        '200':
          description: The moved item with its new position.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaylistItem'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'

  /v1/channels/{channel_id}/playlists:
    parameters:
      - $ref: '#/components/parameters/ChannelId'
    get:
      tags: [playlists]
      operationId: listChannelPlaylists
      summary: Playlists of a channel, most recently updated first. Optional auth.
      description: |
        Others see only `PUBLIC` playlists (never `UNLISTED`, `PRIVATE` or watch-later). The owner sees all of
        theirs, the watch-later list first.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: './common.yaml#/components/parameters/Cursor'
        - $ref: './common.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: One page of playlists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaylistPage'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'

  /v1/videos/{video_id}/playlist-membership:
    parameters:
      - $ref: './common.yaml#/components/parameters/VideoId'
    get:
      tags: [playlists]
      operationId: getPlaylistMembership
      summary: Which of the caller's playlists contain this video (for the "Save" dialog).
      description: |
        Ids of the caller's own playlists (watch-later included) that contain `video_id`; empty when none or when
        the video is unknown. `Cache-Control: private, no-store`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Playlist ids.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaylistMembership'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'

  /v1/me/watch-later:
    get:
      tags: [playlists]
      operationId: getWatchLater
      summary: The caller's watch-later playlist, created on first use.
      description: |
        Returns the `WATCH_LATER` playlist (always `PRIVATE`, one per user), creating it if needed. Add and remove
        videos with the normal item endpoints using its `id`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The watch-later playlist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Playlist'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'

  /v1/reports:
    post:
      tags: [moderation]
      operationId: createReport
      summary: Report a video, a comment or a user (any signed-in user).
      description: |
        The target must exist and be visible to the reporter (otherwise `404`); reporting yourself or
        your own content → `400`. A second report by the same user on the same target while the first
        is still `OPEN` returns the existing report with `200`. Rate limit per user: 20 reports per hour
        (`429`). The reporter never learns the outcome through this API.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReportRequest'
      responses:
        '201':
          description: Report created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportReceipt'
        '200':
          description: An open report by the same user on the same target already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportReceipt'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'
        '429':
          $ref: './common.yaml#/components/responses/TooManyRequests'

  /v1/moderation/reports:
    get:
      tags: [moderation]
      operationId: listReports
      summary: Moderation queue (moderator or admin).
      description: |
        Reports grouped by target: one item per (target_type, target_id) with its open report count and
        the most recent reports. `status=OPEN` (default) sorts by the oldest open report first, so the
        longest-waiting target is on top; other statuses sort by `resolved_at` descending.
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ReportStatus'
        - name: target_type
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ReportTargetType'
        - $ref: './common.yaml#/components/parameters/Cursor'
        - $ref: './common.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: One page of moderation cases.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModerationCasePage'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'

  /v1/moderation/cases/{target_type}/{target_id}/resolution:
    parameters:
      - name: target_type
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/ReportTargetType'
      - name: target_id
        in: path
        required: true
        schema:
          $ref: './common.yaml#/components/schemas/Uuid'
    put:
      tags: [moderation]
      operationId: resolveModerationCase
      summary: Close every OPEN report on one target (moderator or admin).
      description: |
        Sets `status`, `resolved_by`, `resolution_note` and `resolved_at` on all OPEN reports of the
        target in one statement and returns how many changed. No OPEN report → `404`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveCaseRequest'
      responses:
        '200':
          description: Reports closed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolveCaseResult'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'


  /v1/cinema/catalog:
    get:
      tags: [cinema]
      operationId: listCinemaCatalog
      summary: Public cinema catalogue (series and standalone videos), newest first. Optional auth.
      description: |
        Same answer for every caller (personal state is never included), `Cache-Control: public, max-age=60`.
        - `SERIES`: a `PUBLIC` playlist with `is_series` and at least one playable episode. Ordered by the time its
          newest playable episode was added (`updated_at`).
        - `VIDEO`: a playable video that is not an episode of any `PUBLIC` series. Ordered by `added_at` (when
          social-svc saw `video.ready`).
        - `kind=all` interleaves both by that timestamp, newest first; ties break on id descending.
        The cursor is opaque and stable under inserts (keyset on timestamp + id). A video in several public series
        is hidden as a standalone item and appears under each series.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: kind
          in: query
          required: false
          schema:
            type: string
            enum: [all, series, video]
            default: all
        - $ref: './common.yaml#/components/parameters/Cursor'
        - name: limit
          in: query
          required: false
          description: At most 48, so one `batchGetVideos` call (50 ids) can hydrate a page.
          schema:
            type: integer
            minimum: 1
            maximum: 48
            default: 24
      responses:
        '200':
          description: One page of catalogue items.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CinemaCatalogPage'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'

  /v1/series:
    get:
      tags: [cinema]
      operationId: listSeriesForVideo
      summary: Public series that contain a video as a playable episode (task CIN3, ADR-045). Optional auth.
      description: |
        Lets the watch page show the episode list when the link has no `?playlist=` (search, history, Google, a
        shared link). Returns at most 5 series, newest `updated_at` first; clients use the first one and then call
        `getSeriesEpisode`. Same rules as `listSeriesEpisodes`: only `PUBLIC` playlists with `is_series` whose
        episode list contains `video_id` as a **playable** episode. An unknown, non-playable or non-episode video
        is an empty list (never 404). `Cache-Control: public, max-age=60`.
        Gateway: `/v1/series` already goes to social-svc.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: video_id
          in: query
          required: true
          schema:
            $ref: './common.yaml#/components/schemas/Uuid'
      responses:
        '200':
          description: The series containing the video (possibly empty).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeriesForVideo'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'

  /v1/series/{playlist_id}/episodes:
    parameters:
      - $ref: '#/components/parameters/PlaylistId'
    get:
      tags: [cinema]
      operationId: listSeriesEpisodes
      summary: Playable episodes of a public series, in playlist order. Optional auth.
      description: |
        `404` `SERIES_NOT_FOUND` unless the playlist exists, is `PUBLIC`, has `is_series` and at least one playable
        episode (the owner gets the same answer: owners manage their lists through the playlist endpoints).
        `episode_number` is 1-based over playable episodes only, so it has no gaps. `Cache-Control: public, max-age=60`.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: './common.yaml#/components/parameters/Cursor'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 48
            default: 48
      responses:
        '200':
          description: The series and one page of episodes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeriesEpisodePage'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'

  /v1/series/{playlist_id}/episodes/{video_id}:
    parameters:
      - $ref: '#/components/parameters/PlaylistId'
      - $ref: './common.yaml#/components/parameters/VideoId'
    get:
      tags: [cinema]
      operationId: getSeriesEpisode
      summary: Context of one episode for the watch page (number, previous, next). Optional auth.
      description: |
        Used by the watch page when the link carries `?playlist=<id>`. `404` `SERIES_NOT_FOUND` as in
        `listSeriesEpisodes`; `404` `EPISODE_NOT_FOUND` when the video is not a playable episode of that series (the
        client then plays the video without series context, never guessing another series). `previous_video_id` /
        `next_video_id` are the neighbouring playable episodes, null at the ends; `page_cursor` is the
        `listSeriesEpisodes` cursor of the page (default limit) that contains this episode, null for the first page.
        `Cache-Control: public, max-age=60`.
      security:
        - {}
        - bearerAuth: []
      responses:
        '200':
          description: Episode context.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeriesEpisodeContext'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'

  /v1/posts:
    post:
      tags: [posts]
      operationId: createPost
      summary: Publish a post (text, images, an embedded video, or a reshare).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePostRequest'
      responses:
        '201':
          description: Created.
          headers:
            Location:
              description: '`/v1/posts/{post_id}`'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'
        '409':
          $ref: './common.yaml#/components/responses/Conflict'
        '429':
          $ref: './common.yaml#/components/responses/TooManyRequests'

  /v1/posts/{post_id}:
    parameters:
      - $ref: '#/components/parameters/PostId'
    get:
      tags: [posts]
      operationId: getPost
      summary: One post (deep link). Optional auth.
      security:
        - {}
        - bearerAuth: []
      responses:
        '200':
          description: The post.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'
    patch:
      tags: [posts]
      operationId: editPost
      summary: Edit the body and/or visibility (author only). Sets `edited_at` when the body changes.
      description: |
        Mentions and hashtags are re-parsed from the new body; only users mentioned for the first time are notified.
        A reshare cannot become `FOLLOWERS` (`409` code `RESHARE_VISIBILITY`); a post that has reshares may become
        `FOLLOWERS`, and its reshares then show it as unavailable to non-followers. Editing a reshare to an empty body is
        allowed only when it is not the user's second plain reshare of that post (`409` code `ALREADY_RESHARED`).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditPostRequest'
      responses:
        '200':
          description: Updated post.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'
        '409':
          $ref: './common.yaml#/components/responses/Conflict'
    delete:
      tags: [posts]
      operationId: deletePost
      summary: Delete (author, moderator or admin). Idempotent.
      description: |
        Sets `status = DELETED`, wipes the body and removes its images, reactions, hashtags and mentions; comments stay
        for moderation history but are no longer reachable. Reshares remain and show the original as unavailable.
        The post's images become unreferenced and are removed by storage-gc after 48 hours.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'

  /v1/posts/{post_id}/moderation:
    parameters:
      - $ref: '#/components/parameters/PostId'
    put:
      tags: [posts]
      operationId: moderatePost
      summary: Hide or restore a post (moderator or admin).
      security:
        - bearerAuth: []
      requestBody:
