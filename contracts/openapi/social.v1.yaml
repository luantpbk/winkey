components:
  securitySchemes:
    bearerAuth:
      $ref: './common.yaml#/components/securitySchemes/bearerAuth'

  parameters:
    CommentId:
      name: comment_id
      in: path
      required: true
      schema:
        $ref: './common.yaml#/components/schemas/Uuid'
    ChannelId:
      name: channel_id
      in: path
      required: true
      description: User id of the channel owner.
      schema:
        $ref: './common.yaml#/components/schemas/Uuid'
    RelationUserId:
      name: user_id
      in: path
      required: true
      description: User id of the other user.
      schema:
        $ref: './common.yaml#/components/schemas/Uuid'
    PlaylistId:
      name: playlist_id
      in: path
      required: true
      schema:
        $ref: './common.yaml#/components/schemas/Uuid'

    PostId:
      name: post_id
      in: path
      required: true
      schema:
        $ref: './common.yaml#/components/schemas/Uuid'

  schemas:
    CommentStatus:
      type: string
      enum: [VISIBLE, DELETED, HIDDEN]

    Comment:
      type: object
      required:
        [id, video_id, parent_id, author, body, status, reply_count, created_at, edited_at, can_edit, can_delete]
      properties:
        id:
          $ref: './common.yaml#/components/schemas/Uuid'
        video_id:
          $ref: './common.yaml#/components/schemas/Uuid'
        parent_id:
          description: '`null` for a top-level comment.'
          oneOf:
            - $ref: './common.yaml#/components/schemas/Uuid'
            - type: 'null'
        author:
          description: '`null` when the author no longer has an active profile.'
          oneOf:
            - $ref: './common.yaml#/components/schemas/PublicProfile'
            - type: 'null'
        body:
          type: string
          maxLength: 2000
          description: Empty for `DELETED` tombstones.
        status:
          $ref: '#/components/schemas/CommentStatus'
        reply_count:
          type: integer
          minimum: 0
          description: Visible replies; always 0 for a reply.
        created_at:
          type: string
          format: date-time
        edited_at:
          type: [string, 'null']
          format: date-time
        can_edit:
          type: boolean
          description: The caller is the author and the comment is VISIBLE.
        can_delete:
          type: boolean
          description: The caller is the author, the video owner, a moderator or an admin.

    CommentPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Comment'
        next_cursor:
          type: [string, 'null']

    CreateCommentRequest:
      type: object
      additionalProperties: false
      required: [body]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 2000
          description: Plain text. Leading/trailing whitespace is trimmed; the trimmed body must not be empty.
        parent_id:
          $ref: './common.yaml#/components/schemas/Uuid'

    EditCommentRequest:
      type: object
      additionalProperties: false
      required: [body]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 2000

    ModerateCommentRequest:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [HIDDEN, VISIBLE]
          description: '`409` if the comment is `DELETED`.'

    LikeState:
      type: object
      required: [video_id, liked, like_count]
      properties:
        video_id:
          $ref: './common.yaml#/components/schemas/Uuid'
        liked:
          type: boolean
        like_count:
          type: integer
          minimum: 0

    SubscriptionState:
      type: object
      required: [channel_id, subscribed, subscriber_count]
      properties:
        channel_id:
          $ref: './common.yaml#/components/schemas/Uuid'
        subscribed:
          type: boolean
        requested:
          type: boolean
          description: |
            The caller has a pending follow request to this private channel (SOC-1b). Sent by every SOC-1b server;
            clients treat a missing value as false.
        subscriber_count:
          type: integer
          minimum: 0

    Subscription:
      type: object
      required: [channel, subscribed_at]
      properties:
        channel:
          $ref: './common.yaml#/components/schemas/PublicProfile'
        subscribed_at:
          type: string
          format: date-time

    SubscriptionPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Subscription'
        next_cursor:
          type: [string, 'null']

    NotificationKind:
      type: string
      description: |
        `VIDEO_PUBLISHED` — a channel you subscribe to published a video (actor = channel, `video_id` set); sent
        once, when the video first becomes `PUBLIC` (`UNLISTED` never notifies).
        `VIDEO_COMMENT` — someone left a top-level comment on your video (`video_id`, `comment_id`).
        `COMMENT_REPLY` — someone replied to your comment (`video_id`, `comment_id` = the reply).
        `NEW_SUBSCRIBER` — someone subscribed to your channel (only the first time per subscriber).
        `FOLLOW_REQUEST` — someone asked to follow your private account (SOC-1b; only the first time per requester).
        `FOLLOW_REQUEST_APPROVED` — your follow request was approved (actor = the account you now follow).
        `POST_COMMENT` — someone commented on your post (SOC-2a; `post_id`, `post_comment_id`).
        `POST_COMMENT_REPLY` — someone replied to your post comment (`post_id`, `post_comment_id` = the reply).
        `POST_MENTION` — someone mentioned you in a post (`post_id`; once per post).
        `POST_RESHARE` — someone reshared your post (`post_id` = the reshare).
        `POST_REACTION` — someone reacted to your post (`post_id`; once per reacting user and post).
        No notification is created between users in a block relation, or for a muter from a muted actor. A post
        notification whose post or comment is gone, hidden or no longer visible to the recipient is not returned.
        Clients ignore kinds they do not know.
      enum:
        - VIDEO_PUBLISHED
        - VIDEO_COMMENT
        - COMMENT_REPLY
        - NEW_SUBSCRIBER
        - FOLLOW_REQUEST
        - FOLLOW_REQUEST_APPROVED
        - POST_COMMENT
        - POST_COMMENT_REPLY
        - POST_MENTION
        - POST_RESHARE
        - POST_REACTION

    Notification:
      type: object
      additionalProperties: false
      required: [id, kind, actor, video_id, comment_id, created_at, read_at]
      properties:
        id:
          $ref: './common.yaml#/components/schemas/Uuid'
        kind:
          $ref: '#/components/schemas/NotificationKind'
        actor:
          $ref: './common.yaml#/components/schemas/PublicProfile'
        video_id:
          type: [string, 'null']
          format: uuid
        comment_id:
          type: [string, 'null']
          format: uuid
        post_id:
          type: [string, 'null']
          format: uuid
          description: Set for `POST_*` kinds (SOC-2a). Sent by every SOC-2a server; a missing value means `null`.
        post_comment_id:
          type: [string, 'null']
          format: uuid
          description: Set for `POST_COMMENT` and `POST_COMMENT_REPLY`. A missing value means `null`.
        created_at:
          type: string
          format: date-time
        read_at:
          type: [string, 'null']
          format: date-time

    NotificationPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
        next_cursor:
          type: [string, 'null']

    UnreadCount:
      type: object
      additionalProperties: false
      required: [count, capped]
      properties:
        count:
          type: integer
          minimum: 0
          maximum: 100
        capped:
          type: boolean
          description: '`true` when there are more than 100 unread notifications (show "99+").'

    MarkNotificationsReadRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      maxProperties: 1
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            $ref: './common.yaml#/components/schemas/Uuid'
        up_to:
          type: string
          format: date-time

    PlaylistKind:
      type: string
      enum: [REGULAR, WATCH_LATER]

    Playlist:
      type: object
      additionalProperties: false
      required: [id, owner, kind, title, description, visibility, item_count, created_at, updated_at]
      properties:
        id:
          $ref: './common.yaml#/components/schemas/Uuid'
        owner:
          $ref: './common.yaml#/components/schemas/PublicProfile'
        kind:
          $ref: '#/components/schemas/PlaylistKind'
        title:
          type: string
          minLength: 1
          maxLength: 150
          description: '"Xem sau" for the watch-later list (the client localises by `kind`).'
        description:
          type: string
          maxLength: 5000
        visibility:
          $ref: './common.yaml#/components/schemas/Visibility'
        is_series:
          type: boolean
          description: |
            Marked by the owner as a series ("Bộ phim", task CIN2). Always false for the watch-later list. social-svc
            always sends it; it is optional in the schema only so clients built before CIN2 stay valid (absent = false).
        item_count:
          type: integer
          minimum: 0
          maximum: 5000
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          description: Last change to the playlist or its items.

    PlaylistPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Playlist'
        next_cursor:
          type: [string, 'null']

    CreatePlaylistRequest:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 150
        description:
          type: string
          maxLength: 5000
          default: ''
        visibility:
          $ref: './common.yaml#/components/schemas/Visibility'
          description: Defaults to `PRIVATE`.
        is_series:
          type: boolean
          description: Mark as a series ("Bộ phim", task CIN2); absent = false. A new playlist is empty, so this never conflicts.

    UpdatePlaylistRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 150
        description:
          type: string
          maxLength: 5000
        visibility:
          $ref: './common.yaml#/components/schemas/Visibility'
        is_series:
          type: boolean
          description: See `updatePlaylist` for `409` `SERIES_FOREIGN_ITEM`.

    PlaylistItem:
      type: object
      additionalProperties: false
      required: [video_id, position, added_at]
      properties:
        video_id:
          $ref: './common.yaml#/components/schemas/Uuid'
        position:
          type: integer
          description: Opaque sort key (ascending). Not contiguous; do not show it to users.
        added_at:
          type: string
          format: date-time

    PlaylistItemPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PlaylistItem'
        next_cursor:
          type: [string, 'null']

    AddPlaylistItemRequest:
      type: object
      additionalProperties: false
      required: [video_id]
      properties:
        video_id:
          $ref: './common.yaml#/components/schemas/Uuid'

    MovePlaylistItemRequest:
      type: object
      additionalProperties: false
      required: [before_video_id]
      properties:
        before_video_id:
          type: [string, 'null']
          format: uuid
          description: Place the item right before this one; `null` moves it to the end.

    PlaylistMembership:
      type: object
      additionalProperties: false
      required: [playlist_ids]
      properties:
        playlist_ids:
          type: array
          maxItems: 200
          uniqueItems: true
          items:
            $ref: './common.yaml#/components/schemas/Uuid'

    ReportTargetType:
      type: string
      enum: [VIDEO, COMMENT, USER, POST, POST_COMMENT]
      description: '`POST` and `POST_COMMENT` since SOC-2a; `target_id` is the post or post comment id.'

    ReportReason:
      type: string
      enum: [SPAM, HARASSMENT, HATE, SEXUAL, VIOLENCE, COPYRIGHT, MISINFORMATION, OTHER]

    ReportStatus:
      type: string
      enum: [OPEN, ACTIONED, DISMISSED]

    CreateReportRequest:
      type: object
      additionalProperties: false
      required: [target_type, target_id, reason]
      properties:
        target_type:
          $ref: '#/components/schemas/ReportTargetType'
        target_id:
          $ref: './common.yaml#/components/schemas/Uuid'
        reason:
          $ref: '#/components/schemas/ReportReason'
        note:
          type: string
          maxLength: 500
          default: ''

    ReportReceipt:
      type: object
      required: [id, created_at]
      properties:
        id:
          $ref: './common.yaml#/components/schemas/Uuid'
        created_at:
          type: string
          format: date-time

    Report:
      type: object
      required: [id, reporter, reason, note, status, created_at]
      properties:
        id:
          $ref: './common.yaml#/components/schemas/Uuid'
        reporter:
          oneOf:
            - $ref: './common.yaml#/components/schemas/PublicProfile'
            - type: 'null'
        reason:
          $ref: '#/components/schemas/ReportReason'
        note:
          type: string
        status:
          $ref: '#/components/schemas/ReportStatus'
        created_at:
          type: string
          format: date-time

    ModerationCase:
      type: object
      required: [target_type, target_id, status, open_count, first_reported_at, reasons, reports, resolution]
      properties:
        target_type:
          $ref: '#/components/schemas/ReportTargetType'
        target_id:
          $ref: './common.yaml#/components/schemas/Uuid'
        status:
          $ref: '#/components/schemas/ReportStatus'
        open_count:
          type: integer
          minimum: 0
        first_reported_at:
          type: string
          format: date-time
        reasons:
          type: object
          description: 'Count of reports per reason, e.g. `{"SPAM": 3, "HATE": 1}`.'
          additionalProperties:
            type: integer
            minimum: 1
        reports:
          type: array
          maxItems: 5
          description: The five most recent reports of this case.
          items:
            $ref: '#/components/schemas/Report'
        resolution:
          description: Null while OPEN.
          oneOf:
            - type: 'null'
            - type: object
              required: [resolved_by, note, resolved_at]
              properties:
                resolved_by:
                  $ref: './common.yaml#/components/schemas/Uuid'
                note:
                  type: [string, 'null']
                resolved_at:
                  type: string
                  format: date-time

    ModerationCasePage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ModerationCase'
        next_cursor:
          type: [string, 'null']

    ResolveCaseRequest:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ACTIONED, DISMISSED]
        note:
          type: string
          maxLength: 500

    ResolveCaseResult:
      type: object
      required: [resolved_count]
      properties:
        resolved_count:
          type: integer
          minimum: 1

    SeriesSummary:
      type: object
      additionalProperties: false
      required: [playlist_id, title, description, owner, episode_count, first_video_id, updated_at]
      properties:
        playlist_id:
          $ref: './common.yaml#/components/schemas/Uuid'
        title:
          type: string
        description:
          type: string
        owner:
          $ref: './common.yaml#/components/schemas/PublicProfile'
        episode_count:
          type: integer
          minimum: 1
          description: Playable episodes only (never PL1 `item_count`).
        first_video_id:
          $ref: './common.yaml#/components/schemas/Uuid'
          description: First playable episode; its thumbnail is the series cover and "Xem ngay" starts here.
        updated_at:
          type: string
          format: date-time

    SeriesForVideo:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/SeriesSummary'

    CinemaCatalogItem:
      oneOf:
        - $ref: '#/components/schemas/CinemaCatalogSeries'
        - $ref: '#/components/schemas/CinemaCatalogVideo'
      discriminator:
        propertyName: kind
        mapping:
          SERIES: '#/components/schemas/CinemaCatalogSeries'
          VIDEO: '#/components/schemas/CinemaCatalogVideo'

    CinemaCatalogSeries:
      type: object
      additionalProperties: false
      required: [kind, series]
      properties:
        kind:
          type: string
          const: SERIES
        series:
          $ref: '#/components/schemas/SeriesSummary'

    CinemaCatalogVideo:
      type: object
      additionalProperties: false
      required: [kind, video_id, added_at]
      properties:
        kind:
          type: string
          const: VIDEO
        video_id:
          $ref: './common.yaml#/components/schemas/Uuid'
        added_at:
          type: string
          format: date-time

    CinemaCatalogPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          maxItems: 48
          items:
            $ref: '#/components/schemas/CinemaCatalogItem'
        next_cursor:
          type: [string, 'null']

    SeriesEpisode:
      type: object
      additionalProperties: false
      required: [video_id, episode_number]
      properties:
        video_id:
          $ref: './common.yaml#/components/schemas/Uuid'
        episode_number:
          type: integer
          minimum: 1

    SeriesEpisodePage:
      type: object
      additionalProperties: false
      required: [series, items, next_cursor]
      properties:
        series:
          $ref: '#/components/schemas/SeriesSummary'
        items:
          type: array
          maxItems: 48
          items:
            $ref: '#/components/schemas/SeriesEpisode'
        next_cursor:
          type: [string, 'null']

    SeriesEpisodeContext:
      type: object
      additionalProperties: false
      required: [series, episode_number, previous_video_id, next_video_id, page_cursor]
      properties:
        series:
          $ref: '#/components/schemas/SeriesSummary'
        episode_number:
          type: integer
          minimum: 1
        previous_video_id:
          oneOf:
            - $ref: './common.yaml#/components/schemas/Uuid'
            - type: 'null'
        next_video_id:
          oneOf:
            - $ref: './common.yaml#/components/schemas/Uuid'
            - type: 'null'
        page_cursor:
          type: [string, 'null']

    FollowItem:
      type: object
      additionalProperties: false
      required: [user, followed_at]
      properties:
        user:
          $ref: './common.yaml#/components/schemas/PublicProfile'
        followed_at:
          type: string
          format: date-time

    FollowPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FollowItem'
        next_cursor:
          type: [string, 'null']

    FollowRequest:
      type: object
      additionalProperties: false
      required: [requester, requested_at]
      properties:
        requester:
          $ref: './common.yaml#/components/schemas/PublicProfile'
        requested_at:
          type: string
          format: date-time

    FollowRequestPage:
      type: object
      required: [items, next_cursor, pending_count]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FollowRequest'
        next_cursor:
          type: [string, 'null']
        pending_count:
          type: integer
          minimum: 0

    FollowRequestDecision:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision:
          type: string
          enum: [APPROVE, REJECT]

    Relationship:
      type: object
      additionalProperties: false
      required: [user_id, following, follow_requested, followed_by, blocking, muting]
      properties:
        user_id:
          $ref: './common.yaml#/components/schemas/Uuid'
        following:
          type: boolean
        follow_requested:
          type: boolean
          description: The caller has a pending request to this user.
        followed_by:
          type: boolean
        blocking:
          type: boolean
          description: The caller blocks this user.
        muting:
          type: boolean

    RelationItem:
      type: object
      additionalProperties: false
      required: [user, since]
      properties:
        user:
          $ref: './common.yaml#/components/schemas/PublicProfile'
        since:
          type: string
          format: date-time

    RelationPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RelationItem'
        next_cursor:
          type: [string, 'null']

    PostVisibility:
      type: string
      enum: [PUBLIC, FOLLOWERS]
      description: A private account's posts are followers-only whatever this value says.

    PostStatus:
      type: string
      enum: [VISIBLE, DELETED, HIDDEN]

    ReactionKind:
      type: string
      enum: [LIKE, LOVE, HAHA, WOW, SAD, ANGRY]

    PostImage:
      type: object
      additionalProperties: false
      required: [id, url, thumb_url, width, height]
      properties:
        id:
          $ref: './common.yaml#/components/schemas/Uuid'
        url:
          type: string
          format: uri
          description: WebP, long edge ≤ 1600 px (`MEDIA_BASE_URL` + image key).
        thumb_url:
          type: string
          format: uri
          description: WebP, long edge ≤ 400 px.
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1

    PostMention:
      type: object
      additionalProperties: false
      required: [user_id, handle]
      properties:
        user_id:
          $ref: './common.yaml#/components/schemas/Uuid'
        handle:
          type: string
          description: Current handle; the body keeps the handle as written.

    PostHashtag:
      type: object
      additionalProperties: false
      required: [tag, slug]
      properties:
        tag:
          type: string
          description: As first written in the body, without `#`.
        slug:
          type: string

    ReactionCount:
      type: object
      additionalProperties: false
      required: [reaction, count]
      properties:
        reaction:
          $ref: '#/components/schemas/ReactionKind'
        count:
          type: integer
          minimum: 1

    Post:
      type: object
      additionalProperties: false
      required:
        - id
        - author
        - body
        - visibility
        - status
        - images
        - video_id
        - reshare_of
        - reshared_post
        - reshare_unavailable
        - mentions
        - hashtags
        - reaction_count
        - top_reactions
        - my_reaction
        - comment_count
        - reshare_count
        - created_at
        - edited_at
        - can_edit
        - can_delete
      properties:
        id:
          $ref: './common.yaml#/components/schemas/Uuid'
        author:
          description: '`null` when the author no longer has an active profile.'
          oneOf:
            - $ref: './common.yaml#/components/schemas/PublicProfile'
            - type: 'null'
        body:
          type: string
          maxLength: 2000
        visibility:
          $ref: '#/components/schemas/PostVisibility'
        status:
          $ref: '#/components/schemas/PostStatus'
        images:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/PostImage'
        video_id:
          description: Embedded Winkey video, or `null` (none, or the caller cannot play it). Hydrate with video-svc `batchGetVideos`.
          oneOf:
            - $ref: './common.yaml#/components/schemas/Uuid'
            - type: 'null'
        reshare_of:
          description: Id of the reshared original, or `null`.
          oneOf:
            - $ref: './common.yaml#/components/schemas/Uuid'
            - type: 'null'
        reshared_post:
          description: |
            The original, one level deep (its own `reshared_post` is always `null`), or `null` when this is not a reshare
            or the caller cannot see the original.
          oneOf:
            - $ref: '#/components/schemas/Post'
            - type: 'null'
        reshare_unavailable:
          type: boolean
          description: This is a reshare whose original is deleted, hidden, or not visible to the caller.
        mentions:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/PostMention'
        hashtags:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/PostHashtag'
        reaction_count:
          type: integer
          minimum: 0
        top_reactions:
          type: array
          maxItems: 3
          description: The most used reaction kinds on this post, most used first.
          items:
            $ref: '#/components/schemas/ReactionCount'
        my_reaction:
          description: The caller's reaction; `null` when none or anonymous.
          oneOf:
            - $ref: '#/components/schemas/ReactionKind'
            - type: 'null'
        comment_count:
          type: integer
          minimum: 0
        reshare_count:
          type: integer
          minimum: 0
        created_at:
          type: string
          format: date-time
        edited_at:
          type: [string, 'null']
          format: date-time
        can_edit:
          type: boolean
          description: The caller is the author and the post is VISIBLE.
        can_delete:
          type: boolean
          description: The caller is the author, a moderator or an admin.

    PostPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Post'
        next_cursor:
          type: [string, 'null']

    CreatePostRequest:
      type: object
      additionalProperties: false
      properties:
        body:
          type: string
          maxLength: 2000
          default: ''
          description: Plain text, trimmed. Required (non-empty after trimming) unless an attachment is given.
        visibility:
          $ref: '#/components/schemas/PostVisibility'
          description: Defaults to `PUBLIC`. A reshare must be `PUBLIC`.
        image_ids:
          type: array
          minItems: 1
          maxItems: 10
          uniqueItems: true
          description: |
            `POST` images, `READY`, owned by the caller and not used by another post; otherwise `400` code
            `IMAGE_INVALID`. Exclusive with `video_id` and `reshare_of`.
          items:
            $ref: './common.yaml#/components/schemas/Uuid'
        video_id:
          $ref: './common.yaml#/components/schemas/Uuid'
          description: A Winkey video the caller can play (`PUBLIC` or `UNLISTED`, or the caller's own); otherwise `404`.
        reshare_of:
          $ref: './common.yaml#/components/schemas/Uuid'
          description: |
            A post the caller can see, `PUBLIC`, by a public account; otherwise `404` (cannot see) or `409` code
            `NOT_RESHAREABLE`. A reshare of a reshare points at its original.

    EditPostRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        body:
          type: string
          maxLength: 2000
          description: The trimmed body may be empty only if the post has an attachment.
        visibility:
          $ref: '#/components/schemas/PostVisibility'

    SetReactionRequest:
      type: object
      additionalProperties: false
      required: [reaction]
      properties:
        reaction:
          $ref: '#/components/schemas/ReactionKind'

    ReactionState:
      type: object
      additionalProperties: false
      required: [post_id, my_reaction, reaction_count, top_reactions]
      properties:
        post_id:
          $ref: './common.yaml#/components/schemas/Uuid'
        my_reaction:
          oneOf:
            - $ref: '#/components/schemas/ReactionKind'
            - type: 'null'
        reaction_count:
          type: integer
          minimum: 0
        top_reactions:
          type: array
          maxItems: 3
          items:
            $ref: '#/components/schemas/ReactionCount'

    ReactionItem:
      type: object
      additionalProperties: false
      required: [user, reaction, created_at]
      properties:
        user:
          $ref: './common.yaml#/components/schemas/PublicProfile'
        reaction:
          $ref: '#/components/schemas/ReactionKind'
        created_at:
          type: string
          format: date-time

    ReactionPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReactionItem'
        next_cursor:
          type: [string, 'null']

    PostComment:
      type: object
      additionalProperties: false
      required:
        [id, post_id, parent_id, author, body, status, reply_count, created_at, edited_at, can_edit, can_delete]
      properties:
        id:
          $ref: './common.yaml#/components/schemas/Uuid'
        post_id:
          $ref: './common.yaml#/components/schemas/Uuid'
        parent_id:
          description: '`null` for a top-level comment.'
          oneOf:
            - $ref: './common.yaml#/components/schemas/Uuid'
            - type: 'null'
        author:
          description: '`null` when the author no longer has an active profile.'
          oneOf:
            - $ref: './common.yaml#/components/schemas/PublicProfile'
            - type: 'null'
        body:
          type: string
          maxLength: 2000
          description: Empty for `DELETED` tombstones.
        status:
          $ref: '#/components/schemas/CommentStatus'
        reply_count:
          type: integer
          minimum: 0
        created_at:
          type: string
          format: date-time
        edited_at:
          type: [string, 'null']
          format: date-time
        can_edit:
          type: boolean
          description: The caller is the author and the comment is VISIBLE.
        can_delete:
          type: boolean
          description: The caller is the comment author, the post author, a moderator or an admin.

    PostCommentPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PostComment'
        next_cursor:
          type: [string, 'null']

    TrendingHashtag:
      type: object
      additionalProperties: false
      required: [tag, slug, post_count]
      properties:
        tag:
          type: string
          description: The most used spelling in the window.
        slug:
          type: string
        post_count:
          type: integer
          minimum: 1

    TrendingHashtags:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/TrendingHashtag'
