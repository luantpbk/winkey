<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Winkey · Trang chủ mobile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0;background:#0A0A0D}
a{color:#F4F4F6;text-decoration:none}a:hover{color:#fff}
.m-tab{flex:1 1 0;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:600;color:#8E8E99}
.m-tab.is-active{color:#FFFFFF}
</style>
</helmet>
<div style="width: 390px; height: 2000px; box-sizing: border-box; position: relative; background: #0A0A0D; color: #F4F4F6; font-family: 'Be Vietnam Pro', system-ui, sans-serif; overflow: hidden">
  <header style="position: absolute; top: 0; left: 0; right: 0; z-index: 10; height: 56px; padding: 0 8px 0 16px; display: flex; align-items: center; gap: 8px; background: linear-gradient(180deg, rgba(10,10,13,.85), rgba(10,10,13,0))">
    <a href="#" aria-label="Winkey, trang chủ" style="display: flex; align-items: center; gap: 8px"><span style="width: 28px; height: 28px; border-radius: 7px; background: #FF0033; display: inline-flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="#fff"><path d="M7 4.5v15l12-7.5z"></path></svg></span><span style="font-size: 19px; font-weight: 800">Winkey</span></a>
    <button aria-label="Tìm kiếm" style="margin-left: auto; width: 44px; height: 44px; border: 0; background: transparent; color: #fff; display: inline-flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg></button>
  </header>
  <nav aria-label="Lọc nhanh" style="position: absolute; top: 56px; left: 0; right: 0; z-index: 10; padding: 0 16px; display: flex; gap: 8px">
    <a href="#" style="height: 32px; padding: 0 14px; border-radius: 999px; border: 1px solid rgba(255,255,255,.45); font-size: 13px; font-weight: 600; display: inline-flex; align-items: center">Thịnh hành</a>
    <a href="#" style="height: 32px; padding: 0 14px; border-radius: 999px; border: 1px solid rgba(255,255,255,.45); font-size: 13px; font-weight: 600; display: inline-flex; align-items: center">Khám phá</a>
    <a href="#" style="height: 32px; padding: 0 14px; border-radius: 999px; border: 1px solid rgba(255,255,255,.45); font-size: 13px; font-weight: 600; display: inline-flex; align-items: center">Của tôi</a>
  </nav>

  <section aria-label="Nổi bật" style="position: relative; height: 560px; padding-top: 104px; box-sizing: border-box">
    <div style="margin: 0 16px; height: 456px; border-radius: 12px; position: relative; overflow: hidden; background: radial-gradient(100% 90% at 60% 30%, #4B2E7A 0%, #1A1230 65%, #0A0A0D 100%); box-shadow: 0 12px 40px rgba(0,0,0,.6)">
      <span style="position: absolute; left: 12px; top: 12px; padding: 4px 8px; border: 1px dashed rgba(255,255,255,.35); border-radius: 6px; color: rgba(255,255,255,.7); font-size: 11px">[Thumbnail, cắt giữa; không phát xem trước trên mobile]</span>
      <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 260px; background: linear-gradient(180deg, rgba(10,10,13,0), rgba(10,10,13,.95))"></div>
      <div style="position: absolute; left: 16px; right: 16px; bottom: 18px; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center">
        <span style="display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700"><span style="padding: 2px 6px; border-radius: 4px; background: #FF0033">TOP 1</span>Thịnh hành hôm nay</span>
        <h1 style="margin: 0; font-size: 28px; line-height: 1.12; font-weight: 800; letter-spacing: -.5px">[Tiêu đề video #1 thịnh hành]</h1>
        <span style="font-size: 13px; color: #C9C9D1">[Tên kênh] · 24:18 · [N] lượt xem</span>
        <div style="display: flex; gap: 10px; width: 100%">
          <a href="#" style="flex: 1 1 0; height: 44px; border-radius: 6px; background: #fff; color: #0A0A0D; font-weight: 700; font-size: 15px; display: inline-flex; align-items: center; justify-content: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l12-7.5z"></path></svg>Xem ngay</a>
          <button style="flex: 1 1 0; height: 44px; border-radius: 6px; border: 0; background: rgba(110,110,125,.45); color: #fff; font: 700 15px 'Be Vietnam Pro', system-ui, sans-serif; display: inline-flex; align-items: center; justify-content: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>Xem sau</button>
        </div>
      </div>
    </div>
    <div aria-hidden="true" style="display: flex; justify-content: center; gap: 6px; margin-top: 12px"><span style="width: 20px; height: 4px; border-radius: 2px; background: #FF0033"></span><span style="width: 8px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.3)"></span><span style="width: 8px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.3)"></span><span style="width: 8px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.3)"></span><span style="width: 8px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.3)"></span></div>
  </section>

  <main style="padding-top: 28px; display: flex; flex-direction: column; gap: 28px">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
      <section>
        <h2 style="margin: 0; padding: 0 16px 10px; font-size: 18px; font-weight: 700; display: flex; align-items: center; justify-content: space-between">{{r.title}}<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8E8E99" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></h2>
        <div style="display: flex; gap: 8px; padding: 0 16px; overflow: hidden">
          <sc-for list="{{r.cards}}" as="c" hint-placeholder-count="3">
            <a href="#" style="flex: 0 0 auto; width: 158px">
              <span style="{{c.tone}}; display: block; position: relative; aspect-ratio: 16/9; border-radius: 6px; overflow: hidden"><span style="position: absolute; right: 4px; bottom: 4px; padding: 1px 5px; border-radius: 3px; background: rgba(10,10,13,.82); font-size: 11px; font-weight: 600">{{c.duration}}</span><span style="{{c.bar}}"></span></span>
              <span style="display: block; padding-top: 6px; font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.title}}</span>
            </a>
          </sc-for>
        </div>
      </section>
    </sc-for>
  </main>

  <nav aria-label="Điều hướng chính" style="position: absolute; left: 0; right: 0; bottom: 0; z-index: 20; height: 64px; padding-bottom: 4px; display: flex; background: rgba(16,16,21,.96); border-top: 1px solid rgba(255,255,255,.08)">
    <a class="m-tab is-active" href="#" aria-current="page"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M3 11l9-7 9 7v9a1 1 0 01-1 1h-5v-6h-6v6H4a1 1 0 01-1-1z"></path></svg>Trang chủ</a>
    <a class="m-tab" href="#"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M15.5 8.5l-2 5-5 2 2-5z"></path></svg>Khám phá</a>
    <a class="m-tab" href="#" aria-label="Tải video lên"><span style="width: 40px; height: 30px; border-radius: 8px; border: 1.5px solid currentColor; display: inline-flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></span></a>
    <a class="m-tab" href="#"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 1112 0c0 7 3 8 3 8H3s3-1 3-8"></path><path d="M10 20a2 2 0 004 0"></path></svg>Thông báo</a>
    <a class="m-tab" href="#"><span style="width: 24px; height: 24px; border-radius: 6px; background: #3D5AFE; color: #fff; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center">L</span>Tôi</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":2000}}'>
class Component extends DCLogic {
  renderVals() {
    var tones = [['#1F4A5A', '#0E2129'], ['#5A2A2A', '#2A1212'], ['#2E4A2A', '#13210F'], ['#5A4A24', '#2A2210'], ['#2A3A5E', '#111A2E'], ['#4A2450', '#200F24'], ['#24504A', '#0F2421']];
    var durs = ['12:04', '8:33', '24:18', '3:47', '41:50'];
    function cards(off, progress) {
      var out = [];
      for (var i = 0; i < 3; i++) {
        var t = tones[(off + i) % tones.length];
        out.push({
          title: '[Tiêu đề video ' + (off + i + 1) + ']',
          duration: durs[(off + i) % durs.length],
          tone: 'background: radial-gradient(120% 120% at 70% 30%, ' + t[0] + ' 0%, ' + t[1] + ' 70%)',
          bar: progress ? 'position: absolute; left: 0; bottom: 0; height: 3px; background: #FF0033; width: ' + [62, 18, 81][i] + '%' : 'display: none'
        });
      }
      return out;
    }
    return {
      rows: [
        { title: 'Xem tiếp', cards: cards(0, true) },
        { title: 'Top 10 hôm nay', cards: cards(3, false) },
        { title: 'Dành cho bạn', cards: cards(6, false) },
        { title: 'Mới cập nhật', cards: cards(9, false) },
        { title: '[Danh sách phát tuyển chọn]', cards: cards(12, false) }
      ]
    };
  }
}
</script>
</body>
</html>
