apiVersion: v1
kind: Pod
metadata:
  name: r2-verify-test
  namespace: default
spec:
  restartPolicy: Never
  containers:
    - name: rclone
      image: rclone/rclone:1.69.1
      env:
        - name: RCLONE_CONFIG_R2_TYPE
          value: s3
        - name: RCLONE_CONFIG_R2_PROVIDER
          value: Cloudflare
        - name: RCLONE_CONFIG_R2_REGION
          value: auto
        - name: RCLONE_CONFIG_R2_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: r2-migration
              key: S3_ENDPOINT
        - name: RCLONE_CONFIG_R2_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: r2-migration
              key: S3_ACCESS_KEY_ID
        - name: RCLONE_CONFIG_R2_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: r2-migration
              key: S3_SECRET_ACCESS_KEY
      command:
        - sh
        - -c
        - |
          echo "=== Testing R2 Connection via r2-migration secret ==="
          rclone lsd r2:
          echo ""
          echo "=== Checking Buckets ==="
          for b in winkey-raw winkey-media winkey-pg-backup winkey-backup; do
            echo -n "Bucket $b: "
            if rclone lsf r2:$b >/dev/null 2>&1; then
              echo "OK (accessible)"
            else
              echo "FAIL or Not Found"
            fi
          done
