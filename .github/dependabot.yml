version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'ci'
    groups:
      actions:
        patterns:
          - '*'

  # Maintain root & workspace Node dependencies
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'deps'
    groups:
      npm:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  # Maintain Go dependencies across all Go modules
  - package-ecosystem: 'gomod'
    directories:
      - '/libs/go'
      - '/services/video'
      - '/services/upload'
      - '/services/transcoder'
      - '/services/analytics'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'deps(go)'
    groups:
      gomod:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  # Maintain Docker Compose dependencies in deploy/gpu-01/analytics and systest
  - package-ecosystem: 'docker-compose'
    directories:
      - '/deploy/gpu-01/analytics'
      - '/systest'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'deploy'
    groups:
      compose:
        patterns:
          - '*'
        update-types:
          - 'patch'
    ignore:
      - dependency-name: '*'
        update-types:
          - 'version-update:semver-major'
          - 'version-update:semver-minor'

  # Maintain container images in Kubernetes manifests
  - package-ecosystem: 'docker'
    directories:
      - '/deploy/k8s/data'
      - '/deploy/k8s/edge'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'deploy(k8s)'
    groups:
      k8s-images:
        patterns:
          - '*'
        update-types:
          - 'patch'
    ignore:
      - dependency-name: '*'
        update-types:
          - 'version-update:semver-major'
          - 'version-update:semver-minor'
