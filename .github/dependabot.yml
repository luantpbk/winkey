version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'ci'
    groups:
      actions:
        patterns:
          - '*'

  # Maintain root & workspace Node dependencies
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'deps'
    groups:
      npm:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  # Maintain Go dependencies across all Go modules
  - package-ecosystem: 'gomod'
    directories:
      - '/libs/go'
      - '/services/video'
      - '/services/upload'
      - '/services/transcoder'
      - '/services/analytics'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'deps(go)'
    groups:
      gomod:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  # Maintain Docker Compose dependencies in deploy/compose
  - package-ecosystem: 'docker-compose'
    directory: '/deploy/compose'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'deploy'
    groups:
      compose:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
