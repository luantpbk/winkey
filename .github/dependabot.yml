version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'ci'

  # Maintain root & workspace Node dependencies
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'deps'

  # Maintain Go dependencies in libs/go
  - package-ecosystem: 'gomod'
    directory: '/libs/go'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'deps(libs/go)'

  # Maintain Docker dependencies in deploy/compose
  - package-ecosystem: 'docker'
    directory: '/deploy/compose'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'deploy'
