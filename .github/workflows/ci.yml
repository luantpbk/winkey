name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    name: detect changes
    runs-on: ubuntu-24.04
    outputs:
      root_ts: ${{ steps.filter.outputs.root_ts }}
      ts_workspaces: ${{ steps.filter.outputs.ts_workspaces }}
      go_libs: ${{ steps.filter.outputs.go_libs }}
      go_upload: ${{ steps.filter.outputs.go_upload }}
      go_transcoder: ${{ steps.filter.outputs.go_transcoder }}
      go_video: ${{ steps.filter.outputs.go_video }}
      go_analytics: ${{ steps.filter.outputs.go_analytics }}
      deploy_k8s: ${{ steps.filter.outputs.deploy_k8s }}
      deploy_lt2: ${{ steps.filter.outputs.deploy_lt2 }}
      loadtest: ${{ steps.filter.outputs.loadtest }}
      e2e: ${{ steps.filter.outputs.e2e }}
      wasm_e2ee: ${{ steps.filter.outputs.wasm_e2ee }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            wasm_e2ee:
              - 'apps/web/e2ee-wasm/**'
              - 'apps/web/public/wasm/**'
              - '.github/workflows/ci.yml'
            deploy_lt2:
              - 'deploy/lt2/**'
              - '.github/workflows/ci.yml'
            loadtest:
              - 'loadtest/**'
              - '.github/workflows/ci.yml'
            e2e:
              - 'e2e/**'
              - '.github/workflows/ci.yml'
            deploy_k8s:
              - 'deploy/k8s/**'
              - '.github/workflows/ci.yml'
            root_ts:
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'eslint.config.*'
              - '.prettier*'
              - '.github/workflows/ci.yml'
            ts_workspaces:
              - 'contracts/openapi/**'
              - 'apps/**'
              - 'packages/**'
              - 'services/auth/**'
              - 'services/social/**'
              - 'services/realtime/**'
              - 'services/chat/**'
            go_libs:
              - 'libs/go/**'
              - 'go.work*'
              - '.golangci.yml'
              - '.github/workflows/ci.yml'
            go_upload:
              - 'services/upload/**'
              - 'libs/go/**'
              - 'db/migrations/**'
              - 'go.work*'
              - '.github/workflows/ci.yml'
            go_transcoder:
              - 'services/transcoder/**'
              - 'libs/go/**'
              - 'db/migrations/**'
              - 'go.work*'
              - '.github/workflows/ci.yml'
            go_video:
              - 'services/video/**'
              - 'libs/go/**'
              - 'db/migrations/**'
              - 'go.work*'
              - '.github/workflows/ci.yml'
            go_analytics:
              - 'services/analytics/**'
              - 'libs/go/**'
              - 'db/clickhouse/**'
              - 'go.work*'
              - '.github/workflows/ci.yml'

  root-lint:
    name: root lint & format
    # Runs on every PR: prettier covers YAML/JSON/Markdown outside the TS workspaces too (~20s).
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.6.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm run lint:root

  ts-ci:
    name: ts monorepo (lint, typecheck, test, build)
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.root_ts == 'true' || needs.changes.outputs.ts_workspaces == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.6.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Turbo lint, typecheck, test, build
        env:
          # Container tests (PostgreSQL 17, NATS) must fail, not skip, on runners that have Docker.
          WINKEY_REQUIRE_DOCKER: '1'
        run: |
          pnpm run lint
          pnpm run typecheck
          pnpm run test
          pnpm run build

  go-ci:
    name: go (${{ matrix.module }})
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: libs/go
            filter_key: go_libs
          - module: services/upload
            filter_key: go_upload
          - module: services/transcoder
            filter_key: go_transcoder
          - module: services/video
            filter_key: go_video
          - module: services/analytics
            filter_key: go_analytics
    steps:
      - uses: actions/checkout@v7

      - name: Should run?
        id: gate
        env:
          IS_PUSH: ${{ github.event_name == 'push' }}
          OUTPUTS_JSON: ${{ toJSON(needs.changes.outputs) }}
          KEY: ${{ matrix.filter_key }}
        run: |
          if [ "$IS_PUSH" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            VAL=$(echo "$OUTPUTS_JSON" | grep -o "\"$KEY\": *\"true\"" || true)
            if [ -n "$VAL" ]; then
              echo "run=true" >> "$GITHUB_OUTPUT"
            else
              echo "skip: no changes in ${{ matrix.module }}"
              echo "run=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Module present?
        id: present
        if: steps.gate.outputs.run == 'true'
        run: |
          if [ -f "${{ matrix.module }}/go.mod" ]; then
            echo "yes=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip: ${{ matrix.module }} has no go.mod yet"
            echo "yes=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-go@v7
        if: steps.gate.outputs.run == 'true' && steps.present.outputs.yes == 'true'
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum

      # Same pinned static build as sim.yml (#459) and the transcoder images: apt-get install ffmpeg took > 30 min.
      - name: Cache ffmpeg (transcoder real-media tests)
        id: cache-ffmpeg
        if: steps.gate.outputs.run == 'true' && steps.present.outputs.yes == 'true' && matrix.module == 'services/transcoder'
        uses: actions/cache@v6
        with:
          path: |
            /home/runner/.local/bin/ffmpeg
            /home/runner/.local/bin/ffprobe
          key: ffmpeg-static-7.1.5-c1e6caf4

      - name: FFmpeg (transcoder real-media tests)
        if: steps.gate.outputs.run == 'true' && steps.present.outputs.yes == 'true' && matrix.module == 'services/transcoder'
        run: |
          if [ "${{ steps.cache-ffmpeg.outputs.cache-hit }}" != "true" ]; then
            mkdir -p /home/runner/.local/bin
            FFMPEG_URL="https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-07-31-14-10/ffmpeg-n7.1.5-12-g1fdbca85aa-linux64-gpl-7.1.tar.xz"
            FFMPEG_SHA="c1e6caf48923dd8e6bc5e54d51ba70c321175b8162ae9c414c392990e72f0e79"
            curl -fsSL "$FFMPEG_URL" -o /tmp/ffmpeg.tar.xz
            echo "$FFMPEG_SHA  /tmp/ffmpeg.tar.xz" | sha256sum -c -
            tar -xJf /tmp/ffmpeg.tar.xz -C /home/runner/.local/bin --strip-components=2 --wildcards '*/bin/ffmpeg' '*/bin/ffprobe'
            rm -f /tmp/ffmpeg.tar.xz
            chmod +x /home/runner/.local/bin/ffmpeg /home/runner/.local/bin/ffprobe
          fi
          sudo ln -sf /home/runner/.local/bin/ffmpeg /usr/local/bin/ffmpeg
          sudo ln -sf /home/runner/.local/bin/ffprobe /usr/local/bin/ffprobe
          ffmpeg -version | head -n 1

      - name: vet
        if: steps.gate.outputs.run == 'true' && steps.present.outputs.yes == 'true'
        working-directory: ${{ matrix.module }}
        run: go vet ./...

      - name: test (race, containers required)
        if: steps.gate.outputs.run == 'true' && steps.present.outputs.yes == 'true'
        working-directory: ${{ matrix.module }}
        env:
          WINKEY_REQUIRE_DOCKER: '1'
        run: go test -race -count=1 -timeout 20m ./...

      - name: cross-build (linux/arm64, windows/amd64)
        if: steps.gate.outputs.run == 'true' && steps.present.outputs.yes == 'true'
        working-directory: ${{ matrix.module }}
        run: |
          GOOS=linux GOARCH=arm64 go build ./...
          GOOS=windows GOARCH=amd64 go build ./...

  k8s-ci:
    name: k8s (kustomize & kubeconform)
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.deploy_k8s == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install kustomize & kubeconform
        run: |
          curl -sL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.6.0/kustomize_v5.6.0_linux_amd64.tar.gz | tar xz
          sudo mv kustomize /usr/local/bin/
          curl -sL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/
      - name: Verify data migrations in sync with db/migrations
        run: |
          diff -r db/migrations deploy/k8s/data/migrations
          for f in $(ls deploy/k8s/data/migrations); do
            grep -q "$f" deploy/k8s/data/kustomization.yaml || { echo "ERROR: $f missing from deploy/k8s/data/kustomization.yaml"; exit 1; }
          done
      - name: Validate kustomize build
        run: |
          kustomize build deploy/k8s/data
          kustomize build deploy/k8s/apps
      - name: Validate schemas with kubeconform
        run: |
          kubeconform -strict -summary -skip IngressRoute,Middleware -schema-location default deploy/k8s/edge/*.yaml
          kustomize build deploy/k8s/data | kubeconform -strict -summary -schema-location default -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/988ca70b50376c40ec7cf5099d041081f6ae1ffd/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          kustomize build deploy/k8s/apps | kubeconform -strict -summary -schema-location default
      - name: 'Verify apps deployment specifications (part-of: winkey, probes, resources)'
        run: |
          for app in auth upload video social realtime chat web; do
            manifest="deploy/k8s/apps/$app"
            output=$(kustomize build "$manifest")
            echo "Checking $app deployment..."
            echo "$output" | grep -q "app.kubernetes.io/part-of: winkey" || { echo "ERROR: $app missing part-of: winkey"; exit 1; }
            echo "$output" | grep -q "readinessProbe:" || { echo "ERROR: $app missing readinessProbe"; exit 1; }
            echo "$output" | grep -q "livenessProbe:" || { echo "ERROR: $app missing livenessProbe"; exit 1; }
            echo "$output" | grep -q "resources:" || { echo "ERROR: $app missing resources"; exit 1; }
            echo "$output" | grep -q "requests:" || { echo "ERROR: $app missing resource requests"; exit 1; }
            echo "$output" | grep -q "limits:" || { echo "ERROR: $app missing resource limits"; exit 1; }
          done
          echo "All apps deployments meet DoD specifications."

  lt2-ci:
    name: lt2 offline regression & watchdog tests
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.deploy_lt2 == 'true' || needs.changes.outputs.loadtest == 'true' || needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Platform watchdog offline tests
        run: |
          if compgen -G "deploy/lt2/*.test.mjs" > /dev/null; then
            node --test deploy/lt2/*.test.mjs
          else
            echo "ERROR: deploy/lt2/*.test.mjs expected but not found!"
            exit 1
          fi

      - name: Loadtest offline unit tests
        run: |
          if compgen -G "loadtest/*.test.mjs" > /dev/null; then
            node --test loadtest/*.test.mjs
          else
            echo "skip: no loadtest/*.test.mjs present on this branch yet."
          fi

      - name: E2E / AG1 offline regressions
        run: |
          if [ -d "e2e/tests/lt2-regressions" ] && [ -f "e2e/tests/adapters/k6-register.mjs" ]; then
            echo "Running E2E LT2 regressions with k6 adapter..."
            node --import ./e2e/tests/adapters/k6-register.mjs --test e2e/tests/lt2-regressions/*.regression.test.mjs
          elif compgen -G "e2e/*.test.mjs" > /dev/null; then
            node --test e2e/*.test.mjs
          else
            echo "skip: no e2e regressions present on this branch yet."
          fi

  verify-wasm:
    name: verify vodozemac wasm build
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.wasm_e2ee == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Assert e2ee-wasm crate exists
        run: |
          if [ ! -f "apps/web/e2ee-wasm/Cargo.toml" ]; then
            echo "ERROR: apps/web/e2ee-wasm/Cargo.toml missing!" >&2
            exit 1
          fi

      - name: Set up Rust toolchain (pinned 1.99.1)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'
          targets: wasm32-unknown-unknown

      - name: Cache wasm-pack
        id: cache-wasm-pack
        uses: actions/cache@v6
        with:
          path: /home/runner/.cargo/bin/wasm-pack
          key: wasm-pack-0.15.0-v2

      - name: Install wasm-pack (pinned 0.15.0)
        if: steps.cache-wasm-pack.outputs.cache-hit != 'true'
        run: |
          mkdir -p /home/runner/.cargo/bin
          curl -sSL https://github.com/wasm-bindgen/wasm-pack/releases/download/v0.15.0/wasm-pack-v0.15.0-x86_64-unknown-linux-musl.tar.gz | tar -xz -C /tmp
          mv /tmp/wasm-pack-v0.15.0-x86_64-unknown-linux-musl/wasm-pack /home/runner/.cargo/bin/wasm-pack
          chmod +x /home/runner/.cargo/bin/wasm-pack
          rm -rf /tmp/wasm-pack-v0.15.0-x86_64-unknown-linux-musl

      - name: Verify wasm-pack version
        run: |
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          /home/runner/.cargo/bin/wasm-pack --version
          WASM_PACK_VERSION="$(/home/runner/.cargo/bin/wasm-pack --version)"
          echo "Active wasm-pack: $WASM_PACK_VERSION"
          if [[ "$WASM_PACK_VERSION" != *"0.15.0"* ]]; then
            echo "ERROR: expected wasm-pack 0.15.0, got: $WASM_PACK_VERSION" >&2
            exit 1
          fi

      - name: Build wasm-pack release
        working-directory: apps/web/e2ee-wasm
        run: |
          /home/runner/.cargo/bin/wasm-pack build --target web --release

      - name: Upload built pkg artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vodozemac-wasm-pkg
          path: apps/web/e2ee-wasm/pkg/
          if-no-files-found: warn

      - name: Verify build artifacts match committed files
        run: |
          cmp apps/web/e2ee-wasm/pkg/vodozemac_winkey_bg.wasm apps/web/public/wasm/vodozemac_winkey_bg.wasm || {
            echo "ERROR: apps/web/e2ee-wasm/pkg/vodozemac_winkey_bg.wasm does not match apps/web/public/wasm/vodozemac_winkey_bg.wasm"
            exit 1
          }
          git status --porcelain apps/web/e2ee-wasm/pkg apps/web/public/wasm
          git diff --exit-code apps/web/e2ee-wasm/pkg apps/web/public/wasm
