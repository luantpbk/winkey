name: api-client

on:
  pull_request:
    paths:
      - 'packages/api-client/**'
      - 'contracts/openapi/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/api-client.yml'
  push:
    branches: [main]
    paths:
      - 'packages/api-client/**'
      - 'contracts/openapi/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/api-client.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Verify generated OpenAPI types are up to date
        run: pnpm --filter @winkey/api-client run check:generated
      - name: Typecheck
        run: pnpm --filter @winkey/api-client run typecheck
      - name: Test
        run: pnpm --filter @winkey/api-client run test
