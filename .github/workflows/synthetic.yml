---
name: synthetic

'on':
  schedule:
    - cron: '*/10 * * * *'
  pull_request:
    paths:
      - 'deploy/synthetic/**'
      - '.github/workflows/synthetic.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  monitor:
    name: synthetic monitoring
    runs-on: ubuntu-24.04
    timeout-minutes: 3

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Restore synthetic state cache
        uses: actions/cache@v4
        with:
          path: .synthetic-state
          key: synthetic-state-${{ github.run_id }}
          restore-keys: |
            synthetic-state-

      - name: Mask probe secrets
        env:
          PROBE_EMAIL: ${{ secrets.PROBE_EMAIL }}
          PROBE_PASSWORD: ${{ secrets.PROBE_PASSWORD }}
        run: |
          echo "::add-mask::$PROBE_EMAIL"
          echo "::add-mask::$PROBE_PASSWORD"

      - name: Run synthetic probe
        id: probe
        env:
          PROBE_EMAIL: ${{ secrets.PROBE_EMAIL }}
          PROBE_PASSWORD: ${{ secrets.PROBE_PASSWORD }}
          PROBE_BASE_URL: ${{ vars.PROBE_BASE_URL || 'https://winkey.vn' }}
        run: |
          mkdir -p .synthetic
          set +e
          node deploy/synthetic/probe.mjs 2>&1 | tee .synthetic/output.log
          PROBE_EXIT_CODE=${PIPESTATUS[0]}
          echo "exit_code=$PROBE_EXIT_CODE" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Manage alerts and job summary
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          node deploy/synthetic/alert-manager.mjs .synthetic/output.log
